<title id="title">Ravens Falcons Week 5 at a glance</title>
<desc id="desc">The Ravens beat the Falcons 30 to 23 in overtime and improve to 4 and 1. The Ravens rush for 208 yards. Tyler Huntley accounts for three touchdowns. Tyler Loop makes three field goals. Kyle Hamilton seals the win with an overtime interception.</desc>
