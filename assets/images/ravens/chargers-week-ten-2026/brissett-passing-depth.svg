<title id="title">WHERE BRISSETT CAN ATTACK</title><desc id="desc">In Arizona, Brissett went 30 of 56 for 508 yards, two touchdowns and +0.43 EPA per attempt at 10–19 air yards. At 20-plus air yards he went 6 of 29 for 167 yards, no touchdowns and three interceptions.</desc>
