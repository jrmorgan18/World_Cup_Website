<title id="title">Ravens Titans Week 4 at a glance</title>
<desc id="desc">The Ravens beat the Titans 24 to 18 and improve to 3 and 1. Tyler Loop hits a 64-yard field goal, the longest in M&amp;T Bank Stadium history. Lamar Jackson passes for 222 yards in the first half. Zay Flowers gains 118 receiving yards. The Ravens defense forces two turnovers.</desc>
