<title id="title">BENGALS at RAVENS</title><desc id="desc">The Ravens are 4-2 and rank 11th in Efficiency and sixth in DEPI through complete Week 6. Cincinnati is 3-2 and ranks seventh in both. Lamar Jackson averages 10.1 yards per attempt to Tyler Huntley's 6.0; both complete 70.8%. Jackson was ruled out Saturday.</desc>
