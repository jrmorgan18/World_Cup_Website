<title id="title">WEEK 7 AVAILABILITY</title><desc id="desc">Lamar Jackson is out after Saturday's downgrade. Tavius Robinson and Jaylinn Hawkins are out. Cam Jurgens has no designation, T.J. Tampa is doubtful and needs activation from IR, and Broderick Washington is questionable. Cincinnati has no game injury designations.</desc>
