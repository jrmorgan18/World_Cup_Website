<title id="title">RAVENS 20 · CHARGERS 23</title><desc id="desc">The Ravens lost 23–20 and fell to 4–6. Jacoby Brissett threw for 340 yards and the Ravens rushed for 16. The Chargers improved to 1–8, led 17–10 at halftime and rushed for 160 yards.</desc>
