<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc">
<title id="title">RAVENS 10 · JAGUARS 33</title><desc id="desc">The Ravens lost 33–10 to the Jaguars. Baltimore had 172 rushing yards, including a 65-yard touchdown by Justice Hill. Jacksonville led 17–3 at halftime and had 77 rushing yards.</desc>
