<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">STILL CLOSE. THEN OUT OF REACH.</title><desc id="desc">Buffalo led 16-7 at halftime and outscored the Ravens 20-3 in the second half.</desc><rect width="1200" height="600" fill="#09080c"/><rect width="1200" height="130" fill="#1d1427"/><rect width="1200" height="8" fill="#7c4dc4"/><text x="50" y="42" fill="#ab83ec" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">DUAL EIGHTS · FIRST AND FIVE · WEEK 8</text><text x="50" y="86" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">STILL CLOSE. THEN OUT OF REACH.</text><text x="50" y="116" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">The Ravens closed to 16–10. Buffalo scored the final 20 points.</text><rect x="50" y="160" width="525" height="255" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="75" y="202" fill="#ab83ec" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">FIRST HALF</text><text x="75" y="260" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">RAVENS</text><text x="473" y="260" fill="#ab83ec" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">7</text><rect x="75" y="277" width="126" height="14" rx="7" fill="#ab83ec"/><text x="75" y="350" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">BILLS</text><text x="473" y="350" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">16</text><rect x="75" y="367" width="288" height="14" rx="7" fill="#e8bc55"/><rect x="625" y="160" width="525" height="255" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="650" y="202" fill="#ab83ec" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">SECOND HALF</text><text x="650" y="260" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">RAVENS</text><text x="1048" y="260" fill="#ab83ec" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">3</text><rect x="650" y="277" width="54" height="14" rx="7" fill="#ab83ec"/><text x="650" y="350" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">BILLS</text><text x="1048" y="350" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">20</text><rect x="650" y="367" width="360" height="14" rx="7" fill="#e8bc55"/><text x="50" y="474" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">HALFTIME: BILLS 16–7</text><text x="50" y="515" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">FINAL: BILLS 36–10</text><text x="50" y="573" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">SOURCES: AUTHOR’S FIRST AND FIVE · OFFICIAL RAVENS / BILLS RECAPS</text></svg>
