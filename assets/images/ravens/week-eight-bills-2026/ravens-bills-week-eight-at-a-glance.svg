<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">RAVENS 10 · BILLS 36</title><desc id="desc">Buffalo beat the Ravens 36-10. The Ravens gained 144 total yards to Buffalo’s 426, allowed four sacks and 12 quarterback hits, and converted three of 13 third downs.</desc><rect width="1200" height="720" fill="#09080c"/><rect width="1200" height="130" fill="#1d1427"/><rect width="1200" height="8" fill="#7c4dc4"/><text x="50" y="42" fill="#ab83ec" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">DUAL EIGHTS · FIRST AND FIVE · WEEK 8</text><text x="50" y="86" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">RAVENS 10 · BILLS 36</text><text x="50" y="116" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Final · November 1, 2026 · Highmark Stadium</text><rect x="50" y="160" width="350" height="210" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="75" y="225" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800">4–4</text><text x="75" y="270" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Ravens record</text><text x="75" y="326" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Third consecutive defeat</text><rect x="425" y="160" width="350" height="210" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="450" y="225" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800">144</text><text x="450" y="270" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Ravens total yards</text><text x="450" y="326" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Buffalo: 426 total yards</text><rect x="800" y="160" width="350" height="210" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="825" y="225" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800">4 / 12</text><text x="825" y="270" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Sacks / QB hits allowed</text><text x="825" y="326" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Three Ravens QBs appeared</text><rect x="50" y="405" width="350" height="210" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="75" y="470" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800">3 of 13</text><text x="75" y="515" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Ravens third downs</text><text x="75" y="571" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">10 first downs for the game</text><rect x="425" y="405" width="350" height="210" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="450" y="470" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800">10 / 21</text><text x="450" y="515" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Fagnano completions / attempts</text><text x="450" y="571" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">91 yards · 1 INT · 1 lost fumble</text><rect x="800" y="405" width="350" height="210" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="825" y="470" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800">2</text><text x="825" y="515" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Ravens takeaways</text><text x="825" y="571" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-w