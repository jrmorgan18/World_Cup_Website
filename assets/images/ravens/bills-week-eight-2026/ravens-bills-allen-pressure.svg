<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="735" viewBox="0 0 1200 735" role="img" aria-labelledby="title desc"><title id="title">PRESSURE WITHOUT LOSING CONTAIN</title><desc id="desc">Rush lanes matter as much as getting near the quarterback</desc><rect width="1200" height="735" fill="#09080c"/><rect width="1200" height="135" fill="#1d1427"/><rect width="1200" height="8" fill="#7c4dc4"/><text x="50" y="42" fill="#a982e7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">DUAL EIGHTS · WEEK 8</text><text x="50" y="84" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">PRESSURE WITHOUT LOSING CONTAIN</text><text x="50" y="116" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Rush lanes matter as much as getting near the quarterback</text><rect x="50" y="165" width="535" height="285" rx="16" fill="#17131d" stroke="#49315f" stroke-width="2"/><rect x="615" y="165" width="535" height="285" rx="16" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="75" y="207" fill="#e5bb59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">JOSH ALLEN · THE ESCAPE THREAT</text><text x="75" y="278" fill="#a982e7" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800">240</text><text x="305" y="278" fill="#e5bb59" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800">8</text><text x="75" y="317" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">RUSH YARDS</text><text x="305" y="317" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">RUSH TD</text><text x="75" y="370" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">8.8 passing yards per attempt; nine</text><text x="75" y="403" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">passing touchdowns.</text><text x="640" y="207" fill="#e5bb59" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">TREY HENDRICKSON · THE RUSH</text><text x="640" y="278" fill="#a982e7" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800">29</text><text x="865" y="278" fill="#e5bb59" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">22.3%</text><text x="640" y="317" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">PRESSURES</text><text x="865" y="317" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">PRESSURE RATE</text><text x="640" y="370" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Five appearances. Pressure must come</text><text x="640" y="403" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">with rush-lane discipline.</text><rect x="50" y="485" width="1100" height="185" rx="16" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="75" y="529" fill="#e5bb59" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">FINISH THE PLAY</text><text x="75" y="574" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Allen has taken 12 sacks and thrown four interceptions. The Ravens need coordinated</text><text x="75" y="609" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">pressure that closes his escape routes.</text><text x="50" y="711" fill="#d0c8d9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">SOURCES: SEASON FIGURES IN AUTHOR’S PREVIEW · THROUGH WEEK 7</text></svg>
