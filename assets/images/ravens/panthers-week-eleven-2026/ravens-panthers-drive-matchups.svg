<text x="48" y="88" fill="#f7f4fb" font-size="40" font-weight="800">WHERE DRIVES CAN STAY ALIVE</text>
<text x="48" y="119" fill="#d0c8d9" font-size="23" font-weight="600">Carolina limits deep completions but has struggled to finish defensive possessions.</text>
