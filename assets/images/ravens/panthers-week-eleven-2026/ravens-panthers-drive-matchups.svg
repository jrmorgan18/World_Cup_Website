<title id="title">WHERE DRIVES CAN STAY ALIVE</title><desc id="desc">Carolina allows 20-yard gains on 4.9% of opposing passes, second best, but opponents convert 46.7% of third downs and score touchdowns on 20 of 26 red-zone trips, both 31st. Its coverage-disguise rate is 12.3% under Wash.</desc>
