<title id="title">RAVENS at FALCONS</title><desc id="desc">Through Week 4: Ravens 3–1, 29 points per game and 6.6 yards per play; Falcons 2–2, 24 points and 5.9 yards per play. Atlanta has allowed 193 rushing yards and generates pressure on 46.3 percent of dropbacks. Huntley completed eight of nine for 63 yards against Tennessee; the offense scored no points in five possessions.</desc>
