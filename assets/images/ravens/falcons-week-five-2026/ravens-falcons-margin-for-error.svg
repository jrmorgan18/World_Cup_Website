<title id="title">STAY OUT OF THIRD-AND-LONG</title><desc id="desc">The Ravens have converted two of 17 third downs needing seven or more yards, 11.8 percent. Atlanta forces three-and-outs on 29.5 percent of drives, fourth in the NFL. Only 32.5 percent of Ravens sets of downs reach third down, the lowest rate.</desc>
