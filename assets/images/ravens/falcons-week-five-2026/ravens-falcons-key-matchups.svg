<text x="50" y="115" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Stopping Henry is Atlanta’s strength. Containing Robinson is the Ravens’ challenge.</text>
