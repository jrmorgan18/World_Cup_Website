<title id="title">TWO VERY DIFFERENT RUN-GAME TESTS</title><desc id="desc">Through four games, Atlanta has allowed 193 rushing yards and 2.72 yards per carry. Bijan Robinson has 494 yards on 85 carries, 5.8 per attempt. The Ravens allow 100 rushing yards per game. Atlanta allows -0.28 EPA per rush and -0.02 per pass.</desc>
