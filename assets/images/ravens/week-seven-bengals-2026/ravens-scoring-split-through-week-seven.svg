<title id="title">THE HALFTIME PROBLEM</title><desc id="desc">Through seven games, the Ravens have outscored opponents 118-53 in first halves and have been outscored 114-51 after halftime, including overtime in Atlanta. That is a plus-65 first-half margin and minus-63 after halftime. They have been outscored 48-0 after halftime over their last two games.</desc>
