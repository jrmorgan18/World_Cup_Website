<title id="title">RAVENS 13 · BENGALS 35</title><desc id="desc">The Ravens fell to 4-3 and 0-2 in the division. They led 13-0 at halftime, then were outscored 35-0. Huntley passed for 298 yards, Flowers caught eight passes for 137 yards and a touchdown, Henry ran for 45 yards, and the Ravens committed 10 penalties for 57 yards.</desc>
