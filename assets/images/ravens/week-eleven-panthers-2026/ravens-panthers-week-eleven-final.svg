<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc">
<title id="title">RAVENS 33 · PANTHERS 35</title><desc id="desc">The Ravens lost 35–33 and fell to 4–7 after a sixth straight defeat. They gained 421 net yards but committed four turnovers. Carolina improved to 5–5 and won on a late field goal.</desc>
