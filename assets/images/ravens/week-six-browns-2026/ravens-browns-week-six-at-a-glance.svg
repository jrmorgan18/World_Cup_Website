<title id="title">Week 6 at a glance: Browns 13, Ravens 10</title>
<desc id="desc">Browns 13, Ravens 10. The Ravens fall to 4-2. They scored no points after the first two drives, finished with 235 offensive yards, and sacked Watson five times. Huntley passed for 165 yards, Henry rushed for 58, and Cuevas and Lane combined for 84 receiving yards.</desc>
