<text x="50" y="85" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" text-anchor="start" letter-spacing="0">RUN THREAT. PASSING OPPORTUNITY.</text>
<text x="50" y="115" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" letter-spacing="0">Why heavy personnel can matter even when Henry is not getting the ball</text>
<rect x="50" y="160" width="1100" height="285" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="80" y="205" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" text-anchor="start" letter-spacing="0">TITANS DEFENSE: EPA ALLOWED PER PLAY</text><text x="80" y="239" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0">Positive values favor the opposing offense; negative values favor the defense.</text><line x1="660" y1="263" x2="660" y2="410" stroke="#cfc8d5" stroke-width="2"/><text x="660" y="431" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">0</text><text x="80" y="307" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" text-anchor="start" letter-spacing="0">Rush</text><rect x="620.7" y="285" width="39.3" height="30" rx="4" fill="#9b6ee6"/><text x="1075" y="310" fill="#9b6ee6" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" text-anchor="end" letter-spacing="0">-0.04</text><text x="80" y="384" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" text-anchor="start" letter-spacing="0">Pass</text><rect x="660.0" y="362" width="132.4" height="30" rx="4" fill="#e8bc55"/><text x="1075" y="387" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" text-anchor="end" letter-spacing="0">+0.14</text><rect x="50" y="480" width="535" height="170" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="75" y="533" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" text-anchor="start" letter-spacing="0">55%</text><text x="75" y="578" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start" letter-spacing="0">Ravens 2+ TE usage</text><text x="75" y="617" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0">Sharp&#x27;s all-play personnel table</text><rect x="615" y="480" width="535" height="170" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="640" y="533" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" text-anchor="start" letter-spacing="0">71.1%</text><text x="640" y="578" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="start" letter-spacing="0">Completions allowed by TEN</text><text x="640" y="617" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0">59 completions on 83 attempts</text>
