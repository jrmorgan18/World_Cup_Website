<title id="title">RUN THREAT. PASSING OPPORTUNITY.</title><desc id="desc">Titans EPA allowed per rush is -0.04, versus +0.14 per pass. The Ravens use two or more tight ends on 55 percent of plays in Sharp&#x27;s public table. Tennessee allows a 71.1 percent completion rate.</desc>
