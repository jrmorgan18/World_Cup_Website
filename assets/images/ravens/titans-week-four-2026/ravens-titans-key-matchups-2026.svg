<text x="50" y="85" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" text-anchor="start" letter-spacing="0">THREE MATCHUPS THAT DECIDE IT</text>
<text x="50" y="115" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" letter-spacing="0">Protection inside · Difficult throws · Sound tackling</text>
<rect x="50" y="160" width="1100" height="158" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="80" y="221" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" text-anchor="start" letter-spacing="0">15</text><text x="80" y="261" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">Simmons pressures</text><text x="455" y="202" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="start" letter-spacing="0">Ioane vs. Simmons</text><text x="455" y="246" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="start" letter-spacing="0">Two sacks through three games.</text><text x="455" y="287" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">A rookie center faces the Titans&#x27; disruptor.</text><rect x="50" y="340" width="1100" height="158" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="80" y="401" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" text-anchor="start" letter-spacing="0">5.7</text><text x="80" y="441" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">Ward yards / attempt</text><text x="455" y="382" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="start" letter-spacing="0">Make Ward win it</text><text x="455" y="426" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="start" letter-spacing="0">504 passing yards on 88 attempts.</text><text x="455" y="467" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">Keep Tennessee in obvious passing downs.</text><rect x="50" y="520" width="1100" height="158" rx="18" fill="#17131d" stroke="#49315f" stroke-width="2"/><text x="80" y="581" fill="#e8bc55" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" text-anchor="start" letter-spacing="0">123</text><text x="80" y="621" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">Tate receiving yards</text><text x="455" y="562" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="start" letter-spacing="0">Finish the coverage rep</text><text x="455" y="606" fill="#cfc8d5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="start" letter-spacing="0">13 catches on 20 targets through Week 3.</text><text x="455" y="647" fill="#f7f4fb" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">Don&#x27;t let short completions become explosives.</text>
