<title id="title">THREE MATCHUPS THAT DECIDE IT</title><desc id="desc">Jeffery Simmons has 15 pressures and two sacks. Cam Ward averages 5.7 yards per attempt, with 504 yards on 88 attempts. Carnell Tate has 13 receptions for 123 yards on 20 targets.</desc>
