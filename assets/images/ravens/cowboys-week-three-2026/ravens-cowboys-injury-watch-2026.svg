<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">AVAILABILITY COULD CHANGE THE PLAN</title><desc id="desc">Baltimore is watching Flowers, Stanley, Madubuike and Buchanan. Dallas has ruled out Overshown, Durant, Hooker and Locke.</desc>
<rect width="1200" height="675" fill="#101114"/><rect width="1200" height="112" fill="#302065"/>
<text x="55" y="58" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" text-anchor="start">AVAILABILITY COULD CHANGE THE PLAN</text><text x="55" y="92" fill="#c4b8df" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">Week 3 injury watch · As of Friday, September 25</text>
<rect x="55" y="148" width="530" height="449" rx="24" fill="#191b23" stroke="#6843a4" stroke-width="1.5"/><rect x="615" y="148" width="530" height="449" rx="24" fill="#191b23" stroke="#6843a4" stroke-width="1.5"/><text x="80" y="194" fill="#dfb936" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">BALTIMORE · WATCH</text><text x="80" y="248" fill="#f4f4f7" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" text-anchor="start">Zay Flowers · hamstring</text><text x="80" y="281" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="start">Returned to the field Friday.</text><text x="80" y="312" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="start">Availability and workload uncertain.</text><text x="80" y="364" fill="#f4f4f7" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" text-anchor="start">Ronnie Stanley · toe</text><text x="80" y="397" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="start">Protection plan hinges on left tackle.</text><text x="80" y="449" fill="#f4f4f7" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" text-anchor="start">Madubuike + Buchanan</text><text x="80" y="482" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="start">Full practices Wednesday and Thursday.</text><text x="80" y="513" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">Buchanan expected back; Madubuike trending.</text><text x="80" y="563" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">Hendrickson · managing a broken finger</text><text x="640" y="194" fill="#dfb936" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">DALLAS · RULED OUT</text><text x="640" y="256" fill="#f4f4f7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">DeMarvion Overshown</text><text x="640" y="289" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="start">Linebacker</text><text x="640" y="347" fill="#f4f4f7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">Cobie Durant</text><text x="640" y="380" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="start">Cornerback</text><text x="640" y="438" fill="#f4f4f7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">Malik Hooker + P.J. Locke</text><text x="640" y="471" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="start">Safeties</text><text x="640" y="539" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">A depleted secondary and more responsibility</text><text x="640" y="570" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">for Dallas' rookie defenders.</text>
<text x="55" y="652" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start">DUAL EIGHTS · Reporting through Friday, September 25 · Check game-day inactives</text>
