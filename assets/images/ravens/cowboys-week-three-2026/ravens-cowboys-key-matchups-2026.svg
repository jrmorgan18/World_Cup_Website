<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">THREE MATCHUPS THAT DECIDE IT</title><desc id="desc">Henry and Lamar against Dallas run defense; Ravens pressure against Dak Prescott; CeeDee Lamb and Jake Ferguson against Ravens coverage.</desc>
<rect width="1200" height="675" fill="#101114"/><rect width="1200" height="112" fill="#302065"/>
<text x="55" y="58" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" text-anchor="start">THREE MATCHUPS THAT DECIDE IT</text><text x="55" y="92" fill="#c4b8df" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">Ravens–Cowboys · Week 3</text>
<rect x="55" y="137" width="1090" height="145" rx="24" fill="#191b23" stroke="#6843a4" stroke-width="1.5"/><circle cx="105" cy="209" r="31" fill="#4c338c"/><text x="105" y="220" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="middle">1</text><text x="160" y="178" fill="#f4f4f7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">Henry + Lamar vs. Dallas run fits</text><text x="160" y="217" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">Dallas has allowed 347 rushing yards, including an NFL-high 126 to quarterbacks.</text><text x="160" y="256" fill="#dfb936" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Baltimore's opportunity: force the edge and second level to choose.</text>
<rect x="55" y="299" width="1090" height="145" rx="24" fill="#191b23" stroke="#6843a4" stroke-width="1.5"/><circle cx="105" cy="371" r="31" fill="#4c338c"/><text x="105" y="382" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="middle">2</text><text x="160" y="340" fill="#f4f4f7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">Ravens pressure vs. Dak Prescott</text><text x="160" y="379" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">Baltimore's 43.8% pressure rate only matters if coverage delays the quick throw.</text><text x="160" y="418" fill="#dfb936" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">The key: create immediate interior pressure and make Prescott hesitate.</text>
<rect x="55" y="461" width="1090" height="145" rx="24" fill="#191b23" stroke="#6843a4" stroke-width="1.5"/><circle cx="105" cy="533" r="31" fill="#4c338c"/><text x="105" y="544" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" text-anchor="middle">3</text><text x="160" y="502" fill="#f4f4f7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">Lamb + Ferguson vs. Ravens coverage</text><text x="160" y="541" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="start">Lamb: 153 yards last week. Ferguson: two touchdowns against Washington.</text><text x="160" y="580" fill="#dfb936" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Hamilton's role: disguise, coverage and pressure cannot all be his job at once.</text>
<text x="55" y="652" fill="#b5b6c0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="start">DUAL EIGHTS · Baltimore wants to dictate on offense and finish possessions on defense</text>
</svg>
