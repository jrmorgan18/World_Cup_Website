title: "Dual Eights"
description: "An independent sports journal covering Baltimore baseball, Baltimore football, and the world’s game."
url: "https://jrmorgan18.github.io"
baseurl: "/World_Cup_Website"
permalink: /:categories/:title/
donation_cta_start: 2026-07-19

# Default image for social/link previews (Open Graph / Twitter cards)
# when a page has no hero_image or thumbnail of its own.
og_image: "/assets/images/og-default.jpg"

# Chat widget — remains on the existing World Cup worker until the new site is approved.
chat_worker_url: "https://world-cup-chat.jrmorgan16.workers.dev"

collections_dir: ""
markdown: kramdown
highlighter: rouge
future: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
