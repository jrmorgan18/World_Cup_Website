title: "Dual Eights"
# Emergency presentation rollback: change this to "legacy" and rebuild.
site_mode: dual_eights
description: "An independent sports journal covering Baltimore baseball, Baltimore football, and the world’s game."
url: "https://dualeights.com"
baseurl: ""
permalink: /:categories/:title/
donation_cta_start: 2026-07-19

# Default image for social/link previews (Open Graph / Twitter cards)
# when a page has no hero_image or thumbnail of its own.
og_image: "/assets/images/dual-eights-social-card-v1.png"

# Chat is intentionally disabled for the broader-sports launch.
chat_worker_url: ""

collections_dir: ""
markdown: kramdown
highlighter: rouge
future: true

defaults:
  - scope:
      path: "soccer/project-2030"
    values:
      hero_image: "/assets/images/project-2030-social-card-x.jpg"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - DUAL_EIGHTS_ROLLBACK.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - articles
  - scripts
  - worker
  - .claude
  - _site-preview
  - _site-validation
