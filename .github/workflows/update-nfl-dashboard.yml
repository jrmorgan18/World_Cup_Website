name: Update NFL rankings and results

on:
  schedule:
    - cron: "45 11 * * *"
    - cron: "5 15 * * 4"
  workflow_dispatch:
    inputs:
      ratings_week:
        description: "Optional completed-week cutoff; blank advances to the latest fully completed week"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: update-nfl-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      NFL_CACHE_DIR: .nfl-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .nfl-cache
          key: nfl-inputs-2026-${{ github.run_id }}
          restore-keys: nfl-inputs-2026-
      - name: Install model dependencies
        run: python -m pip install numpy==2.4.2 pandas==2.3.3 pyarrow==23.0.1
      - name: Refresh complete-week rankings and current-week results
        env:
          REQUESTED_WEEK: ${{ inputs.ratings_week }}
        run: |
          args=()
          if [[ -n "$REQUESTED_WEEK" ]]; then
            if [[ ! "$REQUESTED_WEEK" =~ ^[0-9]+$ ]]; then exit 1; fi
            args+=(--ratings-week "$REQUESTED_WEEK")
          fi
          python scripts/update_nfl_dashboard.py --season 2026 "${args[@]}"
      - name: Validate NFL snapshots
        run: |
          python scripts/check_nfl_dashboard.py
          python -m unittest discover -s scripts -p test_nfl_dashboard.py -v
          python -m unittest discover -s scripts -p test_nfl_injury_watchlist.py -v
          node --test scripts/test_nfl_injuries.cjs
      - name: Commit data changes
        id: commit
        run: |
          paths=(_data/nfl_dashboard.json _data/nfl_forecast_archive.json _data/nfl_injury_watchlist.json assets/data/nfl-dashboard.json assets/data/nfl-rankings.csv assets/data/nfl-results.csv)
          if [[ -n "$(git status --porcelain -- "${paths[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -- "${paths[@]}"
            git commit -m "Refresh NFL rankings, forecasts and 2026 results"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy updated NFL data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-pages.yml --ref main
