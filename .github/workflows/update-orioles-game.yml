name: Update Orioles last-game card

# Pulls the Orioles' most recent final score, decisions, and AL East /
# Wild Card standing from MLB's public Stats API into
# _data/orioles_last_game.json, so the card on /orioles/ updates itself
# after every game. No API key required. You can also edit the data file
# by hand at any time.

on:
  schedule:
    # 2:17am and 4:43am Eastern (06:17 / 08:43 UTC during EDT).  GitHub
    # warns that scheduled workflows at the top of an hour can be delayed or
    # dropped during peak load, so keep both the primary run and its backup
    # well away from minute 00.
    - cron: "17 6 * * *"
    - cron: "43 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: update-orioles-game
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update Orioles last-game card
        run: python scripts/update_orioles_game.py
      - name: Commit changes
        id: commit
        run: |
          if [[ -n "$(git status --porcelain _data/orioles_last_game.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/orioles_last_game.json
            git commit -m "Auto-update Orioles last-game card"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy updated site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-pages.yml --ref main
