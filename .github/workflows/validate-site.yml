name: Validate site

on:
  pull_request:
    branches: [main]
  push:
    branches: ["codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Ravens dashboard data
        id: validate-ravens-dashboard
        continue-on-error: true
        run: ruby scripts/check_ravens_dashboard.rb
      - name: Warn when Ravens dashboard data needs attention
        if: steps.validate-ravens-dashboard.outcome == 'failure'
        run: >-
          echo "::warning title=Ravens dashboard data needs attention::The data check failed, but site validation continued. Review the Validate Ravens dashboard data log for details."
      - name: Validate Barcelona dashboard data
        id: validate-barcelona-dashboard
        continue-on-error: true
        run: ruby scripts/check_barcelona_dashboard.rb
      - name: Warn when Barcelona dashboard data needs attention
        if: steps.validate-barcelona-dashboard.outcome == 'failure'
        run: >-
          echo "::warning title=Barcelona dashboard data needs attention::The data check failed, but site validation continued. Review the Validate Barcelona dashboard data log for details."
      - name: Build launch version
        run: >-
          bundle exec jekyll build --trace
          --baseurl ""
          --destination "_site-validation"
        env:
          JEKYLL_ENV: production
      - name: Check internal links and launch routes
        run: python scripts/check_site.py _site-validation
