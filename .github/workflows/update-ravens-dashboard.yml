name: Update Ravens season dashboard

# Refreshes the objective Ravens snapshot from the free nflverse schedule and
# play-by-play releases. The updater preserves earlier weekly snapshots and
# writes only when football data changes, so daily checks do not create noise.

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: update-ravens-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install data dependencies
        run: python -m pip install pandas==2.3.3 pyarrow==23.0.1
      - name: Update Ravens dashboard
        run: python scripts/update_ravens_dashboard.py
      - name: Validate dashboard data
        run: ruby scripts/check_ravens_dashboard.rb
      - name: Commit changes
        id: commit
        run: |
          if [[ -n "$(git status --porcelain _data/ravens_dashboard_stats.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/ravens_dashboard_stats.json
            git commit -m "Auto-update Ravens season dashboard"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Ravens data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy updated site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-pages.yml --ref main
