<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
{% assign section_theme = page.section_theme | default: "soccer" %}
<body class="theme-{{ section_theme }}{% if page.layout == 'longform' %} longform-page{% endif %}">
  {% include nav.html %}
  <main class="site-main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% if page.show_survey_prompt %}{% include survey-prompt.html %}{% endif %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
