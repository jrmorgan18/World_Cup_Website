  - id: "2026-08-16"
    published: "August 16, 2026"
    window: "August 10-16, 2026"
    summary:
      biggest_risers: "Joseph Dzierwa delivered six one-hit, scoreless innings with seven strikeouts; Eric Booth Jr. reached base seven times in his first three Single-A games; Wehiwa Aloy paired a .318 week with a homer and two steals; and Luis De León struck out seven over five solid Triple-A innings."
      issues_to_monitor: "Caden Hunter allowed six earned runs and four walks in three innings, while Michael Forret was charged with eight earned runs on 10 hits in five innings. Ike Irish remains on the seven-day injured list and Nate George remains on the 60-day injured list."
      best_story: "Dzierwa supplied the cleanest performance on the board: six scoreless innings, one hit allowed and seven strikeouts. His 2.01 ERA, 0.86 WHIP and 132 strikeouts across 112 innings now give Baltimore a substantial full-season body of upper-level dominance."
