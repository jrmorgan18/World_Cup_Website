        name: Caden Hunter
        team: Chesapeake Baysox
        level: Double-A
        trend: "↑"
        direction: rising
        direction_label: Rebound
        recap: "Hunter started August 18 against Richmond and earned the win with five innings of one-run ball, two strikeouts and six runners stranded."
        development_read: "The workload was shorter and the strikeout total modest, but limiting Richmond to one run was a clear response to the prior outing. He remains active in Chesapeake's rotation with a 2.02 ERA across 89 innings."
        sources:
