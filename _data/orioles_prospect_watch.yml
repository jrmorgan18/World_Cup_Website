reports:
  - id: "2026-08-23"
    published: "August 23, 2026"
    window: "August 17-23, 2026"
    summary:
      biggest_risers: "Anthony Eyanson delivered a career-best seven innings with eight strikeouts and no walks; Wehiwa Aloy hit homers on August 18 and August 23 while adding an August 22 double; and Joseph Dzierwa remained effective in a five-inning August 19 start."
      issues_to_monitor: "Ike Irish is out for the season after a left meniscus tear and July knee procedure, while Nate George remains on the 60-day injured list with an undisclosed illness. Michael Forret's Triple-A transition remains a concern after Norfolk was held hitless in his August 23 start; Eric Booth Jr. is still working through a tiny first-professional sample."
      best_story: "Eyanson's first career seven-inning start was the clearest verified development: five hits, one run, no walks and eight strikeouts in Double-A Chesapeake."
    players:
      - prospect: eric-booth-jr
        name: Eric Booth Jr.
        team: Delmarva Shorebirds
        level: Single-A
        trend: "→"
        direction: steady
        direction_label: Holding
        recap: "Booth stayed active for Delmarva and drove in a run on a sacrifice fly on August 20. His official first-professional line now stands at five hits and four RBIs in 23 at-bats."
        development_read: "The sample remains tiny, but the active assignment and a second run-producing event are more useful than treating a quiet stretch as an absence. The next several Delmarva games should add needed context."
        sources:
          - { label: "MiLB player record", url: "https://www.milb.com/player/eric-booth-jr-835727" }
          - { label: "August 20 sacrifice fly", url: "https://www.milb.com/video/eric-booth-jr-out-on-a-sacrifice-fly-to-left-fielder-jay-mcqueen-jhomnard?t=playerid-835727" }
      - prospect: anthony-eyanson
        name: Anthony Eyanson
        team: Chesapeake Baysox
        level: Double-A
        trend: "↑"
        direction: rising
        direction_label: Rising
        recap: "Eyanson set a career high with seven innings on August 20, allowing five hits and one run without a walk while striking out eight on 84 pitches (64 strikes)."
        development_read: "The extended outing and clean strike-zone line were a clear step forward in Double-A. His ability to carry the workload while preserving his season-long run prevention is the strongest development on this week's board."
        sources:
          - { label: "Chesapeake Baysox: August 20 start", url: "https://www.mlb.com/milb/chesapeake/news/anthony-eyanson-tosses-career-high-seven-innings-in-baysox-loss-to-flying-squirrels-thursday" }
          - { label: "MLB Pipeline player record", url: "https://www.mlb.com/player/anthony-eyanson-809254" }
      - prospect: joseph-dzierwa
        name: Joseph Dzierwa
        team: Chesapeake Baysox
        level: Double-A
        trend: "→"
        direction: steady
        direction_label: Holding
        recap: "Dzierwa worked five innings on August 19, allowing two hits and one earned run while striking out three and walking one."
        development_read: "There was no new dominance spike after his prior strong week, but Dzierwa limited traffic and kept the season line excellent. The steady workload remains encouraging as he continues through Double-A."
        sources:
          - { label: "MLB player record", url: "https://www.mlb.com/player/joseph-dzierwa-804530" }
          - { label: "Baseball Savant game log", url: "https://baseballsavant.mlb.com/savant-player/joseph-dzierwa-804530?player_id=804530" }
