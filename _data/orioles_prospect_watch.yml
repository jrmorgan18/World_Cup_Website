reports:
  - id: "2026-08-30"
    published: "August 31, 2026"
    window: "August 24-30, 2026"
    summary:
      biggest_risers: "Anthony Eyanson struck out eight in 3.2 scoreless innings on August 27, Caden Hunter posted five innings with eight strikeouts and one run allowed on August 25, and Enddy Azocar drove in three runs with a two-run double and an RBI single."
      issues_to_monitor: "Joseph Dzierwa allowed four earned runs in five innings on August 26, Luis De León's two relief outings added three earned runs in 1.2 innings, and the health situations remain unchanged for Ike Irish and Nate George."
      best_story: "The Baysox rotation still supplied the week's headline: Eyanson's eight-strikeout, scoreless outing followed Hunter's five-inning, eight-strikeout start and reaffirmed the swing-and-miss ceiling of Baltimore's two highest-ranked healthy pitching prospects."
    players:
      - prospect: eric-booth-jr
        name: Eric Booth Jr.
        team: Delmarva Shorebirds
        level: Single-A
        trend: "→"
        direction: steady
        direction_label: Holding
        recap: "Booth remained active with Delmarva and recorded a sacrifice fly that scored Félix Amparo on August 25. His official professional line is now six RBIs in 38 at-bats."
        development_read: "The 18-year-old is still in his first handful of full-season games, so the priority is regular playing time and plate-appearance volume rather than treating the early batting average as a verdict."
        sources:
          - { label: "MiLB player record", url: "https://www.milb.com/player/eric-booth-jr-835727" }
          - { label: "August 25 sacrifice fly", url: "https://www.milb.com/video/eric-booth-jr-out-on-a-sacrifice-fly-to-center-fielder-dashyll-tejeda" }
