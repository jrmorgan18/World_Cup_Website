groups:
  - id: key-vets
    code: KV
    name: Key Vets
    description: The established core with the clearest path back to the roster in 2030, barring injury or a major setback.
  - id: borderline-vets
    code: BV
    name: Borderline Vets
    description: Members of the 2026 group whose role, trajectory or age creates a real question for the next cycle.
  - id: just-missed
    code: JM
    name: Just Missed
    description: Players close to the 2026 roster who begin the new cycle within striking distance of a place.
  - id: lost-in-the-woods
    code: LW
    name: Lost in the Woods
    description: Experienced internationals or former top prospects whose club careers have stalled or moved off course.
  - id: prospects
    code: PR
    name: Prospects
    description: Young players with enough promise to push past departing veterans before 2030.
  - id: dual-nats
    code: DN
    name: Dual-Nats
    description: Players eligible for another national team who could strengthen the pool but have not committed to the United States.

