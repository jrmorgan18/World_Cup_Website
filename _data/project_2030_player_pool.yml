groups:
  - id: key-vets
    code: KV
    name: Key Vets
    description: The leading candidates to form the experienced core of the 2030 team.
  - id: borderline-vets
    code: BV
    name: Borderline Vets
    description: Established senior players whose roster place, role or age profile leaves meaningful uncertainty.
  - id: just-missed
    code: JM
    name: Just Missed
    description: Players close to the 2026 group or capable of forcing their way back into the pool during the next cycle.
  - id: lost-in-the-woods
    code: LW
    name: Lost in the Woods
    description: Players with real prior promise whose club role, development path or national-team fit has become unclear.
  - id: prospects
    code: PR
    name: Prospects
    description: Younger development cases who still need stronger first-team evidence before entering the main pool.
  - id: dual-nats
    code: DN
    name: Dual-Nats
    description: Players eligible for another national team who could strengthen the pool but have not committed to the United States.

