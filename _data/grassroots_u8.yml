# U8 grassroots coaching reference, written for first-time volunteer coaches.
# Adapted from the Massachusetts Youth Soccer U8 session plans and their
# Beginner Volunteer Coach Survival Guide, which U.S. Soccer's resource hub
# points volunteer coaches toward. Rewritten in plain language for a rec
# league; check your own league's rules for anything match-related.
#
# Diagrams are generated by scripts/build_grassroots_diagrams.py into
# assets/images/grassroots/<activity id>.svg

meta:
  age_group: "Ages 7-8"
  session_length: "About an hour"
  ball: "Size 3 or 4"
  space_note: "You don't need a full field. A rectangle a bit bigger than a basketball court is plenty, and most sessions split it into two smaller ones."
  squad_note: "These plans work for 8-12 kids. With nine, make three groups of three and keep swapping them around so nobody stands still."
  rules_note: "Play games the way your league plays them - same numbers, same restarts, keeper or no keeper. The practice games below are deliberately smaller than that, because fewer kids per ball means more touches."

# The shape every session below follows.
session_flow:
  - phase: "First 20 minutes"
    label: "Just play"
    minutes: "Start the moment two kids are there"
    body: "Don't wait for everyone. Two kids is a game. Start 1v1 and add each new arrival, so it grows to 2v1, 2v2, 3v3. You're not teaching yet - you're watching, saying hello, and letting them get warm."
  - phase: "Middle 20 minutes"
    label: "Teach one thing"
    minutes: "One game, one idea"
    body: "One game that makes them practise the thing you picked. Explain the boundaries and which way they're going, then start. Add rules one at a time as they get it. Lots of short rounds with breaks, not one long one."
  - phase: "Last 20 minutes"
    label: "Play again"
    minutes: "Back to a real game"
    body: "Split into teams and play. Show them, tell them in about thirty seconds, then let them go. This is where you find out if the middle bit stuck. Don't referee it and don't shout instructions."

# The five checks worth running over any activity.
five_elements:
  - "Is it set up right?"
  - "Does it look like a real game?"
  - "Do they get lots of goes at it?"
  - "Is it hard enough to be interesting, but easy enough that they succeed sometimes?"
  - "Am I coaching in a way that suits seven and eight-year-olds?"

reflection_questions:
  - "Did they actually practise the thing I picked?"
  - "What went well?"
  - "What would I change next time?"

# ---------------------------------------------------------------------------
# Quick pointers
# ---------------------------------------------------------------------------
pointer_groups:
  - id: before-practice
    title: "Before you get there"
    icon: "01"
    points:
      - "Get there about fifteen minutes early and set up before the kids arrive, so once they're there you can pay attention to them instead of the cones."
      - "Set up backwards. Put out your last game first using one colour of cone, then the middle game in another colour, then the first one. That way you only ever pick cones up, never put them out mid-session."
      - "Walk the space and clear anything they could trip on or cut themselves on. If you can't move it, just shift your cones so you're playing somewhere else."
      - "Bring a couple of spare balls. Someone always leaves theirs in the car."
      - "Check your league's rules before the first game - how many players, whether there's a keeper, and what happens when the ball goes out."
  - id: running-the-session
    title: "Running practice"
    icon: "02"
    points:
      - "Start them playing straight away. Two kids is enough for a game."
      - "Keep instructions under a minute. They can hold about two or three things in their head at once, so tell them where the edges are and which way they're going, then add anything else later."
      - "Do lots of short rounds. Ten one-minute rounds hold their attention far better than one ten-minute game."
      - "Talk to one kid while the rest keep playing, instead of stopping everybody."
      - "Ask instead of tell. Every game below has a couple of questions you can use."
      - "Keep the spare balls with you and throw a new one in the second one goes out. They should be playing, not chasing."
      - "If a game isn't working, change the size of the space before you add another rule. Bigger is easier for the team with the ball, smaller is harder."
      - "If a kid asks for water, let them go. Even if they just went."
  - id: whats-normal
    title: "What's normal at this age"
    icon: "03"
    points:
      - "They'll all chase the ball in a clump. That's completely normal for seven and eight-year-olds and it sorts itself out with age - it's not something to coach out of them."
      - "Dribbling everywhere isn't being selfish. Passing and looking for teammates comes later, on its own."
      - "Don't give anyone a fixed position, and don't spend practice on where everyone should stand."
      - "They've got short attention spans and big imaginations. A defender is boring; a bandit, a dog catcher or a freeze monster is not."
      - "A good player at this age is one who wants the ball, can control it, and is willing to try something. That's the goal - not a small version of a grown-up player."
  - id: inclusive
    title: "Keep everyone in it"
    icon: "04"
    points:
      - "No games where losing means sitting out and watching. The first kid knocked out is almost always the one who needed the practice most."
      - "If a ball gets booted away, send them to go get it and jump back in - don't park them on the side."
      - "Everyone plays at least half of every game."
      - "Never have them queuing more than two deep, and never make them run without a ball."
      - "Agree the ground rules with them rather than announcing them - where the water bottles go, listening while someone else is talking, telling you before they wander off."
  - id: nine-players
    title: "Making it work with nine"
    icon: "05"
    points:
      - "Make three groups of three and keep them all season. Then it's group A against B, B against C, C against A."
      - "For a bigger game, swap one kid in every couple of minutes."
      - "Or run 3v3 on one side while the other three do a 1v1 or a ball challenge, then switch."
      - "Nobody should be standing around for more than a minute or two."
  - id: game-day
    title: "Game day"
    icon: "06"
    points:
      - "Have a rough idea where everyone starts before you get there, but don't get hung up on positions - they won't mean much yet."
      - "Give everyone about the same amount of playing time, and move them around so they try different spots."
      - "Keep spare balls next to you. At this age the main thing is keeping the game going."
      - "Pick one thing from practice and mention it. Don't call out instructions on every play."
      - "If you've got another parent helping, split it up - one of you with the game, one with the kids waiting - and swap week to week."
      - "It's part of them learning, not a test. Nobody's getting scouted."
  - id: kit
    title: "What they need to bring"
    icon: "07"
    points:
      - "Shirt, usually handed out by the club. Shorts, or sweats once it gets cold."
      - "Shin guards. These aren't optional - no shin guards, no playing."
      - "Socks pulled up over the shin guards. That's why soccer socks look so long."
      - "Flat trainers or soccer cleats. No metal studs and no baseball cleats."
      - "A size 3 or 4 ball. A full-size one is too big for them."
      - "More water than you'd think. Half of it ends up on the ground."
  - id: wrap-up
    title: "Finishing up"
    icon: "08"
    points:
      - "Make picking up cones a race, but give them a colour each - otherwise they'll grab whatever's nearest."
      - "Ask what they liked today. It tells you what to run again next week."
      - "Check in with them before they go."
      - "Say goodbye to every kid and every parent, and thank them for coming."

# ---------------------------------------------------------------------------
# The games
# ---------------------------------------------------------------------------
activities:
  - id: arrival-game
    name: "Arrival game"
    subtitle: "The one you start with every week"
    focus: "Warm-up"
    format: "1v1 building to 3v3"
    numbers: "2 or more"
    week_label: "Every week"
    duration: "About 20 min"
    diagram_alt: "Two small side-by-side fields, each with a small goal at both ends. A couple of players on each field, one dribbling towards goal, with more arriving from the side."
    setup: "Split your space into two small fields with a goal at each end. As soon as two kids have arrived, start a game. It begins as 1v1 and grows - 2v1, then 2v2, then 3v3 - as more turn up. Once one field is busy, start the second one."
    rules:
      - "Don't wait for a full group. Whoever's there, start."
      - "Send each new arrival into whichever game needs a player."
    key_words: "Go forwards, go to goal"
    questions:
      - "If there's a gap in front of you, what should you do?"
      - "When is it better to pass than to dribble?"
    answers:
      - "Go forwards, towards the goal, whenever you can."
      - "When everything in front of you is blocked - then pass and let your teammate try."
    note: "This isn't a teaching bit. Say hello to everyone as they arrive, watch what they're doing, and maybe ask a question or two when you pause."
    equipment: "Cones, four small goals, balls"

  - id: the-game
    name: "The game at the end"
    subtitle: "How every session finishes"
    focus: "Small-sided game"
    format: "Even teams"
    numbers: "8 or more"
    week_label: "Every week"
    duration: "About 20 min"
    diagram_alt: "One field with a goal at each end and two even teams spread across it, with passes and a dribble towards goal."
    setup: "Use the whole space with a goal at each end and split them into even teams. Two halves with a short break in the middle. Play it however your league plays it."
    rules:
      - "If the ball goes out, throw another one straight in and let them keep playing."
      - "Only bother with throw-ins and goal kicks if your league uses them."
    key_words: "Turn, spread out, score"
    questions:
      - "Who decides whether to pass, dribble or shoot?"
      - "How can you help whoever's got the ball?"
    answers:
      - "Whoever's got the ball. Let them choose - that's the whole point."
      - "If it's crowded near the goal, move somewhere else so they've got another option."
    note: "Don't stop it for restarts, and try not to coach every play. Let them play."
    equipment: "Two goals, pinnies, spare balls"

  - id: partner-bandits
    name: "Partner Bandits"
    subtitle: "Week 1"
    focus: "Attacking"
    format: "Pairs against bandits"
    numbers: "8-12"
    week: 1
    week_label: "Week 1"
    duration: "About 18 min, in 90-second rounds"
    diagram_alt: "A grid with a wide goal marked in cones at each end. Pairs share a ball and dribble towards a goal while one pair, the bandits, tries to steal it."
    objective: "Get the ball past the bandits and score."
    setup: "Mark a wide goal out of cones at each end of your space. Put everyone in pairs sharing one ball. One pair are the bandits and don't get a ball."
    rules:
      - "Pairs score by dribbling into a goal or passing to their partner standing in it, then turn round and attack the other one."
      - "Bandits try to steal a ball and dribble it into either goal - their hideout. The pair can win it back before they get there."
      - "If the bandits get a ball to a hideout, that pair loses all their points and starts from zero."
      - "Bandits aren't allowed to stand in the goals."
      - "Ask them how many they can score in 90 seconds. Pick new bandits each round."
    key_words: "Heads up, find the gap, go through it"
    questions:
      - "Where can you go if a bandit is blocking your way to the goal?"
      - "What are the two ways of getting the ball through a gap?"
      - "Which bit of your foot do you use to run with the ball?"
    answers:
      - "Tell your partner to move somewhere else and make a new gap."
      - "Dribble through it, or pass through it."
      - "Your laces - toes pointed down, and push the ball out in front of you."
    note: "Fun twist: once the bandits get a ball into a hideout, they become scorers and the pair who lost it become the new bandits."
    equipment: "Cones for two wide goals, one ball per pair"
    easier:
      name: "Bandits, and you're the bandit"
      body: "Same setup, but every kid has their own ball and you're the only bandit. They dribble into either goal, then turn and go for the other. If you get their ball, their score goes back to zero. Once they've got the idea, put two of them together sharing a ball."
      questions:
        - "Where can you go if another kid is in your way?"
        - "What can you do if I'm standing in front of the goal?"
    harder:
      name: "Two games of 2v2 at once"
      body: "Same space, teams of two. Two separate 2v2 games run at the same time, sharing the same goals - each team defends one and attacks the other. Score by dribbling in or passing to a teammate in the goal. After a goal the scorers back off and let the ball come back out."
      questions:
        - "What have you got to watch out for in this game?"
        - "How can you help your partner make a gap?"

  - id: four-corner-goals
    name: "Four Corner Goals"
    subtitle: "Week 2"
    focus: "Attacking"
    format: "2v2"
    numbers: "8-12"
    week: 2
    week_label: "Week 2"
    duration: "About 20 min, in 2-minute rounds"
    diagram_alt: "A small field with a goal in each of the four corners. Two players attack the two goals at the far end while two defend, with spare balls dotted around."
    objective: "Beat a defender and get a shot away."
    setup: "Split your space into two small fields and put a goal in each corner, so there are four per field. Play 2v2 with the other teams waiting on the side. Scatter spare balls around so you can restart instantly."
    rules:
      - "Each team defends the two goals behind them and attacks the two at the other end."
      - "After two minutes both teams come off and the waiting teams go on. It starts the moment someone steps on."
    key_words: "Which goal is open?"
    questions:
      - "What can you do if nobody's near you?"
      - "Where can you go if it's crowded in front of the goal?"
      - "How do you aim at the goal?"
    answers:
      - "Run at the nearest goal and score."
      - "Switch across to the other goal - a big kick over there works."
      - "Turn and face it, point your other foot at it, and hit through the middle of the ball."
    note: "Eight kids only needs one field. Fewer than that, make three teams - two play, one has a breather."
    equipment: "Eight goals or cone gates, spare balls"
    easier:
      name: "Two against one"
      body: "Same four goals. You stand at the side with all the balls and one team waits on each side. Before you roll a ball in, call which team sends two players and which sends one. Both teams go for it. The round ends on a goal or when the ball goes out - everyone comes off and you roll the next one in."
      questions:
        - "If your teammate's got the ball, where should you go?"
    harder:
      name: "Three against three"
      body: "Same setup played 3v3, swapping a sub in at least every couple of minutes. If the ball goes out, whichever team didn't kick it out grabs a spare and plays on."
      questions:
        - "Once you've passed it, where do you go next?"

  - id: boston-bulldogs
    name: "Bulldogs"
    subtitle: "Week 3"
    focus: "Attacking"
    format: "Pairs against dog catchers"
    numbers: "8-12"
    week: 3
    week_label: "Week 3"
    duration: "About 18 min, in 90-second rounds"
    diagram_alt: "A field with a strip across the middle marked in cones. Dog catchers stand inside the strip while pairs sharing a ball try to get through it and score at either end."
    objective: "Get through the middle and score."
    setup: "Mark a strip right across the middle of your space - that's the dog pound - with a goal at each end. You and any other grown-ups start in the pound as dog catchers, with no ball. Every pair shares a ball and lines up on an end line."
    rules:
      - "Shout \"who let the dogs out?\" to start it."
      - "They sneak through the pound and score, then turn around and go for the other goal."
      - "If a catcher steals their ball, that pair's score goes back to zero."
      - "Miss the goal and it doesn't count. They have to shoot at the far goal before coming back."
      - "Catchers have to stay inside the strip."
    key_words: "Get through quick, keep moving"
    questions:
      - "What's the fastest way through the middle?"
      - "Where should your partner go to help you get through?"
      - "If your partner's close by, which bit of your foot do you pass with?"
    answers:
      - "Dribble through if there's room, or knock it through to your partner."
      - "To a gap on the far side, ready for the ball."
      - "The inside - the flat bit - toes turned out, and swing through the middle of the ball."
    note: "Kids can be catchers too, working in pairs inside the strip. After a few goes, let a catcher who wins a ball swap places with the kid they got it from."
    equipment: "Cones for the strip, two goals, one ball per pair"
    easier:
      name: "No catchers"
      body: "Same strip and goals, but nobody's catching. Pairs just go as fast as they can through the middle and score. They lose their points if the ball goes out the side. You can stand in the strip as a thing to dribble around."
      questions:
        - "What's the quickest way to get it down to the goal?"
        - "Where do you go after you've passed it?"
    harder:
      name: "Catchers everywhere"
      body: "Take the strip away. The catchers can go anywhere. Pairs get past them, score, then turn and go the other way. Everything else stays the same."
      questions:
        - "Which bit of your foot do you use for a big kick?"

  - id: end-zones-1v1
    name: "Race to the End Zone"
    subtitle: "Week 4"
    focus: "Attacking"
    format: "1v1 turning into 2v2"
    numbers: "8-12"
    week: 4
    week_label: "Week 4"
    duration: "About 20 min, in 1-minute rounds"
    diagram_alt: "Two small fields, each with a shaded scoring zone across both ends. One player dribbles towards the far zone while a defender comes across to stop them."
    objective: "Beat a defender and get into the zone."
    setup: "Split your space into two small fields and mark a short scoring zone across each end. One team waits behind one zone with the balls, the other behind the opposite one."
    rules:
      - "On your shout, two kids go on with a ball each and head for the far zone."
      - "The team without balls sends two out to stop them and steal it, then score back in the other zone."
      - "You score by dribbling into the zone. Defenders can't stand in the zone waiting."
      - "Once one ball's dead, those two go and help whoever's still got one."
      - "Rounds last a minute. Swap ends after five."
    key_words: "Find the gap, trick the defender"
    questions:
      - "What do you do if there's a clear run all the way?"
      - "How can you use your teammate to trick the defender?"
      - "If there's a gap, how do you get there fastest?"
    answers:
      - "Run straight at the zone with it."
      - "Swing your leg like you're passing but don't touch it - then go the other way."
      - "Push it further out in front and run onto it."
    note: "Cheer on whoever's got the ball at the start, then once it's two against two, talk about the choices they're making."
    equipment: "Cones for the zones, plenty of balls"
    easier:
      name: "Two against one"
      body: "Same fields and zones, but two kids go on sharing one ball against a single defender. The round ends as soon as the ball's scored or knocked out, or after a minute."
      questions:
        - "You've got an extra player - how do you use them?"
    harder:
      name: "Three against two"
      body: "Same fields, but with a scoring zone at one end and a proper goal at the other. The team of three starts with the ball and goes for the goal. The team of two scores by stopping the ball in the zone. First goal wins the round. Swap sides every few rounds."
      questions:
        - "What should you do when a defender steps in front of you?"
        - "When should you push the ball further ahead of you?"

  - id: guard-the-goals
    name: "Guard the Goals"
    subtitle: "Week 5"
    focus: "Defending"
    format: "Pairs against defenders"
    numbers: "8-12"
    week: 5
    week_label: "Week 5"
    duration: "About 18 min, in 1-minute rounds"
    diagram_alt: "A grid with several small triangle goals dotted around it. Defenders guard the triangles while pairs sharing a ball dribble towards the unguarded ones."
    objective: "Stop them scoring in your goals."
    setup: "Dot several little triangle goals around your space. Pick one fewer defender than there are triangles. Everyone else pairs up and shares a ball."
    rules:
      - "Pairs dribble or pass into or through as many triangles as they can in a minute."
      - "Defenders look after all the triangles and try to win the ball, but they can't stand inside one."
      - "A pair who stops the ball inside a triangle is safe and can have a breather, but can't score again until they come back out."
      - "If a defender wins their ball, that pair's count goes back to zero."
    key_words: "Get in the way, win the ball"
    questions:
      - "How do you know where they're coming from?"
      - "Where do you go if your goal's safe but another one isn't?"
      - "How do you get the ball off someone?"
    answers:
      - "Keep your head up and keep looking around."
      - "Over to the one that isn't covered - get between them and it."
      - "Get close, then either poke it away with your toe or put your foot in front of it so they can't push it forward."
    note: "This one's about defending, so talk to the defenders. Let the pairs get on with it."
    equipment: "Cones for several triangles, one ball per pair"
    easier:
      name: "Tag instead of tackling"
      body: "Only two triangles, one defender each. They can win the ball properly or just tag the kid who's got it - either one sends that pair back to zero. You can join in with a pair if the numbers need it, but let the kids be the defenders."
      questions:
        - "When should you stay near your goal?"
        - "What if they knock the ball too far ahead of themselves?"
    harder:
      name: "Three against three"
      body: "Two triangles, one in each half. Two teams of three - each attacks one and defends the other, scoring by passing or dribbling through. You can't stand inside the one you're defending. After a goal, the scorers leave the ball and get back to protect theirs while the others come at them."
      questions:
        - "When should two of you be close together?"
        - "Where does the third one go if the other two have got it covered?"

  - id: four-corner-shoot-defend
    name: "Corners"
    subtitle: "Week 6"
    focus: "Defending"
    format: "2v2, straight back on"
    numbers: "8-12"
    week: 6
    week_label: "Week 6"
    duration: "About 18 min, in 30-second rounds"
    diagram_alt: "A small field with a goal at each end and kids waiting in all four corners. The coach stands at the side with the balls, ready to roll one in for the next two players."
    objective: "Stop them getting a shot away."
    setup: "Mark a small field with a goal at each end - two of them if you've got the numbers. Split the group in half, with each half waiting in the two corners of their own end line. You stand off to the side with all the balls."
    rules:
      - "You roll a ball in and one kid from each corner runs on to play 2v2."
      - "The round's over as soon as someone scores or the ball goes out. Everyone comes off and you roll the next one in."
      - "Nobody goes on before the ball does."
    key_words: "Get back, get in the way"
    questions:
      - "What's your job the second the other team gets the ball?"
      - "Where do you go if they get past you?"
      - "How do you get the ball off them?"
    answers:
      - "One of you goes at the ball, the other gets back and covers the goal."
      - "Back towards your own goal."
      - "Get close, then poke it away or block it so they can't push it forward."
    note: "Roll the ball to whoever's had the least to do, and aim it nearer one team than the other rather than straight down the middle."
    equipment: "Cones, two to four goals, lots of balls"
    easier:
      name: "One against two"
      body: "Same idea, but whichever side you roll the ball to sends one player and the other side sends two - so the defenders have an extra."
      questions:
        - "There's two of you - who goes for the ball and who covers?"
    harder:
      name: "Three against four"
      body: "Use the whole space. Whichever side you roll it to sends four, the other sends three. Rounds last a minute, and you throw a new ball in whenever one goes out."
      questions:
        - "How do three of you cover a goal against four?"

  - id: defend-3-goals-counter
    name: "Three Goals, One Goal"
    subtitle: "Week 7"
    focus: "Defending"
    format: "2v2"
    numbers: "8-12"
    week: 7
    week_label: "Week 7"
    duration: "About 18 min, in 1-minute rounds"
    diagram_alt: "A field with three small goals along one end line and a single goal at the other. Two attackers head for the three goals while two defenders come out to stop them."
    objective: "Cover three goals with two players."
    setup: "Put three small goals along one end line and a single goal at the other. Half the group waits at each end. The team defending the single goal starts with the ball."
    rules:
      - "Two attackers go on; as soon as they do, two from the other end come on to defend."
      - "Whoever's got the ball can go at any of the three goals. If the defenders win it, they can go the other way and score in the single one."
      - "Defenders can't come on until the attackers have taken their first touch."
      - "Rounds last a minute, and you can roll new balls in - they can score more than once."
    key_words: "Which goal is the danger?"
    questions:
      - "Which of the three goals is the dangerous one right now?"
      - "Where should you be standing if a goal's in danger?"
      - "What if they knock the ball too far in front of themselves?"
    answers:
      - "Whichever one's closest to the ball."
      - "In between the ball and that goal."
      - "Step in and nick it off them."
    note: "You'll want to help the attackers because there are fewer of them. Don't - this one's about the defenders working together."
    equipment: "Four small goals or cone gates, balls"
    easier:
      name: "Two defenders, one attacker"
      body: "One attacker goes on, and as soon as they touch the ball two defenders come out. Rounds are 30 seconds, or until it's scored or goes out. Swap who's attacking and who's defending after a few goes."
      questions:
        - "There's two of you against one - who goes and who waits?"
    harder:
      name: "Two defenders, three attackers"
      body: "Three attackers against two defenders, minute-long rounds. Everything else is the same."
      questions:
        - "How do two of you cover three goals?"

  - id: defend-your-goal
    name: "Defend Your Goal"
    subtitle: "Week 8"
    focus: "Defending"
    format: "3v3"
    numbers: "8-12"
    week: 8
    week_label: "Week 8"
    duration: "About 18 min, in 4-minute rounds"
    diagram_alt: "A field with a goal at one end and a shaded scoring zone at the other. Three defenders protect the goal while trying to win the ball and get it into the zone."
    objective: "Close down whoever's got the ball."
    setup: "One goal at one end and a short scoring zone at the other. Play 3v3. The team you're coaching defends the goal, and scores by stopping the ball in the zone - either dribbling in or passing to someone in it. The other team scores in the goal."
    rules:
      - "Nobody's allowed to just stand in the zone waiting, but you can step in to stop someone scoring."
      - "Everything else, play it how your league plays it."
    key_words: "Go to the ball, win it back"
    questions:
      - "If you're nearest to the ball, what should you do?"
      - "When's the right moment to try and take it?"
      - "How do you get to the ball and cover your goal at the same time?"
    answers:
      - "Get close and don't let them run straight at your goal."
      - "When they knock it too far ahead of themselves."
      - "Curve your run, so you end up between them and the goal."
    note: "Talk to the team without the ball. All of it."
    equipment: "One or two goals, cones for the zone"
    easier:
      name: "Three against two"
      body: "Same idea on a smaller field: three defend the goal against two attackers, and score by stopping the ball in the zone."
      questions:
        - "You've got an extra defender - who goes to the ball and who covers?"
    harder:
      name: "Three against four"
      body: "Use the whole space with a goal at each end. Your three defend theirs against four, and score in the other one."
      questions:
        - "You're a player short - who goes to the ball?"

  - id: groups-of-2-vs-defenders
    name: "Pairs Against the Defenders"
    subtitle: "Week 9"
    focus: "Attacking"
    format: "Pairs against defenders"
    numbers: "8-12"
    week: 9
    week_label: "Week 9"
    duration: "About 18 min, in 2-minute rounds"
    diagram_alt: "A grid with three small goals along each end line. Pairs sharing a ball pass and dribble past two defenders in the middle to score in any of the goals."
    objective: "Two of you, working together, beating a defender."
    setup: "Put three goals along each end line. Pick two or three defenders; everyone else pairs up and shares a ball."
    rules:
      - "Pairs get past the defenders and score in any of the three goals, then grab any ball and go for the three at the other end."
      - "Shooting, passing or dribbling into a goal all count."
      - "If a defender wins a ball and knocks it off the side, that pair goes back to zero."
      - "How many can they get in two minutes? Swap the defenders each round."
    key_words: "Heads up, move with your partner"
    questions:
      - "How do you know where the goals and the defenders are?"
      - "How can two of you get past one defender?"
      - "Why turn and face your partner before you pass?"
    answers:
      - "Look up and check whether your way through is open or blocked."
      - "Run at the defender, see if they come to you, then pass round them."
      - "Because facing them makes the pass go where you want it to."
    note: "After a few good rounds, let a defender who wins a ball swap in with the pair they got it from."
    equipment: "Six small goals or cone gates, one ball per pair"
    easier:
      name: "Just get over the line"
      body: "No goals at all - pairs score by getting the ball over the end line, either dribbling over it or passing to their partner over it. You and any other grown-ups start as the defenders. After a few rounds, step out, pick two or three kids to defend and go back to the main game."
      questions:
        - "Where can your partner go so you can pass to them?"
    harder:
      name: "Three against two"
      body: "Same six goals, played as a proper 3v3 or 3v2 - the bigger team starts with the ball and attacks the three goals at one end, then turns and goes for the other three."
      questions:
        - "How do you keep it moving between three of you?"

  - id: defend-each-zone
    name: "Defend Your Zone"
    subtitle: "Week 10"
    focus: "Defending"
    format: "Pairs against zone defenders"
    numbers: "8-12"
    week: 10
    week_label: "Week 10"
    duration: "About 18 min, in 1-minute rounds"
    diagram_alt: "A field split across into three bands with one defender in each. Pairs sharing a ball work their way through all three bands towards the goal at the end."
    objective: "Defending as a group, in front of your own goal."
    setup: "Split your space across into three bands with a goal at each end. Put one defender in each band, and they have to stay in it. Everyone else pairs up and shares a ball."
    rules:
      - "Pairs work their way through all three bands and score at one end, then come back through and score at the other."
      - "Miss the goal and it doesn't count - carry on to the other end."
      - "If a defender wins their ball, that pair goes back to zero."
    key_words: "Push them wide, win it back"
    questions:
      - "Why is it worth getting close to whoever's got the ball?"
      - "When's the right moment to go for it?"
      - "How do you go at the ball and cover the goal at once?"
    answers:
      - "It makes them hurry and look down at their feet."
      - "When they push it too far ahead of themselves."
      - "Curve your run so you're covering the goal on your way there."
    note: "Let the defenders count how many balls they win and challenge the next lot to beat it. You can hold a band yourself if you're short."
    equipment: "Cones to mark the bands, two goals, one ball per pair"
    easier:
      name: "Two bands and a spare defender"
      body: "Split it in half instead of into three. One defender in each half, plus one extra who's allowed to go anywhere. Same scoring."
      questions:
        - "When should the spare defender come across and help?"
    harder:
      name: "Three defenders, go anywhere"
      body: "Split it in half, with three defenders who can go wherever they like and have to look after both goals between them."
      questions:
        - "Who goes to the ball and who covers the goal?"

  - id: side-goals-2v1
    name: "Two Against One"
    subtitle: "Week 11"
    focus: "Defending"
    format: "2v1, straight back on"
    numbers: "8-12"
    week: 11
    week_label: "Week 11"
    duration: "About 18 min, in 30-second rounds"
    diagram_alt: "A small field with a goal tucked near a corner at each end. The coach stands at the side with the balls, with a team waiting on each side, ready to send players on."
    objective: "One defender holding off two attackers."
    setup: "A small field with a goal at each end, tucked near the nearest corner. You stand at the side with all the balls and a team waiting on each side."
    rules:
      - "You roll a ball in. Whichever side it goes to sends one player; the other side sends two."
      - "Each team has one goal to score in and one to look after."
      - "The round's over on a goal or when the ball goes out. Everyone off, next ball in."
    key_words: "Get in the way, win the ball"
    questions:
      - "What should you do if your goal's wide open?"
      - "What does it actually mean to tackle someone?"
      - "How do you nick it off them without fouling?"
    answers:
      - "Get back and stand in front of it."
      - "Getting close enough to touch the ball, then taking it."
      - "Come at them from the side, get slightly in front, and reach in with your toe."
    note: "The two will both chase the ball together. Help them work out when one goes and the other hangs back. Set up two of these if you can - twice as much playing."
    equipment: "Two to four small goals, lots of balls"
    easier:
      name: "Players on first"
      body: "They go on before the ball does. You say which team's got two and which has one, then roll it to whoever's on their own. Rounds last a full minute with new balls rolled in as needed."
      questions:
        - "When do you go to the ball and when do you hang back?"
    harder:
      name: "Two against two"
      body: "Same rolling game, but both sides send two when the ball goes in."
      questions:
        - "How do you and your partner split up the job?"

  - id: festival
    name: "End-of-Season Festival"
    subtitle: "Week 12 - the whole session"
    focus: "Small-sided game"
    format: "Even teams"
    numbers: "8 or more"
    week: 12
    week_label: "Week 12"
    duration: "Rounds of 6-8 min with a break between"
    diagram_alt: "Two small fields running side by side, each with a goal at both ends and even teams playing, with a scoreboard noted at the side."
    objective: "Finish the season with a mini tournament - same game each time, with a different twist."
    setup: "Split everyone into even teams - threes or fours, whatever keeps them all playing. Change opponents each round if you can, and add up the scores between games."
    rules:
      - "Three points for a win, two for a draw, one for a loss, plus whatever the round's bonus is."
      - "Keep track of goals scored and let in, in case you need a tie-breaker."
      - "Make the rounds shorter or longer to fit the time you've got."
    key_words: "Play, have fun, see who wins"
    note: "Change any of these if it'll suit your group better. Nobody's checking."
    equipment: "Goals and pinnies for as many small fields as you can fit"
    games:
      - name: "Round 1 - Normal game"
        body: "No twists, no bonus."
      - name: "Round 2 - Three passes"
        body: "String three passes together before you score and it counts triple."
      - name: "Round 3 - First time"
        body: "Score without stopping the ball first and it counts five times."
      - name: "Round 4 - Everyone over the line"
        body: "Your whole team has to be in the other half for a goal to count."
      - name: "Round 5 - Everyone scores"
        body: "Once you've scored, you can't score again until everyone on your team has one."
      - name: "Round 6 - Win by two"
        body: "Win by exactly two and you get five bonus goals. 3-1 counts, 3-2 doesn't."
      - name: "Round 7 - Normal game"
        body: "No twists, no bonus."

  # --- Extra games worth having up your sleeve ---
  - id: freeze-tag-layered
    name: "Freeze Tag with a Ball"
    subtitle: "And how to build a game up bit by bit"
    focus: "Ball work"
    format: "Everyone with a ball"
    numbers: "Any"
    week_label: "Any week"
    duration: "About 15 min, in 1-minute rounds"
    diagram_alt: "A square marked with cones. Every kid has a ball and is dribbling around inside it, with one kid tagging and another frozen holding their ball above their head."
    objective: "Dribbling with their heads up - and a worked example of adding rules one at a time."
    setup: "Mark out a square, every kid with a ball. Run it as ten or twelve one-minute rounds instead of one long game."
    rules:
      - "Round 1: everyone just dribbles around and learns where the edges are. Nobody's getting tagged yet."
      - "Rounds 2 and 3: they dribble and try not to get tagged by you. Who gets caught the fewest times?"
      - "Rounds 4 and 5: if you tag them they're frozen until they count to five, then off they go again."
      - "Rounds 6 and 7: ask them how to unfreeze a teammate - a tag, or rolling their ball through their legs. Frozen kids hold their ball over their head so everyone can see."
      - "Rounds 8 to 10: now they're the freeze monsters, a new one each round."
    key_words: "Head up, ball close"
    note: "This is a dribbling game, not a tag game. If it turns into a chase you've lost the point. The same build-it-up approach works on nearly anything - give them the edges and the direction first, then add one rule per round."
    equipment: "Cones, a ball each"

  - id: 1v1-two-goals
    name: "One on One, Two Goals"
    focus: "Attacking"
    format: "1v1"
    numbers: "2 or more"
    week_label: "Extra"
    duration: "Short rounds"
    diagram_alt: "A small square with two goals set well apart on the far side, one attacker with the ball choosing between them and one defender."
    objective: "Running with the ball, changing direction, spotting the space."
    setup: "A small square with two goals set well apart. One attacker against one defender, and the attacker can score in either goal."
    key_words: "Which one's open?"
    questions:
      - "Which goal is open?"
      - "Can you change direction?"
      - "When can you really go for it?"
    equipment: "Four cones"

  - id: 2v2-to-cones
    name: "Two on Two to the Cones"
    focus: "Attacking"
    format: "2v2"
    numbers: "4 or more"
    week_label: "Extra"
    diagram_alt: "A wide, shallow field with a row of cone targets along each end and two players against two."
    duration: "Short rounds"
    objective: "Working with a teammate without being told to pass."
    setup: "Make the space wider than it is long. Each team looks after a row of cones and scores by knocking the ball into or through the other team's row."
    key_words: "Dribble if it's open, pass if they come to you"
    note: "Watch for whether they dribble when there's space, pass when a defender commits, move away from trouble, and how quickly they react when they lose it."
    equipment: "Cones"

  - id: four-goal-game
    name: "Four Goal Game"
    focus: "Attacking"
    format: "2v2, 3v3 or bigger"
    numbers: "4 or more"
    week_label: "Extra"
    duration: "Any"
    diagram_alt: "A square field with two goals along each end line, so each team has two to attack and two to defend."
    objective: "Getting their heads up and spotting space, without being told to spread out."
    setup: "Give each team two goals to attack instead of one. The extra goal makes spreading out something they work out for themselves, instead of something you shout."
    key_words: "Is the other goal open?"
    note: "Start with no extra rules. Only add something if it actually gets them doing what you wanted."
    equipment: "Four small goals or cone gates"

  - id: get-outta-there
    name: "In and Out"
    focus: "Attacking"
    format: "2v2, straight back on"
    numbers: "8 or more"
    week_label: "Extra"
    duration: "Keeps going"
    diagram_alt: "A small field with two lines of kids waiting beside the coach, who rolls a ball in for the next pair from each line to play two against two."
    objective: "Reacting fast, and getting loads of goes at it."
    setup: "Two lines of kids next to you. Roll a ball in and the first two from each line play 2v2. The second the ball goes out or someone scores, the next two are straight on."
    key_words: "Forwards first"
    note: "Keep the balls with you and never let it stop. The whole point is that they're playing instead of fetching."
    equipment: "Two goals, lots of balls"

  - id: dribble-gates
    name: "Gates"
    focus: "Ball work"
    format: "Everyone with a ball"
    numbers: "Any"
    week_label: "Extra"
    duration: "5-10 min"
    diagram_alt: "Pairs of cones scattered around a square making little gates, with kids dribbling their own ball through them in different directions."
    objective: "Lots of touches, both feet, changing direction."
    setup: "Scatter pairs of cones around the space to make little gates. Every kid has a ball."
    key_words: "How many gates in a minute?"
    note: "Challenge them to use as many different gates as they can, both feet, and to turn between them."
    equipment: "Lots of cones, a ball each"

  - id: sharks-and-minnows
    name: "Sharks and Minnows"
    focus: "Ball work"
    format: "Everyone with a ball"
    numbers: "Any"
    week_label: "Extra"
    duration: "Short rounds"
    diagram_alt: "A grid with sharks waiting in the middle and kids with balls lined up at one end, dribbling across to the far side."
    objective: "Dribbling with someone coming at them."
    setup: "Normal sharks and minnows, except every minnow has a ball and has to get it to the far side."
    key_words: "Head up"
    note: "Don't leave anyone out for long. A kid who loses their ball becomes a shark, comes straight back on, or does a quick job and rejoins."
    equipment: "Cones, a ball each"

  - id: end-zone-soccer
    name: "End Zone"
    focus: "Small-sided game"
    format: "2v2 or bigger"
    numbers: "4 or more"
    week_label: "Extra"
    duration: "Any"
    diagram_alt: "A field with a shaded scoring zone across each end and small teams playing towards them."
    objective: "Running at space with the ball."
    setup: "Score by dribbling into the zone at the far end with the ball under control. Later on you can let them score by receiving a pass in there instead."
    key_words: "Under control"
    equipment: "Cones"

  - id: numbers-game
    name: "Numbers"
    focus: "Small-sided game"
    format: "1v1 up to 3v3"
    numbers: "6 or more"
    week_label: "Extra"
    duration: "Keeps going"
    diagram_alt: "A field with a goal at each end, two teams waiting along the sides, and the coach calling a number so two from each team run on."
    objective: "Quick changes, lots of decisions."
    setup: "Two teams waiting along the sides. Call out one, two or three and that many run on from each team, so you get instant 1v1s, 2v2s and 3v3s."
    key_words: "Go!"
    equipment: "Two goals, balls"

