# Baltimore Ravens Season Dashboard
# Objective stats are generated by scripts/update_ravens_dashboard.py into
# ravens_dashboard_stats.json. This file holds definitions, dated team reports,
# and editorial assessments that still require human judgment.

meta:
  season: 2026
  season_label: "2026 Season"
  last_updated: "2026-09-03"
  update_context: "Week 1 approach"
  data_status: "preseason"
  data_notice: >-
    The 2026 regular season has not started. Preseason results are shown in a
    separate, clearly labeled sample; current-year league ranks and advanced
    metrics remain unavailable rather than being treated as zero. The scorecard
    includes 2025 final values only as a labeled comparison baseline.

metric_definitions:
  - id: "point_differential"
    group: "Team"
    display_name: "Point differential"
    short_label: "Point diff."
    unit: "points"
    description: "Regular-season points scored minus points allowed."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse schedules"
  - id: "turnover_differential"
    group: "Team"
    display_name: "Turnover differential"
    short_label: "Turnover diff."
    unit: "turnovers"
    description: "Takeaways minus giveaways on non-deleted regular-season plays."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse play-by-play"
  - id: "offensive_epa_per_play"
    group: "Offense"
    display_name: "Offensive EPA per play"
    short_label: "EPA / play"
    unit: "EPA per play"
    description: "Average expected points added on eligible offensive runs and passes."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "offensive_success_rate"
    group: "Offense"
    display_name: "Offensive success rate"
    short_label: "Success rate"
    unit: "percent"
    description: "Share of eligible offensive plays with positive expected points added."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate"
    group: "Offense"
    display_name: "Explosive-play rate"
    short_label: "Explosive rate"
    unit: "percent"
    description: "Share of eligible plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "red_zone_td_rate"
    group: "Offense"
    display_name: "Red-zone touchdown rate"
    short_label: "Red-zone TD rate"
    unit: "percent"
    description: "Share of offensive drives reaching the opponent 20-yard line that produce a touchdown."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"
  - id: "defensive_epa_per_play"
    group: "Defense"
    display_name: "Defensive EPA allowed per play"
    short_label: "EPA allowed / play"
    unit: "EPA per play"
    description: "Average expected points added by opponents on eligible runs and passes."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "defensive_success_rate"
    group: "Defense"
    display_name: "Opponent success rate"
    short_label: "Success allowed"
    unit: "percent"
    description: "Share of eligible opponent plays with positive expected points added."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate_allowed"
    group: "Defense"
    display_name: "Explosive-play rate allowed"
    short_label: "Explosives allowed"
    unit: "percent"
    description: "Share of opponent plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "opponent_red_zone_td_rate"
    group: "Defense"
    display_name: "Opponent red-zone touchdown rate"
    short_label: "Opponent RZ TD rate"
    unit: "percent"
    description: "Share of opponent drives reaching Baltimore's 20-yard line that produce a touchdown."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"

scorecard_groups:
  - name: "Team"
    metric_ids: ["point_differential", "turnover_differential"]
  - name: "Offense"
    metric_ids: ["offensive_epa_per_play", "offensive_success_rate", "explosive_play_rate", "red_zone_td_rate"]
  - name: "Defense"
    metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed", "opponent_red_zone_td_rate"]

editorial:
  state:
    summary: >-
      Baltimore reaches Week 1 with a 3-0 preseason and a 78-13 aggregate score,
      useful evidence of depth but not a substitute for regular-season performance.
      Lamar Jackson and Derrick Henry still establish a championship-level ceiling,
      while the defense's three-game preseason showing was the cleanest team-wide
      signal. The immediate questions sit inside: Danny Pinter's likely season-ending
      knee injury complicated the center picture, and Nnamdi Madubuike is only now
      returning to team work. Zay Flowers' September 3 return is a meaningful positive.
    biggest_strength: "The Jackson–Henry core and a deep defense give Baltimore answers in multiple game scripts."
    biggest_concern: "Center stability and fast interior pressure remain the clearest threats to the offense's full menu."
    changed_this_week: "Madubuike and Flowers returned to team work, while the initial 53-man roster clarified the Week 1 depth chart."

  metric_assessments:
    point_differential: { status: null, interpretation: "Regular-season scoring margin begins after Week 1; the preseason +65 is displayed separately." }
    turnover_differential: { status: null, interpretation: "Regular-season takeaway and giveaway context begins after Week 1." }
    offensive_epa_per_play: { status: null, interpretation: "No 2026 regular-season offensive plays yet; the labeled 2025 value provides scale only." }
    offensive_success_rate: { status: null, interpretation: "No 2026 regular-season offensive plays yet; the labeled 2025 value provides scale only." }
    explosive_play_rate: { status: null, interpretation: "No 2026 regular-season sample yet. Explosives use a fixed 10-yard run / 20-yard pass definition." }
    red_zone_td_rate: { status: null, interpretation: "The drive-level 2026 rate begins once Baltimore has a regular-season red-zone possession." }
    defensive_epa_per_play: { status: null, interpretation: "The preseason defense was strong, but no preseason play is included in the ranked regular-season metric." }
    defensive_success_rate: { status: null, interpretation: "No 2026 regular-season opponent plays yet; the labeled 2025 value provides scale only." }
    explosive_play_rate_allowed: { status: null, interpretation: "The regular-season baseline begins after Week 1 under the same explosive-play definition as the offense." }
    opponent_red_zone_td_rate: { status: null, interpretation: "The drive-level 2026 rate begins once an opponent reaches Baltimore's red zone." }

  overviews:
    offense:
      status: "Good"
      assessment: >-
        Jackson and Henry still force a defense to solve numbers before the snap,
        and Flowers' return restores the primary space-creating receiver. Declan
        Doyle's first real test is keeping that multiplicity intact while the center
        group settles after Pinter's injury.
      trend_summary: "Preseason complete; regular-season efficiency begins at Indianapolis."
      metric_ids: ["offensive_epa_per_play", "explosive_play_rate", "red_zone_td_rate"]
      links:
        - { label: "How Declan Doyle could change the offense", url: "/ravens/what-will-declan-doyle-change/" }
    defense:
      status: "Good"
      assessment: >-
        Allowing 13 points across three preseason games is a real result and a
        positive depth signal, though personnel and opponent quality prevent a
        league-strength conclusion. Madubuike's return to team drills improves the
        outlook for four-man pressure without making his Week 1 status certain.
      trend_summary: "Finished the preseason 3-0 while allowing 4.3 points per game."
      metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed"]
      links:
        - { label: "Five questions defining the Ravens' season", url: "/ravens/five-questions-that-will-define-the-season/" }

  units:
    - { name: "Quarterback", assessment: "Elite", trend: "stable", explanation: "Jackson remains the central championship advantage and the offense's answer when structure breaks." }
    - { name: "Running backs", assessment: "Strength", trend: "stable", explanation: "Henry gives Baltimore a physical baseline that magnifies every hesitation created by Jackson and motion." }
    - { name: "Wide receivers", assessment: "Solid", trend: "up", explanation: "Flowers returned September 3 after a minor issue, restoring the room's proven stress point." }
    - { name: "Tight ends", assessment: "Solid", trend: "stable", explanation: "The group remains essential to hiding run and pass intentions from heavier personnel." }
    - { name: "Offensive line", assessment: "Concern", trend: "down", explanation: "Pinter's likely season-ending knee injury leaves center continuity as the clearest structural risk." }
    - { name: "Defensive line", assessment: "Solid", trend: "up", explanation: "Madubuike joined team drills September 3, a meaningful step even with Week 1 still day-to-day." }
    - { name: "Edge rushers", assessment: "Solid", trend: "stable", explanation: "Trey Hendrickson raises the proven ceiling; regular-season four-man wins will be the real test." }
    - { name: "Linebackers", assessment: "Solid", trend: "up", explanation: "Buchanan has returned to team work, though Week 1 versus Week 2 remains unsettled." }
    - { name: "Secondary", assessment: "Strength", trend: "stable", explanation: "Depth and versatility give Jesse Minter options to change the coverage picture after the snap." }
    - { name: "Specialists", assessment: "Mixed", trend: "down", explanation: "Tyler Loop went 5-for-8 in the preseason, and Jake Moody's practice-squad addition keeps the kicking evaluation open." }

  weekly_changes:
    - { direction: "up", title: "Interior defensive line", text: "Madubuike joined team drills September 3; Minter called his Week 1 status day-to-day." }
    - { direction: "up", title: "Receiver availability", text: "Flowers returned to practice after missing time with a minor issue." }
    - { direction: "down", title: "Center stability", text: "Pinter's knee injury is expected to end his season and leaves the position unsettled." }
    - { direction: "down", title: "Kicker certainty", text: "Loop's 5-for-8 preseason and Moody's addition leave a live evaluation entering Week 1." }

  championship_check:
    - { category: "Quarterback play", status: "Ready", explanation: "Jackson gives Baltimore a championship answer within structure and when the original play disappears." }
    - { category: "Pass protection", status: "Concern", explanation: "The center picture can create immediate interior pressure that narrows the offense before the snap." }
    - { category: "Explosive offense", status: "Trending Right", explanation: "Flowers, Henry and Jackson give Doyle the pieces; the regular season will test the presentation." }
    - { category: "Four-man pass rush", status: "Trending Right", explanation: "Hendrickson changes the edge ceiling, while Madubuike's return improves the interior outlook." }
    - { category: "Health", status: "Unclear", explanation: "Flowers is back, but Madubuike and Buchanan are still progressing and Pinter is expected to miss the season." }

