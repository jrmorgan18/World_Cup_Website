    offense:
      status: "Elite"
      assessment: >-
        Doyle's regular-season debut answered the immediate scheme question. Jackson
        accounted for 364 yards, Henry supplied 144 yards and three touchdowns, and the
        group created 10 explosive plays. Baltimore's new interior starters helped power
        a 506-yard day, but 10 penalties and the Flowers-Lane injuries are the Week 2
        qualifiers.
