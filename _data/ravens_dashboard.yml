editorial:
  state:
    summary: >-
      The Ravens fell to 4-5 after a 33-10 loss to Jacksonville, their fourth
      straight defeat. Jesse Minter expects Jacoby Brissett to start Monday
      night against the Chargers after his trade from Arizona. Lamar Jackson
      and Tyler Huntley are on injured reserve. Minter was encouraged by Kyle
      Hamilton's initial outlook after the safety injured his hip against the Jaguars.
    biggest_strength: "Zay Flowers is fifth among qualifying wide receivers at 2.90 yards per route run and third at +2.85 yards after catch over expectation."
    biggest_concern: "The Ravens have scored fewer than 14 points in four straight games and allowed 30 or more in three straight. Jacksonville hit passes of 52 and 50 yards."
    changed_this_week: "Brissett joined the active roster, Austin Reed was waived, and the Ravens turn to a veteran quarterback against the Chargers."

