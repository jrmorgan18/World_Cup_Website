# Baltimore Ravens Season Dashboard
# Objective stats are generated by scripts/update_ravens_dashboard.py into
# ravens_dashboard_stats.json. This file holds definitions, dated team reports,
# and editorial assessments that still require human judgment.

meta:
  season: 2026
  season_label: "2026 Season"
  last_updated: "2026-10-13"
  update_context: "Through complete Week 5 games · Cleveland next"
  data_status: "through-week-5"
  data_notice: >-
    Five games are still an early sample, so league ranks and rate statistics are
    directional rather than predictive. The scorecard uses 2026 regular-season
    play-by-play and keeps the 2025 final values as a labeled comparison baseline.
    All Week 5 games are included; subsequent statistical corrections may revise
    ranks and rates. ESPN trench rates and Filmstudy scoring carry their own reporting weeks.

metric_definitions:
  - id: "overall_efficiency"
    group: "Team"
    display_name: "Dual Eights efficiency index"
    short_label: "Efficiency index"
    unit: "index"
    description: "The v2.1 observed-efficiency index: opponent/venue-adjusted offense and defense each carry 45%, and context-adjusted special teams carry 10%. A fixed prior-season calibration preserves performance magnitudes. Its 0–100 display scale is neither a percentile nor a win probability."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 1.0
    default_source: "Dual Eights v2.1 from nflverse play-by-play"
  - id: "point_differential"
    group: "Team"
    display_name: "Point differential"
    short_label: "Point diff."
    unit: "points"
    description: "Regular-season points scored minus points allowed."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse schedules"
  - id: "turnover_differential"
    group: "Team"
    display_name: "Turnover differential"
    short_label: "Turnover diff."
    unit: "turnovers"
    description: "Takeaways minus giveaways on non-deleted regular-season plays."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse play-by-play"
  - id: "offensive_epa_per_play"
    group: "Offense"
    display_name: "Offensive EPA per play"
    short_label: "EPA / play"
    unit: "EPA per play"
    description: "Average expected points added on eligible offensive runs and passes."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "offensive_success_rate"
    group: "Offense"
    display_name: "Offensive success rate"
    short_label: "Success rate"
    unit: "percent"
    description: "Share of eligible offensive plays with positive expected points added."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate"
    group: "Offense"
    display_name: "Explosive-play rate"
    short_label: "Explosive rate"
    unit: "percent"
    description: "Share of eligible plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "red_zone_td_rate"
    group: "Offense"
    display_name: "Red-zone touchdown rate"
    short_label: "Red-zone TD rate"
    unit: "percent"
    description: "Share of offensive drives reaching the opponent 20-yard line that produce a touchdown."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"
  - id: "defensive_epa_per_play"
    group: "Defense"
    display_name: "Defensive EPA allowed per play"
    short_label: "EPA allowed / play"
    unit: "EPA per play"
    description: "Average expected points added by opponents on eligible runs and passes."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "defensive_success_rate"
    group: "Defense"
    display_name: "Opponent success rate"
    short_label: "Success allowed"
    unit: "percent"
    description: "Share of eligible opponent plays with positive expected points added."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate_allowed"
    group: "Defense"
    display_name: "Explosive-play rate allowed"
    short_label: "Explosives allowed"
    unit: "percent"
    description: "Share of opponent plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "opponent_red_zone_td_rate"
    group: "Defense"
    display_name: "Opponent red-zone touchdown rate"
    short_label: "Opponent RZ TD rate"
    unit: "percent"
    description: "Share of opponent drives reaching the Ravens' 20-yard line that produce a touchdown."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"

scorecard_groups:
  - name: "Team"
    metric_ids: ["overall_efficiency", "point_differential", "turnover_differential"]
  - name: "Offense"
    metric_ids: ["offensive_epa_per_play", "offensive_success_rate", "explosive_play_rate", "red_zone_td_rate"]
  - name: "Defense"
    metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed", "opponent_red_zone_td_rate"]

editorial:
  state:
    summary: >-
      The Ravens are 4-1 and alone atop the AFC North after a 30-23 overtime win
      in Atlanta. Huntley delivered two touchdown passes and the winning quarterback
      sneak while Henry and Hill powered a 208-yard rushing night. Hamilton's
      interception finished the comeback. The season offense remains second in
      success rate and third in explosive-play rate, but third-down defense and
      pass protection still need work. Jackson, Hendrickson, Jurgens and Vorhees
      missed the Falcons game; their Cleveland availability awaits this week's
      reports. Flowers and Humphrey played and their old questionable labels have
      been removed. Broderick Washington's newly reported ankle issue is being monitored.
    biggest_strength: "The offense remains second in success rate, third in explosive-play rate and sixth in red-zone touchdown rate after finding a way to win without Jackson."
    biggest_concern: "Jackson's ankle and the absences of Hendrickson, Jurgens and Vorhees remain unresolved. Cleveland game designations have not been issued."
    changed_this_week: "A third straight win moved the Ravens to 4-1. Huntley finished the comeback, the run game produced 208 yards, and Hamilton sealed overtime."

  metric_assessments:
    overall_efficiency: { status: "Good", interpretation: "The Ravens are fifth at 62.5 in the published v2.1 index through the complete Week 5 slate, up from sixth at 60.5 through Week 4. The model adjusts for opponent and venue and blends offense, defense and special teams; this five-game sample is not a forecast." }
    point_differential: { status: "Good", interpretation: "The seven-point overtime win lifts the season margin to +27, sixth among completed league results." }
    turnover_differential: { status: "Good", interpretation: "The season remains +3, ninth in the league. Andrews' lost fumble and Hamilton's game-sealing interception left the Falcons game at one giveaway and one takeaway." }
    offensive_epa_per_play: { status: "Good", interpretation: "The offense is sixth at 0.15 EPA/play for the season. The Atlanta game produced 0.04 per eligible play as Huntley led the late comeback." }
    offensive_success_rate: { status: "Elite", interpretation: "The 50.7% season success rate ranks second. The Ravens succeeded on 47.1% of eligible plays against Atlanta." }
    explosive_play_rate: { status: "Elite", interpretation: "The season explosive-play rate is 13.2%, third in the league. Hill's 47-yard run supplied Atlanta's standout rushing gain." }
    red_zone_td_rate: { status: "Good", interpretation: "The Ravens have converted 73.7% of qualifying red-zone drives into touchdowns, sixth in the league. The late regulation and overtime scores made the difference in Atlanta." }
    defensive_epa_per_play: { status: "Average", interpretation: "Season EPA allowed is -0.02, 15th. Atlanta was also held to -0.02 per eligible play; the defense conceded only one offensive touchdown, but third-down conversions extended too many drives." }
    defensive_success_rate: { status: "Good", interpretation: "Opponent success improves to 40.9%, sixth in the league, after Atlanta succeeded on 34.4% of eligible plays." }
    explosive_play_rate_allowed: { status: "Average", interpretation: "The season rate is 9.4%, 17th. Limiting long gains remains important even as the defense wins more individual downs." }
    opponent_red_zone_td_rate: { status: "Good", interpretation: "Opponents have scored touchdowns on 55.6% of qualifying red-zone drives, 12th. Atlanta's offense managed one touchdown despite repeated third-down conversions." }

  overviews:
    offense:
      status: "Elite"
      assessment: >-
        The Ravens are second in success rate, third in explosive-play rate and sixth
        in EPA per play through five games. A 208-yard rushing night and Huntley's
        late execution kept the offense competitive without Jackson. The receiving
        group made key late plays, but ball security and protection remain priorities.
      trend_summary: "Huntley and the run game delivered in Atlanta; Jackson's recovery and the interior line frame Cleveland week."
      metric_ids: ["offensive_epa_per_play", "explosive_play_rate", "red_zone_td_rate"]
      links:
        - { label: "How Declan Doyle could change the offense", url: "/ravens/what-will-declan-doyle-change/" }
    defense:
      status: "Good"
      assessment: >-
        Atlanta's offense scored 16 points, with the other seven coming from a fumble
        return. Hamilton ended overtime with an interception, while the front made
        important late plays. Opponent success is sixth for the season, but Atlanta's
        9-of-17 third-down conversion rate shows the situational work still required.
      trend_summary: "Opponent success improves to sixth; third-down defense remains the clearest correction after Atlanta."
      metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed"]
      links:
        - { label: "Five questions defining the Ravens' season", url: "/ravens/five-questions-that-will-define-the-season/" }

  units:
    - { name: "Quarterback", assessment: "Elite", trend: "down", season_grade: "A-", season_grade_points: 3.734, last_game_grade: "B-", explanation: "Week 5: Huntley completed 24 of 32 passes for 201 yards, two touchdowns and no interceptions, then scored the overtime winner. Jackson's season QBR and CPOE are separate analytics, not grades for Huntley's performance.", link: "/ravens/first-and-five-falcons-week-five-2026/" }
    - { name: "Running backs", assessment: "Solid", trend: "up", season_grade: "B+", season_grade_points: 3.464, last_game_grade: "A", explanation: "Week 5: Henry ran for 102 yards and added a receiving touchdown; Hill contributed 73 rushing yards. Their production led a 208-yard team rushing night." }
    - { name: "Wide receivers", assessment: "Strength", trend: "stable", season_grade: "A-", season_grade_points: 3.736, last_game_grade: "A", explanation: "Week 5: Flowers returned to action, Bateman supplied key completions and Walker caught the late touchdown. Flowers' season yards per route run and YAC over expectation provide additional receiving context." }
    - { name: "Tight ends", assessment: "Solid", trend: "down", season_grade: "B-", season_grade_points: 2.6, last_game_grade: "D", explanation: "Week 5: Andrews' lost fumble was returned for a touchdown, though he helped on the overtime drive. Vannett joined the blocking rotation with Smythe on IR." }
    - { name: "Offensive line", assessment: "Mixed", trend: "up", season_grade: "C+", season_grade_points: 2.464, last_game_grade: "B", explanation: "Week 5: Ioane made his second start at center and Emery Jones Jr. replaced the inactive Vorhees. The run game produced 208 yards. Jurgens' debut still requires concussion clearance. ESPN trench rates and Filmstudy's aggregated letter grades remain through Week 4 until new reports are published.", link: "/ravens/first-and-five-falcons-week-five-2026/" }
    - { name: "Defensive line", assessment: "Strength", trend: "up", season_grade: "B+", season_grade_points: 3.464, last_game_grade: "A", explanation: "Week 5: Campbell helped anchor the front and Madubuike's workload rose to 53 snaps. Washington's ankle is an availability watch. The latest published ESPN run-stop rates are separately labeled through Week 4." }
    - { name: "Edge rushers", assessment: "Solid", trend: "up", season_grade: "B", season_grade_points: 3.066, last_game_grade: "B+", explanation: "Week 5: Green recorded a sack and two tackles for loss, while Robinson's late strip-sack helped stop Atlanta's final regulation drive. Hendrickson missed a second game. The latest published ESPN rush rates are separately labeled through Week 4." }
    - { name: "Linebackers", assessment: "Solid", trend: "up", season_grade: "B", season_grade_points: 3.0, last_game_grade: "B", explanation: "Week 5: Atlanta converted 9 of 17 third downs, keeping underneath coverage and situational execution on the correction list. No defensible free league-wide linebacker metric is added." }
    - { name: "Secondary", assessment: "Mixed", trend: "up", season_grade: "B-", season_grade_points: 2.736, last_game_grade: "B", explanation: "Week 5: London had a big day, but Hamilton's interception sealed the game and Starks had a big game, leading the team with 10 tackles. Humphrey played all 64 defensive snaps. Opponent CPOE is a separate season metric." }
    - { name: "Specialists", assessment: "Strength", trend: "up", season_grade: "B+", season_grade_points: 3.398, last_game_grade: "A-", explanation: "Week 5: The kicking was good, but the punting was mediocre. Loop made all three field-goal attempts, including two from 51 yards, plus the overtime extra point." }

  weekly_changes:
    - { direction: "up", title: "Huntley finished the job", text: "Two touchdown passes, the overtime sneak and no interceptions gave the Ravens a third straight win without their starting quarterback." }
    - { direction: "up", title: "The run game traveled", text: "Henry and Hill powered 208 rushing yards behind another reshuffled line." }
    - { direction: "up", title: "The defense closed", text: "Hamilton's overtime interception sealed the win. Atlanta's offensive scoring was limited to 16 points." }
    - { direction: "down", title: "Third downs still hurt", text: "Atlanta converted 9 of 17 third downs. Situational coverage remains a priority despite the late stops." }
    - { direction: "stable", title: "Cleveland availability pending", text: "Jackson, Hendrickson, Jurgens and Vorhees missed Atlanta. Resolved game-day flags have been removed; new Week 6 designations await official reports." }

  championship_check:
    - { category: "Quarterback play", status: "Ready", explanation: "Jackson is second in the latest qualified Total QBR rankings. Huntley delivered the Atlanta comeback; Jackson's recovery remains the availability question." }
    - { category: "Pass protection", status: "Unclear", explanation: "Ioane has stabilized center, but Jurgens and Vorhees missed Atlanta and the line remains in transition." }
    - { category: "Explosive offense", status: "Ready", explanation: "The Ravens remain third in explosive-play rate. The run game supplied Atlanta's biggest offensive gain." }
    - { category: "Four-man pass rush", status: "Unclear", explanation: "Green and Robinson made important plays in Atlanta, but Hendrickson's absence remains a limitation. Team win rates are still published through Week 4." }
    - { category: "Health", status: "Concern", explanation: "Jackson, Hendrickson, Jurgens and Vorhees missed Week 5. Several centers and Smythe remain on IR; no final Cleveland designations have been issued." }

