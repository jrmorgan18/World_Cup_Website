# Baltimore Ravens Season Dashboard
# Objective stats are generated by scripts/update_ravens_dashboard.py into
# ravens_dashboard_stats.json. This file holds definitions, dated team reports,
# and editorial assessments that still require human judgment.

meta:
  season: 2026
  season_label: "2026 Season"
  last_updated: "2026-10-27"
  update_context: "Bengals recap · Buffalo next · Week 7 editorial grades"
  data_status: "through-week-7"
  data_notice: >-
    Seven games are still an early sample, so league ranks and rate statistics are
    directional rather than predictive. The scorecard uses 2026 regular-season
    play-by-play and keeps the 2025 final values as a labeled comparison baseline.
    All Week 7 games are included; subsequent statistical corrections may revise
    ranks and rates. ESPN trench rates and Filmstudy scoring carry their own reporting weeks.

metric_definitions:
  - id: "overall_efficiency"
    group: "Team"
    display_name: "Dual Eights efficiency index"
    short_label: "Efficiency index"
    unit: "index"
    description: "The v2.1 observed-efficiency index: opponent/venue-adjusted offense and defense each carry 45%, and context-adjusted special teams carry 10%. A fixed prior-season calibration preserves performance magnitudes. Its 0–100 display scale is neither a percentile nor a win probability."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 1.0
    default_source: "Dual Eights v2.1 from nflverse play-by-play"
  - id: "point_differential"
    group: "Team"
    display_name: "Point differential"
    short_label: "Point diff."
    unit: "points"
    description: "Regular-season points scored minus points allowed."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse schedules"
  - id: "turnover_differential"
    group: "Team"
    display_name: "Turnover differential"
    short_label: "Turnover diff."
    unit: "turnovers"
    description: "Takeaways minus giveaways on non-deleted regular-season plays."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse play-by-play"
  - id: "offensive_epa_per_play"
    group: "Offense"
    display_name: "Offensive EPA per play"
    short_label: "EPA / play"
    unit: "EPA per play"
    description: "Average expected points added on eligible offensive runs and passes."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "offensive_success_rate"
    group: "Offense"
    display_name: "Offensive success rate"
    short_label: "Success rate"
    unit: "percent"
    description: "Share of eligible offensive plays with positive expected points added."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate"
    group: "Offense"
    display_name: "Explosive-play rate"
    short_label: "Explosive rate"
    unit: "percent"
    description: "Share of eligible plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "red_zone_td_rate"
    group: "Offense"
    display_name: "Red-zone touchdown rate"
    short_label: "Red-zone TD rate"
    unit: "percent"
    description: "Share of offensive drives reaching the opponent 20-yard line that produce a touchdown."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"
  - id: "defensive_epa_per_play"
    group: "Defense"
    display_name: "Defensive EPA allowed per play"
    short_label: "EPA allowed / play"
    unit: "EPA per play"
    description: "Average expected points added by opponents on eligible runs and passes."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "defensive_success_rate"
    group: "Defense"
    display_name: "Opponent success rate"
    short_label: "Success allowed"
    unit: "percent"
    description: "Share of eligible opponent plays with positive expected points added."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate_allowed"
    group: "Defense"
    display_name: "Explosive-play rate allowed"
    short_label: "Explosives allowed"
    unit: "percent"
    description: "Share of opponent plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "opponent_red_zone_td_rate"
    group: "Defense"
    display_name: "Opponent red-zone touchdown rate"
    short_label: "Opponent RZ TD rate"
    unit: "percent"
    description: "Share of opponent drives reaching the Ravens' 20-yard line that produce a touchdown."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"

scorecard_groups:
  - name: "Team"
    metric_ids: ["overall_efficiency", "point_differential", "turnover_differential"]
  - name: "Offense"
    metric_ids: ["offensive_epa_per_play", "offensive_success_rate", "explosive_play_rate", "red_zone_td_rate"]
  - name: "Defense"
    metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed", "opponent_red_zone_td_rate"]

editorial:
  state:
    summary: >-
      The Ravens are 4-3 and 0-2 in the AFC North after a 13-0 halftime lead became
      a 35-13 loss to Cincinnati. They have been outscored 48-0 after halftime over
      the past two games. Flowers supplied eight catches for 137 yards, but the run
      game stalled and the defense allowed five consecutive touchdown drives.
      Jurgens made his debut at center before Ioane left with a knee injury.
      Buffalo is next, on the road November 1. Reports point toward Jackson's return,
      but his availability has not been formally confirmed.
    biggest_strength: "Flowers continues to create explosive plays; the Ravens rank fourth in season explosive-play rate through Week 7."
    biggest_concern: "Back-to-back second-half shutouts and Cincinnati's five straight touchdown drives expose problems with adjustments and finishing games."
    changed_this_week: "The Ravens fell to 4-3. Jurgens debuted, Ioane suffered a knee injury, and the Bengals erased a 13-point halftime deficit. Buffalo comes next."

  metric_assessments:
    overall_efficiency: { status: "Average", interpretation: "The Ravens are 14th at 53.7 in the v2.1 index through Week 7, down from 11th at 56.3 through Week 6. The index measures observed efficiency rather than predicting the next game." }
    point_differential: { status: "Average", interpretation: "The 22-point loss to Cincinnati reduces the season margin to +2, 16th in the league." }
    turnover_differential: { status: "Average", interpretation: "The Ravens are +1, 14th, after losing the Week 7 turnover battle 1-0." }
    offensive_epa_per_play: { status: "Good", interpretation: "The offense is eighth at 0.08 EPA/play through seven games. The Ravens finished at -0.09 per eligible play against Cincinnati." }
    offensive_success_rate: { status: "Good", interpretation: "Season success rate is 47.0%, ninth. The Ravens succeeded on 41.5% of eligible plays against the Bengals." }
    explosive_play_rate: { status: "Elite", interpretation: "The Ravens rank fourth in season explosive-play rate at 11.3%. Flowers' 48-yard touchdown was a Week 7 highlight." }
    red_zone_td_rate: { status: "Average", interpretation: "The Ravens have scored touchdowns on 62.5% of qualifying red-zone drives, 14th. Finishing scoring opportunities remains a concern." }
    defensive_epa_per_play: { status: "Average", interpretation: "Season EPA allowed is 0.01, 17th. Cincinnati produced 0.33 EPA per eligible play in Week 7." }
    defensive_success_rate: { status: "Average", interpretation: "Opponent success is 43.2%, 15th. Cincinnati succeeded on 56.9% of eligible plays in Week 7." }
    explosive_play_rate_allowed: { status: "Good", interpretation: "The Ravens allow explosive gains on 8.1% of eligible plays, 11th through Week 7." }
    opponent_red_zone_td_rate: { status: "Concern", interpretation: "Opponents have converted 66.7% of qualifying red-zone drives into touchdowns, 20th through Week 7." }

  overviews:
    offense:
      status: "Good"
      assessment: >-
        The Ravens rank ninth in success rate, fourth in explosive-play rate and eighth
        in EPA per play through seven games. Huntley's 298 passing yards and Flowers'
        production could not prevent a second consecutive second-half shutout.
      trend_summary: "The run game and scoring efficiency need answers before the trip to Buffalo."
      metric_ids: ["offensive_epa_per_play", "explosive_play_rate", "red_zone_td_rate"]
      links:
        - { label: "How Declan Doyle could change the offense", url: "/ravens/what-will-declan-doyle-change/" }
    defense:
      status: "Average"
      assessment: >-
        Cincinnati turned 59 first-half yards into a 35-point second half. Season
        EPA allowed is 17th and opponent success 15th. Buffalo's league-leading
        offensive EPA per play presents another difficult test.
      trend_summary: "Coverage, tackling and second-half adjustments must improve against the Bills."
      metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed"]
      links:
        - { label: "Five questions defining the Ravens' season", url: "/ravens/five-questions-that-will-define-the-season/" }

  units:
    - { name: "Quarterback", assessment: "Solid", trend: "down", season_grade: "B", season_grade_points: 3.048, last_game_grade: "C-", explanation: "Week 7: Huntley threw for a career-high 298 yards, including 215 before halftime, but the offense was shut out after the break. Jackson's QBR remains a separate season metric.", link: "/ravens/first-and-five-bengals-week-seven-2026/" }
    - { name: "Running backs", assessment: "Solid", trend: "down", season_grade: "B", season_grade_points: 2.903, last_game_grade: "C", explanation: "Week 7: Henry managed 45 yards on 17 carries, averaging 2.6 yards per attempt as the running game struggled against Cincinnati." }
    - { name: "Wide receivers", assessment: "Strength", trend: "down", season_grade: "A-", season_grade_points: 3.573, last_game_grade: "B+", explanation: "Week 7: Flowers caught eight passes for 137 yards and a 48-yard touchdown. His season yards per route run and YAC over expectation remain separate receiving metrics." }
    - { name: "Tight ends", assessment: "Mixed", trend: "down", season_grade: "C+", season_grade_points: 2.286, last_game_grade: "D", explanation: "Week 7: The tight ends receive a D. Huntley's fourth-and-2 pass toward Cuevas fell incomplete on a pivotal second-half possession." }
    - { name: "Offensive line", assessment: "Mixed", trend: "down", season_grade: "C", season_grade_points: 2.142, last_game_grade: "D", explanation: "Week 7: Jurgens debuted at center, but Ioane left with a knee injury and Jones replaced him at guard. Huntley was sacked four times and Henry averaged 2.6 yards per carry. ESPN rates and Filmstudy grades retain their own published reporting periods.", link: "/ravens/first-and-five-bengals-week-seven-2026/" }
    - { name: "Defensive line", assessment: "Strength", trend: "down", season_grade: "B+", season_grade_points: 3.474, last_game_grade: "B", explanation: "Week 7: The interior receives a B. The defense held Cincinnati to 59 first-half yards before the Bengals reversed the game after halftime. ESPN win rates are separate published metrics." }
    - { name: "Edge rushers", assessment: "Solid", trend: "down", season_grade: "B", season_grade_points: 2.857, last_game_grade: "C-", explanation: "Week 7: The edge group receives a C-. The rush could not disrupt Burrow consistently during Cincinnati's second-half turnaround, with Robinson unavailable." }
    - { name: "Linebackers", assessment: "Solid", trend: "down", season_grade: "B-", season_grade_points: 2.618, last_game_grade: "D", explanation: "Week 7: The linebackers receive a D as tackling and second-half execution broke down during five consecutive Cincinnati touchdown drives." }
    - { name: "Secondary", assessment: "Solid", trend: "down", season_grade: "B-", season_grade_points: 2.573, last_game_grade: "D", explanation: "Week 7: Higgins caught six passes for 148 yards and a touchdown, while Chase added five for 62 and a score. Burrow threw four touchdowns after halftime." }
    - { name: "Specialists", assessment: "Solid", trend: "down", season_grade: "B", season_grade_points: 2.855, last_game_grade: "C", explanation: "Week 7: The specialists receive a C. Loop's two field goals contributed to the 13-0 halftime lead, but special teams did not change the second-half momentum." }

  weekly_changes:
    - { direction: "down", title: "Another lead disappeared", text: "A 13-0 halftime advantage became a 35-13 loss. The Ravens are 4-3 and 0-2 in the division." }
    - { direction: "down", title: "No second-half answers", text: "The Ravens have been outscored 48-0 after halftime over their last two games." }
    - { direction: "up", title: "Flowers kept producing", text: "Eight catches for 137 yards and a 48-yard touchdown supplied the offensive highlight against Cincinnati." }
    - { direction: "down", title: "Another line injury", text: "Jurgens debuted at center, but Ioane left with a knee injury and Jones replaced him at guard." }
    - { direction: "down", title: "Buffalo is next", text: "The Bills lead the league in offensive EPA per play through Week 7. Jackson's return has been reported but not formally confirmed." }

  championship_check:
    - { category: "Quarterback play", status: "Unclear", explanation: "Huntley threw for 298 yards against Cincinnati, but the offense was shut out after halftime again. Reports point toward Jackson returning against Buffalo; his availability is not formally confirmed." }
    - { category: "Pass protection", status: "Concern", explanation: "Jurgens debuted at center, but Ioane left with a knee injury. Huntley was sacked four times against Cincinnati." }
    - { category: "Explosive offense", status: "Ready", explanation: "The Ravens rank fourth in explosive-play rate at 11.3% through Week 7. Flowers remains the clearest source of big plays." }
    - { category: "Four-man pass rush", status: "Concern", explanation: "The edge unit receives a C- against Cincinnati. Disrupting Buffalo's passing game without Robinson will be a major test." }
    - { category: "Health", status: "Concern", explanation: "Ioane's knee injury adds a new offensive-line concern. Jackson's availability remains a Week 8 watch, while Robinson is on season-ending IR." }

