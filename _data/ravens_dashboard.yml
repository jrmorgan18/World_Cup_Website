methodology_notes:
  - "The current Dual Eights Efficiency Index uses the published v2.1 formula: 45% opponent/venue-adjusted offense, 45% adjusted defense and 10% context-adjusted special teams. Dropbacks and designed runs are fitted separately, with reduced fourth-quarter weight in extreme game states and a fixed 2025 calibration. The display transform is 50 + 50 × tanh(composite / 2); it is not a percentile or a win probability."
  - "The raw EPA, success, explosive-play and red-zone scorecard statistics remain unweighted. Archived Week 1–3 index snapshots retain the original percentile formula; Week 4's published v2.1 value supplies the same-scale comparison for Week 5. Archived article text is unchanged."
  - "Only regular-season plays count toward the ranked scorecard. Kneels, spikes, two-point attempts, deleted plays and aborted plays are excluded."
  - "Explosive plays are runs of 10+ yards or passes of 20+ yards, divided by eligible run/pass plays."
  - "Red-zone rates are drive-level: a drive qualifies once it reaches the opponent 20-yard line."
  - "ESPN pass-block and pass-rush win rates measure whether the blocker sustains or the rusher defeats a block within 2.5 seconds; its run-block and run-stop rates evaluate the result of blocks on designed runs."
  - "NFL Next Gen Stats CPOE compares actual completion rate with expected completion rate; RYOE/att compares a runner's yards with the model's expectation per attempt; YACOE compares yards after catch with expected yards after catch."
  - "ESPN Total QBR values quarterback contributions on passes, rushes, sacks, turnovers and penalties on a 0–100 scale, adjusted for opponent strength. Only qualified quarterbacks are ranked."
  - "The secondary's opponent CPOE is calculated from nflverse play-by-play and ranked from lowest to highest because suppressing completions relative to expectation is better."
  - "Pressure rate is omitted because the free sources reviewed do not expose a defensible complete pressure variable."
  - "Playoff probability is omitted until a transparent, repeatable model is added."
  - "Unit letter grades are editorial, informed by role, film and results; they are separate from the statistical scorecard."
  - "ESPN win rates are shown as third-party evidence and are not converted directly into Dual Eights letter grades. Team ranks are among 32 teams; player ranks are within the listed ESPN position group."
  - "Filmstudy ranks compare Ravens linemen only. Dual Eights converts each explicitly published adjusted game letter grade to a standard grade-point scale, weights it by that game's scored snaps and rounds the average to the nearest letter grade. Players need at least 20 graded snaps; ungraded appearances do not enter the average. Delayed scoring published inside a later report is assigned to the actual game week and counted once."

