    offense:
      status: "Problem"
      assessment: "The Ravens gained 144 total yards and converted three of 13 third downs in Buffalo after losing Jackson and Huntley. Fagnano finished 10-of-21 for 91 yards."
      trend_summary: "Protect the available quarterback and rebuild the plan for a short week."
