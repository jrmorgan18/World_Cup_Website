# Baltimore Ravens Season Dashboard
# Objective stats are generated by scripts/update_ravens_dashboard.py into
# ravens_dashboard_stats.json. This file holds definitions, dated team reports,
# and editorial assessments that still require human judgment.

meta:
  season: 2026
  season_label: "2026 Season"
  last_updated: "2026-10-09"
  update_context: "Through available Week 4 games · Atlanta next"
  data_status: "through-week-4"
  data_notice: >-
    Four games are still an early sample, so league ranks and rate statistics are
    directional rather than predictive. The scorecard uses 2026 regular-season
    play-by-play and keeps the 2025 final values as a labeled comparison baseline.
    League ranks include completed games only and may change as remaining Week 4
    results arrive. ESPN trench rates and Filmstudy scoring carry their own reporting weeks.

metric_definitions:
  - id: "overall_efficiency"
    group: "Team"
    display_name: "Dual Eights efficiency index"
    short_label: "Efficiency index"
    unit: "index"
    description: "A 0–100 league-percentile composite weighting offensive EPA/play, offensive success rate, defensive EPA allowed/play and opponent success rate equally. It is not opponent-adjusted."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 1.0
    default_source: "Dual Eights index from nflverse play-by-play"
  - id: "point_differential"
    group: "Team"
    display_name: "Point differential"
    short_label: "Point diff."
    unit: "points"
    description: "Regular-season points scored minus points allowed."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse schedules"
  - id: "turnover_differential"
    group: "Team"
    display_name: "Turnover differential"
    short_label: "Turnover diff."
    unit: "turnovers"
    description: "Takeaways minus giveaways on non-deleted regular-season plays."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse play-by-play"
  - id: "offensive_epa_per_play"
    group: "Offense"
    display_name: "Offensive EPA per play"
    short_label: "EPA / play"
    unit: "EPA per play"
    description: "Average expected points added on eligible offensive runs and passes."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "offensive_success_rate"
    group: "Offense"
    display_name: "Offensive success rate"
    short_label: "Success rate"
    unit: "percent"
    description: "Share of eligible offensive plays with positive expected points added."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate"
    group: "Offense"
    display_name: "Explosive-play rate"
    short_label: "Explosive rate"
    unit: "percent"
    description: "Share of eligible plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "red_zone_td_rate"
    group: "Offense"
    display_name: "Red-zone touchdown rate"
    short_label: "Red-zone TD rate"
    unit: "percent"
    description: "Share of offensive drives reaching the opponent 20-yard line that produce a touchdown."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"
  - id: "defensive_epa_per_play"
    group: "Defense"
    display_name: "Defensive EPA allowed per play"
    short_label: "EPA allowed / play"
    unit: "EPA per play"
    description: "Average expected points added by opponents on eligible runs and passes."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "defensive_success_rate"
    group: "Defense"
    display_name: "Opponent success rate"
    short_label: "Success allowed"
    unit: "percent"
    description: "Share of eligible opponent plays with positive expected points added."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate_allowed"
    group: "Defense"
    display_name: "Explosive-play rate allowed"
    short_label: "Explosives allowed"
    unit: "percent"
    description: "Share of opponent plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "opponent_red_zone_td_rate"
    group: "Defense"
    display_name: "Opponent red-zone touchdown rate"
    short_label: "Opponent RZ TD rate"
    unit: "percent"
    description: "Share of opponent drives reaching the Ravens' 20-yard line that produce a touchdown."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"

scorecard_groups:
  - name: "Team"
    metric_ids: ["overall_efficiency", "point_differential", "turnover_differential"]
  - name: "Offense"
    metric_ids: ["offensive_epa_per_play", "offensive_success_rate", "explosive_play_rate", "red_zone_td_rate"]
  - name: "Defense"
    metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed", "opponent_red_zone_td_rate"]

editorial:
  state:
    summary: >-
      The Ravens are 3-1 after a 24-18 win over Tennessee, but the health questions grew
      as Lamar Jackson, Marlon Humphrey, Durham Smythe and Andrew Vorhees all left injured.
      Jackson threw for 222 yards and two touchdowns before halftime, Flowers finished
      with 118 receiving yards, and Tyler Loop hit a stadium-record 64-yard field goal.
      The defense improved, forcing two turnovers and making another goal-line stop.
      The next test is Atlanta, with Jackson's ankle and the reshuffled offensive line
      at the center of the week's availability watch.
    biggest_strength: "The Ravens remain top-three in offensive EPA/play, success rate and explosive-play rate through four games."
    biggest_concern: "Jackson's ankle, three centers on IR and fresh injuries to Humphrey, Smythe and Vorhees make health the immediate Week 5 concern."
    changed_this_week: "A second straight win moved the Ravens to 3-1; the defense improved, Ioane handled his first start at center, and Loop made a 64-yarder."

  metric_assessments:
    overall_efficiency: { status: "Elite", interpretation: "The available Week 4 results lift the equal-weight index to 82.0, No. 2. The offense remains elite and the defensive components improved against Tennessee; this is still an early, non-opponent-adjusted sample." }
    point_differential: { status: "Good", interpretation: "The six-point Titans win moves the season margin to +20, eighth among the available results. Closing games more decisively remains a priority." }
    turnover_differential: { status: "Good", interpretation: "The Ravens are +3, fifth in the league. Simpson's interception and Hamilton's forced fumble supplied two takeaways against Tennessee without a Ravens giveaway." }
    offensive_epa_per_play: { status: "Elite", interpretation: "The Ravens remain third at 0.19 EPA/play. An explosive first half offset the scoreless second half after Jackson's injury." }
    offensive_success_rate: { status: "Elite", interpretation: "The 51.7% season rate ranks second, down from Week 3 after a 44.1% game against Tennessee. The team must preserve its down-to-down rhythm through the injury reshuffle." }
    explosive_play_rate: { status: "Elite", interpretation: "The Ravens' 14.2% season rate ranks second. Flowers' 52-yard reception highlighted another game of valuable passing gains." }
    red_zone_td_rate: { status: "Good", interpretation: "The season red-zone touchdown rate rises to 73.3%, eighth. Early finishing against Tennessee helped build the lead the Ravens ultimately defended." }
    defensive_epa_per_play: { status: "Good", interpretation: "Season EPA allowed improves to -0.02, 11th, after holding Tennessee to -0.16 per eligible play. The goal-line stop was another pivotal defensive win." }
    defensive_success_rate: { status: "Good", interpretation: "Opponent success drops to 42.6%, 11th. Tennessee succeeded on just 36.2% of eligible plays, a meaningful improvement after Dallas." }
    explosive_play_rate_allowed: { status: "Average", interpretation: "The season rate is 9.4%, 17th. The late Tennessee rally remains a reminder to eliminate costly gains while protecting a lead." }
    opponent_red_zone_td_rate: { status: "Average", interpretation: "Opponents have scored touchdowns on 60.0% of red-zone drives, 13th. Madubuike's fourth-and-goal stop kept Tennessee from converting a crucial possession." }

  overviews:
    offense:
      status: "Elite"
      assessment: >-
        The Ravens are top-three in EPA per play, success rate and explosive-play rate
        through four games. Jackson's first-half passing and Flowers' explosive gains
        built a 24-7 lead against Tennessee. The scoreless second half and mounting
        injuries make continuity, protection and penalties the immediate corrections.
      trend_summary: "Top-three in EPA/play, success rate and explosive rate; Jackson's ankle and line continuity frame Week 5."
      metric_ids: ["offensive_epa_per_play", "explosive_play_rate", "red_zone_td_rate"]
      links:
        - { label: "How Declan Doyle could change the offense", url: "/ravens/what-will-declan-doyle-change/" }
    defense:
      status: "Good"
      assessment: >-
        Two takeaways and Madubuike's goal-line stop helped hold Tennessee to 18 points.
        Both EPA allowed and opponent success improved to 11th in the available league
        results. Finishing pressure with sacks and avoiding penalties remain important,
        especially with Humphrey's calf now part of the availability watch.
      trend_summary: "EPA allowed/play and opponent success improve to No. 11; the front still needs to finish its pressure."
      metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed"]
      links:
        - { label: "Five questions defining the Ravens' season", url: "/ravens/five-questions-that-will-define-the-season/" }

  units:
    - { name: "Quarterback", assessment: "Elite", trend: "stable", season_grade: "A", last_game_grade: "A+", explanation: "Jackson completed 15 of 20 for 222 yards and two touchdowns before his ankle injury. He was outstanding through the opening half, building a 24-7 lead before Huntley took over. His latest cumulative ESPN QBR and qualified league rank appear alongside the grade.", link: "/ravens/first-and-five-titans-week-four-2026/" }
    - { name: "Running backs", assessment: "Solid", trend: "down", season_grade: "B+", last_game_grade: "C+", explanation: "Henry gained 73 yards on 23 carries with one touchdown. The workload helped protect the lead, but 3.2 yards per carry was a quieter rushing day than the passing offense's early explosion." }
    - { name: "Wide receivers", assessment: "Strength", trend: "stable", season_grade: "A-", last_game_grade: "A", explanation: "Flowers finished with eight catches for 118 yards and a touchdown. His 52-yard reception supplied the vertical punch, while Bateman also delivered useful intermediate gains." }
    - { name: "Tight ends", assessment: "Solid", trend: "up", season_grade: "B", last_game_grade: "B+", explanation: "Andrews caught the three-yard touchdown that capped a 98-yard drive, and Hibner added a chunk gain. Smythe's Achilles injury threatens the group's blocking depth heading into Atlanta." }
    - { name: "Offensive line", assessment: "Mixed", trend: "up", season_grade: "C+", last_game_grade: "C", explanation: "Ioane stabilized center in his first start there. Official NGS reporting credited Simmons with just one pressure on 32 rushes, none in nine matchups with Ioane. Stanley returned, but Vorhees left with a foot injury. Filmstudy's October 7 report supplies the Tennessee grades and delayed Dallas scoring used in the aggregate letter grades below.", link: "/ravens/first-and-five-titans-week-four-2026/" }
    - { name: "Defensive line", assessment: "Strength", trend: "up", season_grade: "B+", last_game_grade: "B-", explanation: "Madubuike's fourth-and-goal stop was massive, but the interior did not consistently close down the run game or prevent Tennessee's late push. The goal-line win did not make this a complete defensive-line performance." }
    - { name: "Edge rushers", assessment: "Solid", trend: "down", season_grade: "B", last_game_grade: "C+", explanation: "Burke's first career sack and Mike Green's rush that helped force the early interception were real positives. Without Hendrickson, however, the rush did not generate enough sustained disruption or finish enough opportunities." }
    - { name: "Linebackers", assessment: "Solid", trend: "up", season_grade: "B", last_game_grade: "B-", explanation: "Simpson's opening-drive interception supplied one of two takeaways, but the unit did not consistently clean up plays in space as Tennessee mounted its late push." }
    - { name: "Secondary", assessment: "Mixed", trend: "up", season_grade: "B-", last_game_grade: "C+", explanation: "Carnell Tate repeatedly found space and the tackling issues resurfaced. Hamilton's forced fumble, recovered by Starks, was a huge turning point, but it does not erase the coverage and finish problems." }
    - { name: "Specialists", assessment: "Strength", trend: "down", season_grade: "B+", last_game_grade: "B+", explanation: "Loop made the stadium-record 64-yarder before halftime, but missed from 40 in the fourth quarter. The spectacular long-range kick and routine miss belong in the same evaluation." }

  weekly_changes:
    - { direction: "up", title: "The defense answered", text: "Two takeaways, a fourth-and-goal stop and 18 points allowed moved both core defensive efficiency measures to 11th." }
    - { direction: "up", title: "Ioane steadied center", text: "The rookie handled his first start at center while Simmons generated no pressures in their nine matchups." }
    - { direction: "up", title: "Loop's range", text: "A 64-yard field goal set the M&T Bank Stadium record, although a later miss from 40 left a finishing opportunity unused." }
    - { direction: "down", title: "Four more injury exits", text: "Jackson, Humphrey, Smythe and Vorhees all left the Titans game. Week 5 practice reports will determine the replacement plan." }

  championship_check:
    - { category: "Quarterback play", status: "Ready", explanation: "Jackson remains fourth in qualified Total QBR. The concern is his ankle, not the quality of his first-half play against Tennessee." }
    - { category: "Pass protection", status: "Trending Right", explanation: "Ioane passed a difficult first test at center, but Vorhees' foot adds another continuity question with three centers already on IR." }
    - { category: "Explosive offense", status: "Ready", explanation: "The Ravens remain second in explosive-play rate, with Flowers' 52-yard reception the latest example." }
    - { category: "Four-man pass rush", status: "Unclear", explanation: "Only one sack against Tennessee keeps finishing pressure on the agenda, particularly while Hendrickson recovers." }
    - { category: "Health", status: "Concern", explanation: "Jackson, Hendrickson, Humphrey and Jurgens missed Thursday practice; Flowers, Simpson and Vorhees were limited. Smythe is on IR for the season. Final Week 5 game designations are pending." }

