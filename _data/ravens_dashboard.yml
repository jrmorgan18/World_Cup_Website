# Baltimore Ravens Season Dashboard
# Objective stats are generated by scripts/update_ravens_dashboard.py into
# ravens_dashboard_stats.json. This file holds definitions, dated team reports,
# and editorial assessments that still require human judgment.

meta:
  season: 2026
  season_label: "2026 Season"
  last_updated: "2026-09-12"
  update_context: "Week 1 at Indianapolis"
  data_status: "preseason"
  data_notice: >-
    The 2026 regular season has not started. Preseason results are shown in a
    separate, clearly labeled sample; current-year league ranks and advanced
    metrics remain unavailable rather than being treated as zero. Week 1
    availability reflects the final Friday reports for Baltimore and Indianapolis.
    The scorecard includes 2025 final values only as a labeled comparison baseline.

metric_definitions:
  - id: "overall_efficiency"
    group: "Team"
    display_name: "Dual Eights efficiency index"
    short_label: "Efficiency index"
    unit: "index"
    description: "A 0–100 league-percentile composite weighting offensive EPA/play, offensive success rate, defensive EPA allowed/play and opponent success rate equally. It is not opponent-adjusted."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 1.0
    default_source: "Dual Eights index from nflverse play-by-play"
  - id: "point_differential"
    group: "Team"
    display_name: "Point differential"
    short_label: "Point diff."
    unit: "points"
    description: "Regular-season points scored minus points allowed."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse schedules"
  - id: "turnover_differential"
    group: "Team"
    display_name: "Turnover differential"
    short_label: "Turnover diff."
    unit: "turnovers"
    description: "Takeaways minus giveaways on non-deleted regular-season plays."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse play-by-play"
  - id: "offensive_epa_per_play"
    group: "Offense"
    display_name: "Offensive EPA per play"
    short_label: "EPA / play"
    unit: "EPA per play"
    description: "Average expected points added on eligible offensive runs and passes."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "offensive_success_rate"
    group: "Offense"
    display_name: "Offensive success rate"
    short_label: "Success rate"
    unit: "percent"
    description: "Share of eligible offensive plays with positive expected points added."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate"
    group: "Offense"
    display_name: "Explosive-play rate"
    short_label: "Explosive rate"
    unit: "percent"
    description: "Share of eligible plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "red_zone_td_rate"
    group: "Offense"
    display_name: "Red-zone touchdown rate"
    short_label: "Red-zone TD rate"
    unit: "percent"
    description: "Share of offensive drives reaching the opponent 20-yard line that produce a touchdown."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"
  - id: "defensive_epa_per_play"
    group: "Defense"
    display_name: "Defensive EPA allowed per play"
    short_label: "EPA allowed / play"
    unit: "EPA per play"
    description: "Average expected points added by opponents on eligible runs and passes."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "defensive_success_rate"
    group: "Defense"
    display_name: "Opponent success rate"
    short_label: "Success allowed"
    unit: "percent"
    description: "Share of eligible opponent plays with positive expected points added."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate_allowed"
    group: "Defense"
    display_name: "Explosive-play rate allowed"
    short_label: "Explosives allowed"
    unit: "percent"
    description: "Share of opponent plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "opponent_red_zone_td_rate"
    group: "Defense"
    display_name: "Opponent red-zone touchdown rate"
    short_label: "Opponent RZ TD rate"
    unit: "percent"
    description: "Share of opponent drives reaching the Ravens' 20-yard line that produce a touchdown."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"

scorecard_groups:
  - name: "Team"
    metric_ids: ["overall_efficiency", "point_differential", "turnover_differential"]
  - name: "Offense"
    metric_ids: ["offensive_epa_per_play", "offensive_success_rate", "explosive_play_rate", "red_zone_td_rate"]
  - name: "Defense"
    metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed", "opponent_red_zone_td_rate"]

editorial:
  state:
    summary: >-
      Baltimore opens Jesse Minter's tenure Sunday in Indianapolis with a healthy
      Lamar Jackson and Zay Flowers available for Declan Doyle's debut as play caller.
      The biggest immediate stress point is the middle of the line: Jovaughn Gwyn and
      rookie Vega Ioane will make their first NFL starts against DeForest Buckner and
      Grover Stewart. On defense, Nnamdi Madubuike and Teddye Buchanan are out, shifting
      more responsibility to Broderick Washington Jr., Trenton Simpson and the depth
      behind them against Jonathan Taylor and Daniel Jones' play-action game.
    biggest_strength: "The Jackson–Henry core and a deep defense give the Ravens answers in multiple game scripts."
    biggest_concern: "Three new interior offensive-line starters face an immediate test from DeForest Buckner and Grover Stewart."
    changed_this_week: "Gwyn won the center job; Flowers was cleared; Madubuike and Buchanan were ruled out; Walker is questionable."

  metric_assessments:
    overall_efficiency: { status: null, interpretation: "The 2026 index begins after Week 1. The 2025 baseline combines four transparent, equally weighted efficiency percentiles." }
    point_differential: { status: null, interpretation: "Regular-season scoring margin begins after Week 1; the preseason +65 is displayed separately." }
    turnover_differential: { status: null, interpretation: "Regular-season takeaway and giveaway context begins after Week 1." }
    offensive_epa_per_play: { status: null, interpretation: "No 2026 regular-season offensive plays yet; the labeled 2025 value provides scale only." }
    offensive_success_rate: { status: null, interpretation: "No 2026 regular-season offensive plays yet; the labeled 2025 value provides scale only." }
    explosive_play_rate: { status: null, interpretation: "No 2026 regular-season sample yet. Explosives use a fixed 10-yard run / 20-yard pass definition." }
    red_zone_td_rate: { status: null, interpretation: "The drive-level 2026 rate begins once the Ravens have a regular-season red-zone possession." }
    defensive_epa_per_play: { status: null, interpretation: "The preseason defense was strong, but no preseason play is included in the ranked regular-season metric." }
    defensive_success_rate: { status: null, interpretation: "No 2026 regular-season opponent plays yet; the labeled 2025 value provides scale only." }
    explosive_play_rate_allowed: { status: null, interpretation: "The regular-season baseline begins after Week 1 under the same explosive-play definition as the offense." }
    opponent_red_zone_td_rate: { status: null, interpretation: "The drive-level 2026 rate begins once an opponent reaches the Ravens' red zone." }

  overviews:
    offense:
      status: "Good"
      assessment: >-
        Jackson, Henry and a fully cleared Flowers give Doyle the core pieces for his
        debut, but the interior line is the matchup. Gwyn will make his first NFL start
        at center, Ioane will debut at right guard and John Simpson is also new at left
        guard against a Colts front led by Buckner and Stewart.
      trend_summary: "Flowers is cleared; Walker is questionable; Gwyn starts at center."
      metric_ids: ["offensive_epa_per_play", "explosive_play_rate", "red_zone_td_rate"]
      links:
        - { label: "How Declan Doyle could change the offense", url: "/ravens/what-will-declan-doyle-change/" }
    defense:
      status: "Solid"
      assessment: >-
        Madubuike and Buchanan will not play, so the unbeaten preseason's depth signal
        gets an immediate test. Baltimore must handle Taylor's explosive running and
        Jones' play-action efficiency without its top interior rusher, while Alec
        Pierce's return keeps the Colts' vertical threat in the plan.
      trend_summary: "Madubuike and Buchanan are out; Pierce is cleared for Indianapolis."
      metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed"]
      links:
        - { label: "Five questions defining the Ravens' season", url: "/ravens/five-questions-that-will-define-the-season/" }

