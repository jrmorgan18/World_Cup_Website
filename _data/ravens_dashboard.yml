    offensive_epa_per_play: {"status": "Average", "reviewed_value": 0.03, "reviewed_rank": 13, "interpretation": "The offense ranks 13th at 0.03 EPA per play through Week 8. Its eligible-play average against Buffalo was -0.43."}
    offensive_success_rate: {"status": "Good", "reviewed_value": 45.7, "reviewed_rank": 12, "interpretation": "The Ravens succeed on 45.7% of eligible offensive plays, 12th. Success against Buffalo was 34.0%."}
    explosive_play_rate: {"status": "Good", "reviewed_value": 10.6, "reviewed_rank": 7, "interpretation": "The offense creates explosive gains on 10.6% of eligible plays, seventh through Week 8."}
