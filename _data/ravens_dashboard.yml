# Baltimore Ravens Season Dashboard
# Objective stats are generated by scripts/update_ravens_dashboard.py into
# ravens_dashboard_stats.json. This file holds definitions, dated team reports,
# and editorial assessments that still require human judgment.

meta:
  season: 2026
  season_label: "2026 Season"
  last_updated: "2026-09-15"
  update_context: "Through Week 1 · New Orleans next"
  data_status: "through-week-1"
  data_notice: >-
    Week 1 is a one-game sample, so league ranks and rate statistics are directional
    rather than predictive. The scorecard uses 2026 regular-season play-by-play and
    keeps the 2025 final values as a labeled comparison baseline. The next-opponent
    card will add availability once official Week 2 reports are published.

metric_definitions:
  - id: "overall_efficiency"
    group: "Team"
    display_name: "Dual Eights efficiency index"
    short_label: "Efficiency index"
    unit: "index"
    description: "A 0–100 league-percentile composite weighting offensive EPA/play, offensive success rate, defensive EPA allowed/play and opponent success rate equally. It is not opponent-adjusted."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 1.0
    default_source: "Dual Eights index from nflverse play-by-play"
  - id: "point_differential"
    group: "Team"
    display_name: "Point differential"
    short_label: "Point diff."
    unit: "points"
    description: "Regular-season points scored minus points allowed."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse schedules"
  - id: "turnover_differential"
    group: "Team"
    display_name: "Turnover differential"
    short_label: "Turnover diff."
    unit: "turnovers"
    description: "Takeaways minus giveaways on non-deleted regular-season plays."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse play-by-play"
  - id: "offensive_epa_per_play"
    group: "Offense"
    display_name: "Offensive EPA per play"
    short_label: "EPA / play"
    unit: "EPA per play"
    description: "Average expected points added on eligible offensive runs and passes."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "offensive_success_rate"
    group: "Offense"
    display_name: "Offensive success rate"
    short_label: "Success rate"
    unit: "percent"
    description: "Share of eligible offensive plays with positive expected points added."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate"
    group: "Offense"
    display_name: "Explosive-play rate"
    short_label: "Explosive rate"
    unit: "percent"
    description: "Share of eligible plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "red_zone_td_rate"
    group: "Offense"
    display_name: "Red-zone touchdown rate"
    short_label: "Red-zone TD rate"
    unit: "percent"
    description: "Share of offensive drives reaching the opponent 20-yard line that produce a touchdown."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"
  - id: "defensive_epa_per_play"
    group: "Defense"
    display_name: "Defensive EPA allowed per play"
    short_label: "EPA allowed / play"
    unit: "EPA per play"
    description: "Average expected points added by opponents on eligible runs and passes."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "defensive_success_rate"
    group: "Defense"
    display_name: "Opponent success rate"
    short_label: "Success allowed"
    unit: "percent"
    description: "Share of eligible opponent plays with positive expected points added."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate_allowed"
    group: "Defense"
    display_name: "Explosive-play rate allowed"
    short_label: "Explosives allowed"
    unit: "percent"
    description: "Share of opponent plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "opponent_red_zone_td_rate"
    group: "Defense"
    display_name: "Opponent red-zone touchdown rate"
    short_label: "Opponent RZ TD rate"
    unit: "percent"
    description: "Share of opponent drives reaching the Ravens' 20-yard line that produce a touchdown."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"

scorecard_groups:
  - name: "Team"
    metric_ids: ["overall_efficiency", "point_differential", "turnover_differential"]
  - name: "Offense"
    metric_ids: ["offensive_epa_per_play", "offensive_success_rate", "explosive_play_rate", "red_zone_td_rate"]
  - name: "Defense"
    metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed", "opponent_red_zone_td_rate"]

editorial:
  state:
    summary: >-
      Jesse Minter's first regular-season game delivered the kind of complete offensive
      ceiling Baltimore envisioned: a 41-23 road win, 506 official net yards and four
      touchdowns on the first five drives. Lamar Jackson threw for 324 yards and added
      40 rushing yards, Derrick Henry ran for 144 yards and three touchdowns, and the
      defense forced two takeaways after Indianapolis scored on its opening drive.
      The Week 2 problem is receiver health: Zay Flowers left with a hamstring injury
      and Ja'Kobi Lane left with a wrist injury, while their official availability for
      the home opener against New Orleans is not yet known.
    biggest_strength: "Doyle's offense produced 10 explosive plays, 0.32 EPA per play and 506 official net yards in its regular-season debut."
    biggest_concern: "The offense lost Flowers and Lane during the win, and the defense allowed an explosive-play rate that ranks 23rd in the early league sample."
    changed_this_week: "Baltimore opened 1-0 with a 41-23 win; the offense hit its explosive ceiling, the defense forced two takeaways, and receiver availability became the immediate question."

  metric_assessments:
    overall_efficiency: { status: "Elite", interpretation: "The equal-weight composite ranks first after one game. It captures Baltimore's top-five offense and defense in the early rate sample, but one opponent is not a stable team identity." }
    point_differential: { status: "Elite", interpretation: "The +18 margin ranks fourth after Week 1 and reflects a 41-23 road win. It is a clean starting signal, not a forecast." }
    turnover_differential: { status: "Good", interpretation: "Baltimore finished plus-one after two defensive takeaways and one Lamar Jackson fumble. The defense created two of the game's defining swings." }
    offensive_epa_per_play: { status: "Elite", interpretation: "Baltimore's 0.32 EPA per play ranks third after Doyle's debut. The sample is one game, but it includes four touchdowns on the first five drives." }
    offensive_success_rate: { status: "Good", interpretation: "A 50.0% success rate ranks fifth. It pairs an efficient down-to-down result with the explosive plays that broke Indianapolis open." }
    explosive_play_rate: { status: "Elite", interpretation: "The 15.0% rate ranks third under the dashboard's 10-yard run and 20-yard pass definition. Baltimore also recorded 10 explosives by the club's game-specific definition." }
    red_zone_td_rate: { status: "Good", interpretation: "Baltimore converted 75.0% of qualifying red-zone drives into touchdowns. The small sample is encouraging after the 2025 red-zone finish ranked 26th." }
    defensive_epa_per_play: { status: "Good", interpretation: "The defense allowed minus-0.24 EPA per play, fifth in the early league table, after settling down sharply beyond Indianapolis' opening drive." }
    defensive_success_rate: { status: "Good", interpretation: "Opponents posted a 41.5% success rate, ninth after Week 1. That is a useful early result, with the explosive-play issue keeping the judgment short of elite." }
    explosive_play_rate_allowed: { status: "Concern", interpretation: "The 13.2% allowed rate ranks 23rd. The Colts had several chunk gains, so this is the clearest metric that needs a Week 2 response." }
    opponent_red_zone_td_rate: { status: "Problem", interpretation: "Indianapolis scored touchdowns on each qualifying red-zone drive, producing a 100.0% rate. One game makes this volatile, but it is the weakest current scoreboard number." }

