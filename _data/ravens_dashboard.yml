# Baltimore Ravens Season Dashboard
# Objective stats are generated by scripts/update_ravens_dashboard.py into
# ravens_dashboard_stats.json. This file holds definitions, dated team reports,
# and editorial assessments that still require human judgment.

meta:
  season: 2026
  season_label: "2026 Season"
  last_updated: "2026-10-20"
  update_context: "Through complete Week 6 games · Cincinnati next"
  data_status: "through-week-6"
  data_notice: >-
    Six games are still an early sample, so league ranks and rate statistics are
    directional rather than predictive. The scorecard uses 2026 regular-season
    play-by-play and keeps the 2025 final values as a labeled comparison baseline.
    All Week 6 games are included; subsequent statistical corrections may revise
    ranks and rates. ESPN trench rates and Filmstudy scoring carry their own reporting weeks.

metric_definitions:
  - id: "overall_efficiency"
    group: "Team"
    display_name: "Dual Eights efficiency index"
    short_label: "Efficiency index"
    unit: "index"
    description: "The v2.1 observed-efficiency index: opponent/venue-adjusted offense and defense each carry 45%, and context-adjusted special teams carry 10%. A fixed prior-season calibration preserves performance magnitudes. Its 0–100 display scale is neither a percentile nor a win probability."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 1.0
    default_source: "Dual Eights v2.1 from nflverse play-by-play"
  - id: "point_differential"
    group: "Team"
    display_name: "Point differential"
    short_label: "Point diff."
    unit: "points"
    description: "Regular-season points scored minus points allowed."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse schedules"
  - id: "turnover_differential"
    group: "Team"
    display_name: "Turnover differential"
    short_label: "Turnover diff."
    unit: "turnovers"
    description: "Takeaways minus giveaways on non-deleted regular-season plays."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse play-by-play"
  - id: "offensive_epa_per_play"
    group: "Offense"
    display_name: "Offensive EPA per play"
    short_label: "EPA / play"
    unit: "EPA per play"
    description: "Average expected points added on eligible offensive runs and passes."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "offensive_success_rate"
    group: "Offense"
    display_name: "Offensive success rate"
    short_label: "Success rate"
    unit: "percent"
    description: "Share of eligible offensive plays with positive expected points added."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate"
    group: "Offense"
    display_name: "Explosive-play rate"
    short_label: "Explosive rate"
    unit: "percent"
    description: "Share of eligible plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "red_zone_td_rate"
    group: "Offense"
    display_name: "Red-zone touchdown rate"
    short_label: "Red-zone TD rate"
    unit: "percent"
    description: "Share of offensive drives reaching the opponent 20-yard line that produce a touchdown."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"
  - id: "defensive_epa_per_play"
    group: "Defense"
    display_name: "Defensive EPA allowed per play"
    short_label: "EPA allowed / play"
    unit: "EPA per play"
    description: "Average expected points added by opponents on eligible runs and passes."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "defensive_success_rate"
    group: "Defense"
    display_name: "Opponent success rate"
    short_label: "Success allowed"
    unit: "percent"
    description: "Share of eligible opponent plays with positive expected points added."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate_allowed"
    group: "Defense"
    display_name: "Explosive-play rate allowed"
    short_label: "Explosives allowed"
    unit: "percent"
    description: "Share of opponent plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "opponent_red_zone_td_rate"
    group: "Defense"
    display_name: "Opponent red-zone touchdown rate"
    short_label: "Opponent RZ TD rate"
    unit: "percent"
    description: "Share of opponent drives reaching the Ravens' 20-yard line that produce a touchdown."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"

scorecard_groups:
  - name: "Team"
    metric_ids: ["overall_efficiency", "point_differential", "turnover_differential"]
  - name: "Offense"
    metric_ids: ["offensive_epa_per_play", "offensive_success_rate", "explosive_play_rate", "red_zone_td_rate"]
  - name: "Defense"
    metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed", "opponent_red_zone_td_rate"]

editorial:
  state:
    summary: >-
      The Ravens are 4-2 after a 13-10 loss in Cleveland left them tied with the
      Browns and Steelers in the AFC North. Ten points on the opening two drives
      were followed by nine scoreless possessions. The defense recorded five sacks
      and allowed 237 yards, but late third-down breakdowns proved costly. Cincinnati
      comes next. Jackson remains day-to-day, Jurgens has a chance to debut, and
      Bateman's shoulder and the offensive-line depth remain availability watches.
    biggest_strength: "A five-sack game lifted the pass rush, while season explosive-play rate remains third and offensive success rate fifth."
    biggest_concern: "The offense stalled without Jackson, and his Week 7 availability remains unresolved. Ball security and late third-down defense also cost the Ravens in Cleveland."
    changed_this_week: "The Ravens fell to 4-2. Hendrickson returned, Lane came off IR, and Cuevas scored his first touchdown; Cleveland's late rally ended the three-game winning streak."

  metric_assessments:
    overall_efficiency: { status: "Good", interpretation: "The Ravens are 11th at 56.3 in the published v2.1 index through the complete Week 6 slate, down from fifth at 62.5 through Week 5. The model combines opponent-adjusted offense, defense and special teams; it measures observed efficiency rather than predicting the next game." }
    point_differential: { status: "Good", interpretation: "The three-point loss reduces the season margin to +24, eighth in the league." }
    turnover_differential: { status: "Average", interpretation: "The Ravens are +2, 13th. Henry's fourth-quarter fumble was the only turnover in Cleveland." }
    offensive_epa_per_play: { status: "Good", interpretation: "The offense is seventh at 0.12 EPA/play through six games. Cleveland held the Ravens to -0.07 per eligible play." }
    offensive_success_rate: { status: "Good", interpretation: "The season success rate is 48.0%, fifth. Only 33.9% of eligible Ravens plays succeeded in Cleveland." }
    explosive_play_rate: { status: "Elite", interpretation: "The Ravens remain third in explosive-play rate at 12.8%, despite the offense's stalled possessions in Week 6." }
    red_zone_td_rate: { status: "Good", interpretation: "The Ravens have scored touchdowns on 71.4% of qualifying red-zone drives, seventh. Cuevas supplied the only touchdown in Cleveland." }
    defensive_epa_per_play: { status: "Good", interpretation: "Season EPA allowed improves to -0.04, 10th. The Browns finished at -0.12 per eligible play despite winning the game." }
    defensive_success_rate: { status: "Good", interpretation: "Opponent success is 41.3%, seventh. Cleveland succeeded on 43.3% of eligible plays, with late third-down conversions making the difference." }
    explosive_play_rate_allowed: { status: "Good", interpretation: "The season rate improves to 8.2%, 10th. Jeudy's late 33-yard catch nevertheless set up the winning field goal." }
    opponent_red_zone_td_rate: { status: "Average", interpretation: "Opponents have converted 57.9% of qualifying red-zone drives into touchdowns, 14th. Cleveland's short-field touchdown followed Henry's fumble." }

  overviews:
    offense:
      status: "Good"
      assessment: >-
        The Ravens rank fifth in success rate, third in explosive-play rate and seventh
        in EPA per play through six games. Cleveland limited them to 235 yards and
        no points after the first two drives. Lane and Cuevas offered receiving
        encouragement, but the offense needs more sustained production.
      trend_summary: "The Cleveland shutdown lowers season efficiency; Jackson's ankle and the protection plan frame Cincinnati week."
      metric_ids: ["offensive_epa_per_play", "explosive_play_rate", "red_zone_td_rate"]
      links:
        - { label: "How Declan Doyle could change the offense", url: "/ravens/what-will-declan-doyle-change/" }
    defense:
      status: "Good"
      assessment: >-
        Five sacks and 237 yards allowed gave the Ravens a strong overall defensive
        outing in Cleveland. Season EPA allowed is 10th and opponent success seventh.
        The Browns' late third-down conversions still exposed the situational gap
        between winning individual snaps and closing a game.
      trend_summary: "Hendrickson's return lifts the rush; late third-down coverage remains the clearest correction."
      metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed"]
      links:
        - { label: "Five questions defining the Ravens' season", url: "/ravens/five-questions-that-will-define-the-season/" }

  units:
    - { name: "Quarterback", assessment: "Elite", trend: "down", season_grade: "A-", season_grade_points: 3.734, last_game_grade: "B-", explanation: "Week 5: Huntley completed 24 of 32 passes for 201 yards, two touchdowns and no interceptions, then scored the overtime winner. Jackson's season QBR and CPOE are separate analytics, not grades for Huntley's performance.", link: "/ravens/first-and-five-falcons-week-five-2026/" }
    - { name: "Running backs", assessment: "Solid", trend: "up", season_grade: "B+", season_grade_points: 3.464, last_game_grade: "A", explanation: "Week 5: Henry ran for 102 yards and added a receiving touchdown; Hill contributed 73 rushing yards. Their production led a 208-yard team rushing night." }
    - { name: "Wide receivers", assessment: "Strength", trend: "stable", season_grade: "A-", season_grade_points: 3.736, last_game_grade: "A", explanation: "Week 5: Flowers returned to action, Bateman supplied key completions and Walker caught the late touchdown. Flowers' season yards per route run and YAC over expectation provide additional receiving context." }
    - { name: "Tight ends", assessment: "Solid", trend: "down", season_grade: "B-", season_grade_points: 2.6, last_game_grade: "D", explanation: "Week 5: Andrews' lost fumble was returned for a touchdown, though he helped on the overtime drive. Vannett joined the blocking rotation with Smythe on IR." }
    - { name: "Offensive line", assessment: "Mixed", trend: "up", season_grade: "C+", season_grade_points: 2.464, last_game_grade: "B", explanation: "Week 5 grade: Ioane's second start at center and Jones replacing Vorhees helped produce 208 rushing yards. The separate analytics now use ESPN's Week 6 rates and Filmstudy's published reports through Week 5.", link: "/ravens/first-and-five-falcons-week-five-2026/" }
    - { name: "Defensive line", assessment: "Strength", trend: "up", season_grade: "B+", season_grade_points: 3.464, last_game_grade: "A", explanation: "Week 5 grade: Campbell anchored the front and Madubuike's workload rose to 53 snaps. The separate ESPN run-stop and player rush metrics now include Week 6." }
    - { name: "Edge rushers", assessment: "Solid", trend: "up", season_grade: "B", season_grade_points: 3.066, last_game_grade: "B+", explanation: "Week 5 grade: Green's sack and Robinson's late strip-sack helped the Atlanta win. Hendrickson returned in Week 6; the separate ESPN rush metrics include that game." }
    - { name: "Linebackers", assessment: "Solid", trend: "up", season_grade: "B", season_grade_points: 3.0, last_game_grade: "B", explanation: "Week 5: Atlanta converted 9 of 17 third downs, keeping underneath coverage and situational execution on the correction list. No defensible free league-wide linebacker metric is added." }
    - { name: "Secondary", assessment: "Mixed", trend: "up", season_grade: "B-", season_grade_points: 2.736, last_game_grade: "B", explanation: "Week 5: London had a big day, but Hamilton's interception sealed the game and Starks had a big game, leading the team with 10 tackles. Humphrey played all 64 defensive snaps. Opponent CPOE is a separate season metric." }
    - { name: "Specialists", assessment: "Strength", trend: "up", season_grade: "B+", season_grade_points: 3.398, last_game_grade: "A-", explanation: "Week 5: The kicking was good, but the punting was mediocre. Loop made all three field-goal attempts, including two from 51 yards, plus the overtime extra point." }

  weekly_changes:
    - { direction: "down", title: "The offense went quiet", text: "The first two drives produced 10 points; the final nine produced none. The Ravens finished with 235 yards and a 33.9% success rate." }
    - { direction: "up", title: "The rush returned", text: "Hendrickson's return helped produce five sacks. The Ravens held Cleveland to 237 yards, while ESPN's season team pass rush win rate rose to 53%, 10th." }
    - { direction: "up", title: "Two rookies supplied answers", text: "Lane returned with four catches for 40 yards. Cuevas added four for 44 and his first NFL touchdown." }
    - { direction: "down", title: "Late mistakes decided it", text: "Henry's fumble, Loop's missed 49-yarder and late defensive third-down breakdowns erased the 10-point lead." }
    - { direction: "stable", title: "Cincinnati week begins", text: "Jackson remains day-to-day and Jurgens has a chance to debut. The new week's practice reports will clarify unresolved availability; old Cleveland Out designations are not carried forward." }

  championship_check:
    - { category: "Quarterback play", status: "Unclear", explanation: "Jackson's 81.9 Total QBR ranks second, but his ankle leaves availability unresolved. Huntley's Cleveland start produced one touchdown and no interceptions, with little sustained offense after the opening drives." }
    - { category: "Pass protection", status: "Unclear", explanation: "Team pass block win rate is 47%, 20th through Week 6. Jurgens could return, while Vorhees missed a second game and Stanley has a new availability watch." }
    - { category: "Explosive offense", status: "Ready", explanation: "The Ravens remain third in season explosive-play rate at 12.8%, but Cleveland showed how fragile the offense becomes when the run game stalls." }
    - { category: "Four-man pass rush", status: "Trending Right", explanation: "Hendrickson returned with eight pressures and a sack. ESPN's team pass rush win rate is 53%, 10th; total sacks include schemed pressure and are not a four-man-only measure." }
    - { category: "Health", status: "Concern", explanation: "Lane is active again and Hendrickson played. Jackson, Jurgens, Bateman and the remaining offensive-line and depth injuries need fresh Week 7 reports." }

