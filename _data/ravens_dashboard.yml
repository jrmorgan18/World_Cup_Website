# Baltimore Ravens Season Dashboard
# Objective stats are generated by scripts/update_ravens_dashboard.py into
# ravens_dashboard_stats.json. This file holds definitions, dated team reports,
# and editorial assessments that still require human judgment.

meta:
  season: 2026
  season_label: "2026 Season"
  last_updated: "2026-09-29"
  update_context: "Through Week 3 · Tennessee next"
  data_status: "through-week-3"
  data_notice: >-
    Three games are still an early sample, so league ranks and rate statistics are
    directional rather than predictive. The scorecard uses 2026 regular-season
    play-by-play and keeps the 2025 final values as a labeled comparison baseline.
    The Titans availability card will populate once official Week 4 reports are published.

metric_definitions:
  - id: "overall_efficiency"
    group: "Team"
    display_name: "Dual Eights efficiency index"
    short_label: "Efficiency index"
    unit: "index"
    description: "A 0–100 league-percentile composite weighting offensive EPA/play, offensive success rate, defensive EPA allowed/play and opponent success rate equally. It is not opponent-adjusted."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 1.0
    default_source: "Dual Eights index from nflverse play-by-play"
  - id: "point_differential"
    group: "Team"
    display_name: "Point differential"
    short_label: "Point diff."
    unit: "points"
    description: "Regular-season points scored minus points allowed."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse schedules"
  - id: "turnover_differential"
    group: "Team"
    display_name: "Turnover differential"
    short_label: "Turnover diff."
    unit: "turnovers"
    description: "Takeaways minus giveaways on non-deleted regular-season plays."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "nflverse play-by-play"
  - id: "offensive_epa_per_play"
    group: "Offense"
    display_name: "Offensive EPA per play"
    short_label: "EPA / play"
    unit: "EPA per play"
    description: "Average expected points added on eligible offensive runs and passes."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "offensive_success_rate"
    group: "Offense"
    display_name: "Offensive success rate"
    short_label: "Success rate"
    unit: "percent"
    description: "Share of eligible offensive plays with positive expected points added."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate"
    group: "Offense"
    display_name: "Explosive-play rate"
    short_label: "Explosive rate"
    unit: "percent"
    description: "Share of eligible plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "red_zone_td_rate"
    group: "Offense"
    display_name: "Red-zone touchdown rate"
    short_label: "Red-zone TD rate"
    unit: "percent"
    description: "Share of offensive drives reaching the opponent 20-yard line that produce a touchdown."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"
  - id: "defensive_epa_per_play"
    group: "Defense"
    display_name: "Defensive EPA allowed per play"
    short_label: "EPA allowed / play"
    unit: "EPA per play"
    description: "Average expected points added by opponents on eligible runs and passes."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.01
    default_source: "nflverse play-by-play"
  - id: "defensive_success_rate"
    group: "Defense"
    display_name: "Opponent success rate"
    short_label: "Success allowed"
    unit: "percent"
    description: "Share of eligible opponent plays with positive expected points added."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "nflverse play-by-play"
  - id: "explosive_play_rate_allowed"
    group: "Defense"
    display_name: "Explosive-play rate allowed"
    short_label: "Explosives allowed"
    unit: "percent"
    description: "Share of opponent plays gaining at least 10 yards on a run or 20 yards on a pass."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 0.3
    default_source: "nflverse play-by-play"
  - id: "opponent_red_zone_td_rate"
    group: "Defense"
    display_name: "Opponent red-zone touchdown rate"
    short_label: "Opponent RZ TD rate"
    unit: "percent"
    description: "Share of opponent drives reaching the Ravens' 20-yard line that produce a touchdown."
    direction: "lower"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "nflverse play-by-play"

scorecard_groups:
  - name: "Team"
    metric_ids: ["overall_efficiency", "point_differential", "turnover_differential"]
  - name: "Offense"
    metric_ids: ["offensive_epa_per_play", "offensive_success_rate", "explosive_play_rate", "red_zone_td_rate"]
  - name: "Defense"
    metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed", "opponent_red_zone_td_rate"]

editorial:
  state:
    summary: >-
      The Ravens are 2-1 after their first international win, a 34-31 escape over Dallas
      that showed both sides of this team. Lamar Jackson, Zay Flowers and Tyler Loop made
      the final sequence when it mattered, and the offense remains a top-three unit by EPA
      per play, success rate and explosive-play rate. The defense, however, surrendered
      415 yards, missed too many tackles and allowed another fourth-quarter surge. The
      immediate Week 4 question is health along an already stressed offensive line after
      Jovaughn Gwyn and Ethan Pocic both left the Cowboys game.
    biggest_strength: "The Ravens rank top-three in EPA per play, success rate and explosive-play rate; Lamar, Henry and Flowers give Doyle answers at every level."
    biggest_concern: "The defense is 19th in EPA allowed per play, while center depth is suddenly a material Week 4 risk."
    changed_this_week: "Loop's 56-yard winner completed a 34-31 Week 3 win, Flowers returned with 104 yards from scrimmage, Madubuike debuted, and the line lost two more centers to in-game injuries."

  metric_assessments:
    overall_efficiency: { status: "Elite", interpretation: "The equal-weight composite is No. 5 through three games, driven by an elite offense. That is a meaningful start, though the defensive half of the model remains only middle of the league." }
    point_differential: { status: "Good", interpretation: "The +14 margin ranks 10th. Two wins by 18 and three points outweigh the seven-point Saints loss, but it is not yet the profile of a team controlling games every week." }
    turnover_differential: { status: "Good", interpretation: "Baltimore is plus-one, 11th in the league. Travis Jones' forced fumble against Dallas supplied a defining Week 3 swing without the offense giving the ball away." }
    offensive_epa_per_play: { status: "Elite", interpretation: "Baltimore's 0.19 EPA per play ranks third. The Cowboys result was not the opener's 506-yard burst, but Jackson, Flowers and the run game still found enough high-value plays to win." }
    offensive_success_rate: { status: "Elite", interpretation: "A 54.3% success rate ranks second. The offense is staying on schedule at an elite rate even when short-yardage execution has created avoidable high-leverage failures." }
    explosive_play_rate: { status: "Elite", interpretation: "The 14.5% rate ranks second under the dashboard's 10-yard run and 20-yard pass definition. Flowers' return restored a major source of stress for defenses." }
    red_zone_td_rate: { status: "Good", interpretation: "Baltimore's 66.7% red-zone touchdown rate ranks ninth. Four touchdowns on six Week 3 red-zone trips were useful, but the failure at the Dallas 1 remains the most important qualifier." }
    defensive_epa_per_play: { status: "Average", interpretation: "The defense is 19th at 0.02 EPA allowed per play. It produced sacks, a fumble and a goal-line stop in Rio, but too many short completions and missed tackles kept the Cowboys alive." }
    defensive_success_rate: { status: "Average", interpretation: "Opponents have a 44.6% success rate, 17th. The Ravens have not consistently finished the plays their coverage is designed to concede underneath." }
    explosive_play_rate_allowed: { status: "Average", interpretation: "A 9.7% allowed rate ranks 19th. The defense has reduced the opener's chunk-play problem, but it has not yet turned that into down-to-down control." }
    opponent_red_zone_td_rate: { status: "Average", interpretation: "Opponents have scored touchdowns on 63.6% of qualifying red-zone drives, 17th. The goal-line stop against Dallas mattered, but the overall rate remains a middle-of-the-league concern." }

  overviews:
    offense:
      status: "Elite"
      assessment: >-
        The Ravens are top-three in EPA per play, success rate and explosive-play rate
        through three games. Jackson's mobility, Flowers' return and another 192-yard
        rushing day made the Week 3 ceiling obvious. The next correction is short yardage,
        where a strong overall ground game repeatedly failed to find one yard.
      trend_summary: "Top-three in EPA/play, success rate and explosive rate; short-yardage answers and line health are the Week 4 tests."
      metric_ids: ["offensive_epa_per_play", "explosive_play_rate", "red_zone_td_rate"]
      links:
        - { label: "How Declan Doyle could change the offense", url: "/ravens/what-will-declan-doyle-change/" }
    defense:
      status: "Concern"
      assessment: >-
        The defense created real Week 3 moments: Travis Jones forced a fumble, Roquan Smith
        had a sack and the goal-line stop gave the offense a chance to win. But 415 Cowboys
        yards, repeated missed tackles and another late scoring run leave every core defensive
        rate between 17th and 19th. The issue is execution, not a lack of isolated splash plays.
      trend_summary: "No. 19 in EPA allowed/play and No. 17 in success rate allowed; tackling and late-down execution have to improve."
      metric_ids: ["defensive_epa_per_play", "defensive_success_rate", "explosive_play_rate_allowed"]
      links:
        - { label: "Five questions defining the Ravens' season", url: "/ravens/five-questions-that-will-define-the-season/" }

  units:
    - { name: "Quarterback", assessment: "Elite", trend: "up", season_grade: "A", last_game_grade: "A", explanation: "Jackson went 15-for-20 for 186 yards and two touchdowns, added 50 rushing yards, then delivered the 27-yard final throw that put Loop in range. His Week 3 QBR is 82.2, fourth among qualified quarterbacks." }
    - { name: "Running backs", assessment: "Strength", trend: "stable", season_grade: "A-", last_game_grade: "B+", explanation: "Henry ran 26 times for 89 yards and two touchdowns as part of a 192-yard rushing day. The production was real, but the repeated short-yardage failures keep the game grade below an A." }
    - { name: "Wide receivers", assessment: "Strength", trend: "up", season_grade: "A-", last_game_grade: "A", explanation: "Flowers returned from his hamstring injury with five catches for 84 yards, a 20-yard jet sweep and the 27-yard catch that set up the winner. His movement and speed restored a different offensive ceiling." }
    - { name: "Tight ends", assessment: "Solid", trend: "stable", season_grade: "B", last_game_grade: "B", explanation: "Matt Hibner's go-ahead touchdown and Josh Cuevas' contribution helped bridge a brief Mark Andrews hand-injury absence. The group found the decisive play but remains a secondary option in the passing game." }
    - { name: "Offensive line", assessment: "Concern", trend: "down", season_grade: "C+", last_game_grade: "C", explanation: "Ronnie Stanley was out, then Jovaughn Gwyn and Ethan Pocic left in-game, forcing Vega Ioane to finish at center. The group also could not repeatedly create the one yard it needed." }
    - { name: "Defensive line", assessment: "Solid", trend: "up", season_grade: "B+", last_game_grade: "B+", explanation: "Madubuike made his season debut, Travis Jones forced a pivotal fumble and Calais Campbell recorded three quarterback hits. The interior made enough impact plays despite the defense's broader problems." }
    - { name: "Edge rushers", assessment: "Solid", trend: "stable", season_grade: "B", last_game_grade: "B", explanation: "The front recorded seven quarterback hits, but the rush did not consistently prevent Dak Prescott from turning short throws into productive drives. Pressure has to connect more cleanly with coverage." }
    - { name: "Linebackers", assessment: "Mixed", trend: "stable", season_grade: "B-", last_game_grade: "B-", explanation: "Roquan Smith recorded a sack, while Trenton Simpson recovered Jones' forced fumble and posted two tackles for loss. The positive plays were offset by the tackling and pursuit errors that extended Dallas drives." }
    - { name: "Secondary", assessment: "Concern", trend: "stable", season_grade: "C+", last_game_grade: "C-", explanation: "The unit made the game-ending goal-line stop, but Dallas finished with 267 net passing yards and the defense repeatedly surrendered extra yards after short throws. The Week 4 priority remains tackling and finishing coverage reps." }
    - { name: "Specialists", assessment: "Strength", trend: "up", season_grade: "B+", last_game_grade: "A", explanation: "Loop made the 56-yard game winner, Keondre Jackson blocked a 59-yard Brandon Aubrey attempt, and Baltimore won the kickoff exchange. This was the answer after Week 2's special-teams failures." }

  weekly_changes:
    - { direction: "up", title: "The final seven seconds", text: "Jackson found Flowers for 27 yards, stopped the clock with one second left and gave Loop the 56-yard winner." }
    - { direction: "up", title: "Flowers returned", text: "Flowers had 104 yards from scrimmage and supplied the explosive first option the offense missed against New Orleans." }
    - { direction: "up", title: "Special teams flipped", text: "Keondre Jackson's field-goal block and Loop's winner turned the facet that hurt Baltimore in Week 2 into a reason it won Week 3." }
    - { direction: "down", title: "Defense and center depth", text: "The defense allowed 415 yards and missed tackles, while Gwyn and Pocic both left an already thin interior line." }

