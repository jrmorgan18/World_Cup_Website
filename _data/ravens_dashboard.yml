editorial:
  state:
    summary: The Ravens are 4-6 after a 23-20 loss to the Chargers, their fifth straight defeat. Jacoby Brissett threw
      for 340 yards in his debut, but the Ravens ran for just 16. They visit Carolina on Sunday without Nnamdi Madubuike,
      Jaylinn Hawkins or Marlon Humphrey. Vega Ioane and John Simpson are cleared.
    biggest_strength: Zay Flowers ranks ninth among qualifying receivers at 2.66 yards per route run. Mike Green leads
      the Ravens with 5.5 sacks.
    biggest_concern: The Ravens managed just 16 rushing yards on 15 carries against Los Angeles. Carolina has allowed
      65.5 rushing yards per game in two games under Todd Wash.
    changed_this_week: Madubuike and Hawkins are out. Humphrey is deactivated for one game. Ioane and Simpson have no
      game designations.
