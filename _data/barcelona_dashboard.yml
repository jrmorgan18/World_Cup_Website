# FC Barcelona Season Dashboard
# Objective stats are generated by scripts/update_barcelona_dashboard.py into
# barcelona_dashboard_stats.json. This file holds metric definitions, squad
# context and the editorial judgments that still require human review.
#
# La Liga and Champions League numbers are kept in separate samples throughout.

meta:
  season: 2026
  season_label: "2026-27 Season"
  last_updated: "2026-10-17"
  reviewed_event_id: "401882846"
  update_context: "Through La Liga Matchday 9 · Champions League Matchday 2"
  data_status: "through-laliga-matchday-9"
  data_notice: >-
    Ranks reflect completed matches in the current feed; clubs may have played
    different numbers of games. The European sample remains small. Ranks use
    ESPN per-match team statistics within each competition separately: 20 clubs in
    La Liga, 36 in the Champions League league phase. Availability and squad
    assessments are editorial and are kept apart from the calculated metrics.

metric_definitions:
  - id: "blaugrana_index"
    group: "Team"
    display_name: "Dual Eights Blaugrana index"
    short_label: "Blaugrana index"
    unit: "index"
    description: "A 0–100 competition-percentile composite weighting expected goals per match, expected goals conceded per match, goals per match and goals conceded per match equally. It is not opponent-adjusted."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 1.0
    default_source: "Dual Eights index from ESPN match statistics"
  - id: "points_per_match"
    group: "Team"
    display_name: "Points per match"
    short_label: "Points / match"
    unit: "points"
    description: "Competition points divided by matches played in that competition."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.05
    default_source: "ESPN competition results"
  - id: "goal_difference"
    group: "Team"
    display_name: "Goal difference"
    short_label: "Goal diff."
    unit: "goals"
    description: "Goals scored minus goals conceded in the competition."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "ESPN competition results"
  - id: "xg_difference_per_match"
    group: "Team"
    display_name: "Expected goal difference per match"
    short_label: "xGD / match"
    unit: "expected goals"
    description: "Expected goals created minus expected goals conceded, divided by matches played. It measures the balance of chance quality rather than finishing."
    direction: "higher"
    format: "signed_decimal_2"
    stable_delta: 0.1
    default_source: "ESPN match statistics"
  - id: "goals_per_match"
    group: "Attack"
    display_name: "Goals per match"
    short_label: "Goals / match"
    unit: "goals"
    description: "Goals scored divided by matches played."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.1
    default_source: "ESPN match statistics"
  - id: "xg_per_match"
    group: "Attack"
    display_name: "Expected goals per match"
    short_label: "xG / match"
    unit: "expected goals"
    description: "The quality of chances created per match, expressed as the goals an average team would be expected to score from them."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.1
    default_source: "ESPN match statistics"
  - id: "big_chances_per_match"
    group: "Attack"
    display_name: "Big chances created per match"
    short_label: "Big chances / match"
    unit: "chances"
    description: "Opta-defined big chances — situations where a player should reasonably be expected to score — created per match."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 0.3
    default_source: "ESPN match statistics"
  - id: "shot_conversion"
    group: "Attack"
    display_name: "Shot conversion"
    short_label: "Conversion"
    unit: "percent"
    description: "Goals scored as a share of total shots taken."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "ESPN match statistics"
  - id: "goals_conceded_per_match"
    group: "Defense"
    display_name: "Goals conceded per match"
    short_label: "Conceded / match"
    unit: "goals"
    description: "Goals conceded divided by matches played."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.1
    default_source: "ESPN match statistics"
  - id: "xga_per_match"
    group: "Defense"
    display_name: "Expected goals conceded per match"
    short_label: "xGA / match"
    unit: "expected goals"
    description: "The quality of chances opponents create per match. It is the clearest early read on whether a high defensive line is holding."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.1
    default_source: "ESPN match statistics"
  - id: "clean_sheet_rate"
    group: "Defense"
    display_name: "Clean-sheet rate"
    short_label: "Clean sheets"
    unit: "percent"
    description: "Share of matches in the competition finished without conceding."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 5.0
    default_source: "ESPN match statistics"
  - id: "box_shots_conceded_per_match"
    group: "Defense"
    display_name: "Box shots conceded per match"
    short_label: "Box shots allowed"
    unit: "shots"
    description: "Shots opponents take from inside the penalty area per match, the highest-value chances a defense gives up."
    direction: "lower"
    format: "decimal_1"
    stable_delta: 0.5
    default_source: "ESPN match statistics"
  - id: "possession_pct"
    group: "Control"
    display_name: "Possession"
    short_label: "Possession"
    unit: "percent"
    description: "Average share of the ball across matches in the competition."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "ESPN match statistics"
  - id: "pass_accuracy"
    group: "Control"
    display_name: "Pass accuracy"
    short_label: "Pass accuracy"
    unit: "percent"
    description: "Accurate passes as a share of all passes attempted."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "ESPN match statistics"
  - id: "ppda"
    group: "Control"
    display_name: "Passes per defensive action"
    short_label: "PPDA"
    unit: "passes"
    description: "How many passes an opponent completes before Barcelona makes a defensive action. It is the standard pressing-intensity measure, averaged across matches."
    direction: "lower"
    format: "decimal_1"
    stable_delta: 0.5
    default_source: "ESPN match statistics"
  - id: "final_third_entries_per_match"
    group: "Control"
    display_name: "Final-third entries per match"
    short_label: "Final-third entries"
    unit: "entries"
    description: "How often Barcelona moves the ball into the attacking third per match — a measure of territorial control rather than chance quality."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 2.0
    default_source: "ESPN match statistics"

scorecard_groups:
  - name: "Team"
    metric_ids: ["blaugrana_index", "points_per_match", "goal_difference", "xg_difference_per_match"]
  - name: "Attack"
    metric_ids: ["goals_per_match", "xg_per_match", "big_chances_per_match", "shot_conversion"]
  - name: "Defense"
    metric_ids: ["goals_conceded_per_match", "xga_per_match", "clean_sheet_rate", "box_shots_conceded_per_match"]
  - name: "Control"
    metric_ids: ["possession_pct", "pass_accuracy", "ppda", "final_third_entries_per_match"]

editorial:
