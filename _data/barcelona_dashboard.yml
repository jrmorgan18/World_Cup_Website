# FC Barcelona Season Dashboard
# Objective stats are generated by scripts/update_barcelona_dashboard.py into
# barcelona_dashboard_stats.json. This file holds metric definitions, squad
# context and the editorial judgments that still require human review.
#
# La Liga and Champions League numbers are kept in separate samples throughout.

meta:
  season: 2026
  season_label: "2026-27 Season"
  last_updated: "2026-09-17"
  update_context: "Through La Liga Matchday 6 · Champions League Matchday 1"
  data_status: "through-laliga-matchday-6"
  data_notice: >-
    La Liga metrics use six matches and Champions League metrics use one, so the
    European sample is directional rather than settled. Ranks are calculated from
    ESPN per-match team statistics within each competition separately: 20 clubs in
    La Liga, 36 in the Champions League league phase. Availability and squad
    assessments are editorial and are kept apart from the calculated metrics.

metric_definitions:
  - id: "blaugrana_index"
    group: "Team"
    display_name: "Dual Eights Blaugrana index"
    short_label: "Blaugrana index"
    unit: "index"
    description: "A 0–100 competition-percentile composite weighting expected goals per match, expected goals conceded per match, goals per match and goals conceded per match equally. It is not opponent-adjusted."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 1.0
    default_source: "Dual Eights index from ESPN match statistics"
  - id: "points_per_match"
    group: "Team"
    display_name: "Points per match"
    short_label: "Points / match"
    unit: "points"
    description: "Competition points divided by matches played in that competition."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.05
    default_source: "ESPN competition results"
  - id: "goal_difference"
    group: "Team"
    display_name: "Goal difference"
    short_label: "Goal diff."
    unit: "goals"
    description: "Goals scored minus goals conceded in the competition."
    direction: "higher"
    format: "signed_integer"
    stable_delta: 0
    default_source: "ESPN competition results"
  - id: "xg_difference_per_match"
    group: "Team"
    display_name: "Expected goal difference per match"
    short_label: "xGD / match"
    unit: "expected goals"
    description: "Expected goals created minus expected goals conceded, divided by matches played. It measures the balance of chance quality rather than finishing."
    direction: "higher"
    format: "signed_decimal_2"
    stable_delta: 0.1
    default_source: "ESPN match statistics"
  - id: "goals_per_match"
    group: "Attack"
    display_name: "Goals per match"
    short_label: "Goals / match"
    unit: "goals"
    description: "Goals scored divided by matches played."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.1
    default_source: "ESPN match statistics"
  - id: "xg_per_match"
    group: "Attack"
    display_name: "Expected goals per match"
    short_label: "xG / match"
    unit: "expected goals"
    description: "The quality of chances created per match, expressed as the goals an average team would be expected to score from them."
    direction: "higher"
    format: "decimal_2"
    stable_delta: 0.1
    default_source: "ESPN match statistics"
  - id: "big_chances_per_match"
    group: "Attack"
    display_name: "Big chances created per match"
    short_label: "Big chances / match"
    unit: "chances"
    description: "Opta-defined big chances — situations where a player should reasonably be expected to score — created per match."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 0.3
    default_source: "ESPN match statistics"
  - id: "shot_conversion"
    group: "Attack"
    display_name: "Shot conversion"
    short_label: "Conversion"
    unit: "percent"
    description: "Goals scored as a share of total shots taken."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "ESPN match statistics"
  - id: "goals_conceded_per_match"
    group: "Defense"
    display_name: "Goals conceded per match"
    short_label: "Conceded / match"
    unit: "goals"
    description: "Goals conceded divided by matches played."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.1
    default_source: "ESPN match statistics"
  - id: "xga_per_match"
    group: "Defense"
    display_name: "Expected goals conceded per match"
    short_label: "xGA / match"
    unit: "expected goals"
    description: "The quality of chances opponents create per match. It is the clearest early read on whether a high defensive line is holding."
    direction: "lower"
    format: "decimal_2"
    stable_delta: 0.1
    default_source: "ESPN match statistics"
  - id: "clean_sheet_rate"
    group: "Defense"
    display_name: "Clean-sheet rate"
    short_label: "Clean sheets"
    unit: "percent"
    description: "Share of matches in the competition finished without conceding."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 5.0
    default_source: "ESPN match statistics"
  - id: "box_shots_conceded_per_match"
    group: "Defense"
    display_name: "Box shots conceded per match"
    short_label: "Box shots allowed"
    unit: "shots"
    description: "Shots opponents take from inside the penalty area per match, the highest-value chances a defense gives up."
    direction: "lower"
    format: "decimal_1"
    stable_delta: 0.5
    default_source: "ESPN match statistics"
  - id: "possession_pct"
    group: "Control"
    display_name: "Possession"
    short_label: "Possession"
    unit: "percent"
    description: "Average share of the ball across matches in the competition."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 1.0
    default_source: "ESPN match statistics"
  - id: "pass_accuracy"
    group: "Control"
    display_name: "Pass accuracy"
    short_label: "Pass accuracy"
    unit: "percent"
    description: "Accurate passes as a share of all passes attempted."
    direction: "higher"
    format: "percentage_1"
    stable_delta: 0.5
    default_source: "ESPN match statistics"
  - id: "ppda"
    group: "Control"
    display_name: "Passes per defensive action"
    short_label: "PPDA"
    unit: "passes"
    description: "How many passes an opponent completes before Barcelona makes a defensive action. It is the standard pressing-intensity measure, averaged across matches."
    direction: "lower"
    format: "decimal_1"
    stable_delta: 0.5
    default_source: "ESPN match statistics"
  - id: "final_third_entries_per_match"
    group: "Control"
    display_name: "Final-third entries per match"
    short_label: "Final-third entries"
    unit: "entries"
    description: "How often Barcelona moves the ball into the attacking third per match — a measure of territorial control rather than chance quality."
    direction: "higher"
    format: "decimal_1"
    stable_delta: 2.0
    default_source: "ESPN match statistics"

scorecard_groups:
  - name: "Team"
    metric_ids: ["blaugrana_index", "points_per_match", "goal_difference", "xg_difference_per_match"]
  - name: "Attack"
    metric_ids: ["goals_per_match", "xg_per_match", "big_chances_per_match", "shot_conversion"]
  - name: "Defense"
    metric_ids: ["goals_conceded_per_match", "xga_per_match", "clean_sheet_rate", "box_shots_conceded_per_match"]
  - name: "Control"
    metric_ids: ["possession_pct", "pass_accuracy", "ppda", "final_third_entries_per_match"]

editorial:
  state:
    summary: >-
      Barcelona has won all seven matches it has played across both competitions,
      scoring 33 goals and conceding seven. The La Liga start is the most productive
      of Hansi Flick's tenure: six wins, 18 points, a plus-22 goal difference and a
      league-leading 4.03 expected goals per match. The Champions League opened with
      a 5-1 win over Feyenoord. The pattern worth watching is at the other end.
      Barcelona has conceded two goals in each of its last two league matches, its
      expected goals conceded per match has risen from 1.04 to 1.18, and only the
      clean-sheet rate and the European sample argue the defense is settled.
    biggest_strength: "The attack leads La Liga in goals, expected goals, big chances and conversion at once — 28 goals in six league matches with the underlying numbers to support them."
    biggest_concern: "Expected goals conceded per match ranks fifth in La Liga, the one scorecard number where Barcelona is not first or second, and it has moved the wrong way in consecutive matches."
    changed_this_week: "A 7-2 win over Racing Santander pushed Barcelona to 6-0-0 and a plus-22 goal difference, but a second straight two-goal concession lifted xGA per match to 1.18 and dropped the Blaugrana index from 96.1 to 90.8."

  metric_assessments:
    laliga:
      blaugrana_index: { status: "Elite", interpretation: "The composite sits second in La Liga because the defensive components have softened while the attacking ones lead the league. It is a transparent percentile average, not an opponent-adjusted rating." }
      points_per_match: { status: "Elite", interpretation: "A perfect 3.00 through six matches. The margin at the top is three points over Real Madrid and Real Betis." }
      goal_difference: { status: "Elite", interpretation: "Plus-22 is the largest in La Liga and the clearest measure of how one-sided the opening six matches have been." }
      xg_difference_per_match: { status: "Elite", interpretation: "A plus-2.86 expected goal difference per match leads La Liga and says the results are earned rather than finished above expectation." }
      goals_per_match: { status: "Elite", interpretation: "4.67 goals per match leads La Liga by a distance, built on 28 goals in six matches." }
      xg_per_match: { status: "Elite", interpretation: "4.03 expected goals per match is the league's best and closely tracks the actual scoring, which is what separates a hot streak from a repeatable attack." }
      big_chances_per_match: { status: "Elite", interpretation: "5.3 big chances per match leads La Liga. Barcelona is not relying on low-probability finishing to score at this rate." }
      shot_conversion: { status: "Elite", interpretation: "22.2% conversion leads the league and sits close to the expected-goals profile, so the finishing is ahead of average without being unsustainable." }
      goals_conceded_per_match: { status: "Good", interpretation: "1.00 conceded per match is tied for the league lead, but the ranking flatters a defense that has conceded two in each of its last two matches." }
      xga_per_match: { status: "Concern", interpretation: "1.18 expected goals conceded per match ranks fifth and has risen in consecutive matches. It is the leading indicator to watch behind the results." }
      clean_sheet_rate: { status: "Good", interpretation: "Three clean sheets in six matches ranks second, down from 60% a week ago. The high line produces shutouts and gives up chances in the same performance." }
      box_shots_conceded_per_match: { status: "Good", interpretation: "5.5 shots allowed inside the box per match leads La Liga, which is the strongest argument that the defensive concern is about chance quality rather than volume." }
      possession_pct: { status: "Elite", interpretation: "68.5% possession leads La Liga and is the baseline condition for everything else on this scorecard." }
      pass_accuracy: { status: "Elite", interpretation: "90.4% accuracy ranks second. The volume matters as much as the rate: Barcelona completes more passes than anyone in the league." }
      ppda: { status: "Elite", interpretation: "Opponents complete 8.9 passes per Barcelona defensive action, the most aggressive press in La Liga. It is the mechanism behind the territorial numbers." }
      final_third_entries_per_match: { status: "Elite", interpretation: "71.8 final-third entries per match ranks second and shows the press and possession converting into sustained territory." }
    ucl:
      blaugrana_index: { status: "Good", interpretation: "Second in the league phase after one match. A single fixture against Feyenoord is far too small a sample to read as a European verdict." }
      xg_per_match: { status: "Average", interpretation: "1.63 expected goals ranks eighth despite the 5-1 scoreline, a reminder that the finishing outran the chance quality on the night." }
      xga_per_match: { status: "Good", interpretation: "0.52 expected goals conceded ranks second in the league phase, the best single defensive performance of the season so far." }
      ppda: { status: "Elite", interpretation: "8.7 passes per defensive action led the league phase's opening round. The press travelled into Europe intact." }

