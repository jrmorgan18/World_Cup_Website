methodology_notes:
  - "La Liga and Champions League figures are never combined. Each competition is ranked within its own field: 20 clubs in La Liga, 36 in the Champions League league phase."
  - "Every ranked metric is calculated here from ESPN per-match team statistics rather than read from a published table, so the two competitions use identical definitions."
  - "The Dual Eights Blaugrana index is the equal-weight average of four competition percentiles: expected goals per match, expected goals conceded per match, goals per match and goals conceded per match. It is transparent and not opponent-adjusted."
  - "Ranks use standard competition ranking, so tied values share the better rank. Early in a season many defensive metrics are tied."
  - "PPDA is the average of each match's passes-per-defensive-action value, not a season-long ratio of totals."
  - "Minutes are derived from substitution clocks on ESPN's team sheets and are capped at 90 per match, so stoppage time is excluded."
  - "Player goals, assists and saves are summed from completed-match box scores to avoid season-roster feed lag. Appearances and starts use the same match team sheets as minutes."
  - "Team goals can exceed the sum of individual player goals because opposition own goals count for the team but are not credited to a Barcelona scorer."
  - "Scorecard interpretations are shown only while their reviewed matchday, value and competition rank still match the current card. Statistical refresh dates and commentary review dates are shown separately."
  - "The rotation window is a rolling 21 days, and minutes share is measured against the minutes available to a player in that window."
  - "Snapshots are rebuilt so each matchday is ranked against a full round of fixtures rather than the partial table that existed at Barcelona's own kickoff."
  - "Player-level expected goals are not published because the free source does not expose them per player at a defensible cost."
  - "Squad notes, metric statuses and availability entries are editorial and are kept separate from the calculated metrics."

