      conceded after the 5-2 win at Betis. Nine league wins have produced 27 points
      and a plus-30 goal difference. The attack leads La Liga in scoring and chance
      creation, while expected goals conceded has improved to a league-best 0.95
      per match. That does not mean the defense is flawless: actual goals conceded
      ranks fourth and Barcelona has four clean sheets in nine league matches.
      PSG away and El Clásico will test whether the chance control travels against
      stronger attacks.
