# Orioles Player of the Week — powers the module on /orioles/.
#
# Update this file each week. It takes precedence over the `player_of_week`
# front matter on the most recent weekly recap post, so the award can be
# refreshed in weeks where no recap article has been published yet.
#
# Set `recap_url` only when a weekly recap post exists for this period; the
# "Read the weekly recap" link is hidden when it is absent.
name: "Jackson Holliday"
position: "2B"
period: "July 27 – August 2, 2026"
summary: >-
  Holliday was Baltimore's best hitter through deadline week, batting .450 with
  a .976 OPS across six games. He opened 4-for-5 at Comerica Park — the game
  that produced his only extra-base hit of the stretch — and two nights later
  drove in three, including the two-run single that started the Orioles' rally
  from seven down against Skubal's bullpen, the club's largest comeback win
  since 2009. He stole a base and came around to score on Taylor Ward's single
  in the same inning. The Phillies weekend was a different story: 0-for-6.
image: "https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_720,q_auto:best/v1/people/702616/headshot/67/current"
image_alt: "Jackson Holliday of the Baltimore Orioles"
