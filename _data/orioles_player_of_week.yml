name: "Tyler O'Neill"
position: "OF"
period: "August 3–9, 2026"
recap_url: "/orioles/weekly-recap-2026-08-09/"
summary: >-
  O'Neill went 5-for-14 with three home runs, five RBIs and four walks during a
  3-3 week, producing a .357 average, .500 on-base percentage and 1.500 OPS.
  His pinch-hit homer Tuesday restored a two-run cushion, his Wednesday blast
  started Baltimore's back-to-back sequence with Coby Mayo, and his Sunday shot
  removed any doubt from the club's 10-5 win in Texas.
