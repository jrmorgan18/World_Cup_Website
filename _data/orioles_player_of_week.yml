image_alt: "Jackson Holliday of the Baltimore Orioles"
# Headshots crop better from the top than the centre; omit for action photos.
image_position: "center top"
image_credit: "MLB.com"
image_credit_url: "https://www.mlb.com/orioles/video/jackson-holliday-s-four-hit-game-vs-tigers"
