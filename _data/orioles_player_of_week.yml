# Orioles Player of the Week — powers the module on /orioles/.
#
# Update this file each week. It takes precedence over the `player_of_week`
# front matter on the most recent weekly recap post, so the award can be
# refreshed in weeks where no recap article has been published yet.
#
# Set `recap_url` only when a weekly recap post exists for this period; the
# "Read the weekly recap" link is hidden when it is absent.
name: "Jackson Holliday"
position: "2B"
period: "July 27 – August 2, 2026"
summary: >-
  Holliday was the one constant in Baltimore's lineup through deadline week. He
  opened it 4-for-5 in Detroit — the fourth four-hit game of his career and his
  second of the month — then came off the bench two nights later with the
  two-run single that sparked the Orioles' rally from seven down, the club's
  largest comeback win since 2009.
