    goal: "Starting quickly and playing often"
    player_actions: "Run in, find the ball, go to goal"
    praise: "Being ready"
    skills: "1v1 and 2v2 play"
    blocks: [{ phase: "Just play", activity: numbers-game }, { phase: "Teach one thing", activity: 1v1-two-goals }, { phase: "Play again", activity: numbers-game }]
  - number: 10
