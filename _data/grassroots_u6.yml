  - number: 6
    moment: "Attacking"
    goal: "Being brave in a little game"
    player_actions: "Try to score, win the ball back"
    praise: "Having another go"
    skills: "1v1 play, shooting"
    blocks: [{ phase: "Just play", activity: u6-arrival }, { phase: "Teach one thing", activity: four-goal-game }, { phase: "Play again", activity: end-zones-1v1 }]
  - number: 7
    moment: "Ball work"
    goal: "Turning away from trouble"
    player_actions: "Look up, turn into space"
    praise: "Finding a new gate"
    skills: "Dribbling, turning"
