date: 2026-10-05
edition: "October 5, 2026"
kicker: "Week 5 · Atlanta"
heading: "Ravens Daily"
intro: "Monday's updates on Lamar Jackson, the injury list, the offensive line and what the film revealed after the win over Tennessee."
highlights:
  - title: "Lamar Jackson’s status for Sunday night in Atlanta remains uncertain, but the Ravens do not believe his ankle injury will be a long-term problem."
    text: >-
      Jackson underwent imaging Monday, and Jesse Minter said the team is still gathering information before assessing his chances of playing, while adding that he does not expect the injury to be “crazy long-term.” Tyler Huntley would start if Jackson cannot go, with Wednesday’s practice providing the first real indication of his Week 5 availability.
    sources:
      - "The Baltimore Sun"
      - "BaltimoreRavens.com"
    source_links:
      - label: "Ravens News & Notes"
        url: "https://www.baltimoreravens.com/news/lamar-jackson-ankle-injury-update-jesse-minter-ravens-pass-rush-defensive-line-tyler-loop"
  - title: "There was no definitive Monday update on Marlon Humphrey, Andrew Vorhees or Durham Smythe, leaving three potentially significant injuries unresolved."
    text: >-
      Humphrey has a calf injury, Vorhees injured his foot and Smythe injured his Achilles against Tennessee. The latter two are especially important structurally: Emery Jones replaced Vorhees at right guard, while rookie tight ends Matt Hibner and Josh Cuevas would have to absorb more of Smythe’s blocking and movement responsibilities if he misses time.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Ravens injury report"
        url: "https://www.baltimoreravens.com/news/ravens-injuries-durham-smythe-marlon-humphrey-andrew-vorhees-achilles-calf-sidelined"
  - title: "The Ravens’ battered offensive line could be headed for a fourth different starting combination in five games."
    text: >-
      First-round rookie Vega Ioane held up well in his first start at center, but Vorhees’ foot injury forced Emery Jones into the game at right guard after Baltimore had already lost centers Jovaughn Gwyn, Ethan Pocic and Danny Pinter. Ronnie Stanley’s return Sunday helps, but the line that was already Baltimore’s biggest roster question has quickly become an exercise in survival.
    sources:
      - "BaltimoreRavens.com"
      - "Baltimore Beatdown"
    source_links:
      - label: "Ioane's first start"
        url: "https://www.baltimoreravens.com/news/vega-ioane-first-start-center-ravens-titans-rookie"
  - title: "The pass rush was considerably better than the one-sack box score suggests."
    text: >-
      Baltimore generated 18 pressures and five quarterback hits despite blitzing Cam Ward only five times and playing without Trey Hendrickson; Next Gen Stats credited Nnamdi Madubuike with six pressures and Mike Green with five. Minter said Tennessee repeatedly used seven-man protections, which helps explain the lack of sacks and makes the underlying disruption more encouraging as Madubuike works back toward full strength.
    sources:
      - "BaltimoreRavens.com/Next Gen Stats"
    source_links:
      - label: "Pass-rush review"
        url: "https://www.baltimoreravens.com/news/lamar-jackson-ankle-injury-update-jesse-minter-ravens-pass-rush-defensive-line-tyler-loop"
  - title: "Minter acknowledged that Baltimore deliberately became more conservative after Jackson left, but he was not satisfied with how the offense executed that plan."
    text: >-
      The Ravens failed to convert three third downs between midfield and the Tennessee 40 in the second half, helping turn a 24-7 halftime lead into a game that required an onside-kick recovery to finish. Protecting a lead with Huntley and worsening rain was reasonable; repeatedly failing to extend drives was not.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Minter's Monday review"
        url: "https://www.baltimoreravens.com/news/lamar-jackson-ankle-injury-update-jesse-minter-ravens-pass-rush-defensive-line-tyler-loop"
  - title: "The penalty problem is no longer something the Ravens can dismiss as an early-season annoyance."
    text: >-
      After committing 13 penalties for 131 yards Sunday, Minter again put responsibility on himself and the coaching staff for getting the problem corrected. Baltimore is 3-1 despite the mistakes, but an offense dealing with this many injuries cannot keep donating field position and manageable down-and-distance situations when the schedule gets harder.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "The Breakdown"
        url: "https://www.baltimoreravens.com/news/ravens-injuries-titans-breakdown-lamar-jackson-marlon-humphrey-2026"
