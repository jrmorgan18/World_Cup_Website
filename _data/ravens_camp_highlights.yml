date: 2026-08-19
edition: "Wednesday · Aug. 19"
kicker: "Training camp"
heading: "Camp Highlights"
intro: "A source-attributed roundup from Wednesday’s Ravens Training Camp Daily, covering the first joint practice with Minnesota."
highlights:
  - title: "Danny Pinter’s injury is now the biggest concern on the roster"
    text: "The center, who had taken most of Baltimore’s first-team reps and entered the week as the favorite to replace Tyler Linderbaum, was carted off during 11-on-11 work and later seen wearing a full-leg brace on his right leg. Jesse Minter had no diagnosis after practice, so the severity remains unknown, but the center competition may have changed abruptly."
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Jovaughn Gwyn and Ethan Pocic are suddenly much more important"
    text: "Gwyn stepped in after Pinter went down and immediately helped spring Derrick Henry on a long inside run, while Minter noted that Baltimore was already planning to increase Pocic’s workload this week as he returns from December’s Achilles tear. If Pinter misses meaningful time, the Ravens may be choosing between Gwyn’s familiarity with Dwayne Ledford’s system and Pocic’s much larger body of NFL starting experience."
    sources:
      - "BaltimoreRavens.com"
      - "The Baltimore Banner"
  - title: "Baltimore’s defense won most of the first joint practice with Minnesota"
    text: "The Ravens were physical against the run and consistently disruptive in coverage, with Nate Wiggins, Marlon Humphrey and Keyon Martin all producing notable pass breakups or pressure. Minnesota did finally crack the defense for touchdowns on both late two-minute drives, so Minter liked the overall performance considerably more than the finish."
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Nate Wiggins looked fully capable of handling high-end competition"
    text: "Wiggins battled Justin Jefferson and Jordan Addison throughout the afternoon, breaking up multiple downfield throws and drawing praise as perhaps Baltimore’s best player at the practice. Jefferson won one deep rep and later scored against a double team, but Wiggins’ workload was the clearest evidence yet that his recent lower-body injury is no longer limiting him."
    sources:
      - "BaltimoreRavens.com"
      - "The Baltimore Banner"
  - title: "Brian Flores gave Baltimore’s new offense a difficult and useful stress test"
    text: "Minnesota repeatedly overloaded protections and forced Lamar Jackson into quick throws, scrambles and several would-be sacks, while both Ravens offenses failed in their closing two-minute periods. Baltimore found some answers underneath, particularly to Zay Flowers, Mark Andrews and Rashod Bateman, but generated few explosive plays against the Vikings’ pressure looks."
    sources:
      - "BaltimoreRavens.com"
      - "The Baltimore Banner"
  - title: "Vega Ioane was one encouraging exception up front"
    text: "Even while the rest of the protection struggled with Minnesota’s pressure packages, the first-round rookie reportedly held up well in individual pass-rush work and repeatedly stopped Vikings defensive linemen at right guard. With the center situation now uncertain, Ioane developing into a dependable immediate starter becomes even more valuable."
    sources:
      - "BaltimoreRavens.com"
  - title: "The joint practice got heated without becoming a full-scale problem"
    text: "Keyon Martin was involved in the largest scrum during special-teams work, and John Simpson had a separate confrontation with a Vikings defender, but both teams quickly regained control. Minter said he liked the overall physicality, though he has repeatedly stressed that competitive practice cannot cross into behavior that would draw an ejection on Sundays."
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
