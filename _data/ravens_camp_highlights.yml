date: 2026-08-20
edition: "Thursday · Aug. 20"
kicker: "Training camp"
heading: "Camp Highlights"
intro: "A source-attributed roundup from Thursday’s Ravens Training Camp Daily, covering the second joint practice with Minnesota."
highlights:
  - title: "Danny Pinter’s knee injury reshapes the center competition"
    text: "NFL Network reported that Pinter suffered a torn patellar tendon during Wednesday’s joint practice and could miss the season. He had taken most of the first-team reps and entered the week as the favorite, leaving Ethan Pocic and Jovaughn Gwyn as Baltimore’s primary internal options."
    sources:
      - "NFL Network"
      - "WBAL"
      - "The Baltimore Banner"
      - "Reuters"
  - title: "Baltimore’s secondary won another meaningful test"
    text: "Marlon Humphrey and Nate Wiggins repeatedly denied Justin Jefferson in red-zone work, while K’Von Wallace added a pick-six and Keyon Martin continued his strong summer with another difficult breakup. Two productive days against Jefferson and Minnesota’s offense carry more weight than most camp interceptions or pass breakups."
    sources:
      - "BaltimoreRavens.com"
  - title: "Trey Hendrickson looked like Baltimore’s paid difference-maker"
    text: "Hendrickson produced two would-be sacks and consistently bothered Vikings left tackle Christian Darrisaw. Baltimore needed an edge defender who can win without the defense manufacturing pressure, and the joint practices offered an encouraging glimpse of that fit."
    sources:
      - "BaltimoreRavens.com"
  - title: "Minnesota’s pressure packages remain a problem"
    text: "The Vikings disrupted Baltimore for a second straight day, with Dallas Turner creating problems and Lamar Jackson throwing an interception on fourth-and-long after he and his target were not on the same page. Ronnie Stanley acknowledged that the offensive line still has work to do against those looks, an issue made more urgent by Pinter’s injury."
    sources:
      - "BaltimoreRavens.com"
  - title: "Jovaughn Gwyn handled his sudden first-team promotion"
    text: "Gwyn stepped into the first-team center role after Pinter’s injury and reportedly had another strong day, including good work in one-on-ones and alongside rookie guard Vega Ioane. His preseason opener and two Minnesota practices have made this a real competition with the more experienced Pocic rather than an emergency assignment."
    sources:
      - "BaltimoreRavens.com"
  - title: "Tyler Loop stayed perfect through another busy practice"
    text: "Loop made all six field-goal attempts, including one from 53 yards, after Baltimore’s offense failed to get him into position for a simulated game-winning attempt. The kicking transition still needs regular-season evidence, but camp has offered little reason to reopen the position."
    sources:
      - "BaltimoreRavens.com"
