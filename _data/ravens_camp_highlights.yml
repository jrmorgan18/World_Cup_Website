date: 2026-10-13
edition: "October 13, 2026"
kicker: "Week 6 · Cleveland"
heading: "Ravens Daily"
intro: "The Ravens made a receiver move as Ja’Kobi Lane nears eligibility to return, while Cleveland reshaped its backfield before Sunday’s AFC North matchup."
highlights:
  - title: "The Ravens waived Chris Moore, clearing a roster spot ahead of Ja'Kobi Lane's potential return."
    text: >-
      The Ravens also released Xavier Guillory from the practice squad, creating room to potentially bring Moore back. Lane is eligible to return from injured reserve after missing four games with a fractured wrist, although his activation has not been confirmed. The 6-foot-4 rookie would give Declan Doyle another receiving option after an impressive training camp and preseason.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Ravens · Moore waived, Lane return update"
        url: "https://www.baltimoreravens.com/news/ravens-waive-chris-moore-release-xavier-guillory-practice-squad-jakobi-lane-expected-off-injured-reserve-week-6"
  - title: "Cleveland's backfield took another injury hit ahead of Sunday's AFC North matchup."
    text: >-
      The Browns placed backup running back Raheim Sanders on injured reserve with a hip injury and signed Audric Estime from Minnesota's practice squad. With starter Quinshon Judkins also recovering from an ankle injury suffered against the Jets, Cleveland could enter Sunday with a considerably different running back rotation.
    sources:
      - "ClevelandBrowns.com"
    source_links:
      - label: "Browns · Audric Estime signed, Raheim Sanders placed on IR"
        url: "https://www.clevelandbrowns.com/news/browns-sign-rb-audric-estime"
