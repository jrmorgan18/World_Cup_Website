date: "2026-10-24"
edition: "October 24, 2026"
kicker: "Week 7 · Cincinnati"
heading: "Ravens Daily"
intro: "Huntley starts again, Robinson moves to IR, and the Ravens reinforce the edge rotation and interior offensive line."
highlights:
  - title: "Lamar Jackson has been ruled out for Sunday's AFC North matchup with Cincinnati, leaving Tyler Huntley to make his third consecutive start."
    text: >-
      Jackson returned to practice this week but continues experiencing significant pain when running on his high ankle sprain, and Baltimore decided Saturday that he isn't ready. The Ravens scored just 10 points against Cleveland last week, making another game without their franchise quarterback a major challenge against a fully healthy Bengals team.
    sources:
      - "BaltimoreRavens.com"
      - "Reuters"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/lamar-jackson-out-against-bengals-week-7-tyler-huntley-third-straight-start"
  - title: "Baltimore placed Tavius Robinson on injured reserve and elevated Adisa Isaac from the practice squad to reinforce its depleted edge rotation."
    text: >-
      Robinson's season-ending pectoral injury removes the team's sack leader, while Isaac provides immediate depth behind Trey Hendrickson, Mike Green and rookie Zion Young. The move puts additional pressure on Baltimore's young pass rushers to generate pressure against Joe Burrow without sacrificing run defense.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/lamar-jackson-out-against-bengals-week-7-tyler-huntley-third-straight-start"
  - title: "The Ravens signed Kyle Hergel to the 53-man roster, securing additional interior offensive line depth ahead of Cam Jurgens' expected debut."
    text: >-
      Hergel had exhausted his three permitted practice-squad elevations, requiring Baltimore to promote him to keep him available Sunday. Jurgens completed the week without an injury designation, positioning the Ravens to move Vega Ioane back to guard while retaining Hergel as insurance at center.
