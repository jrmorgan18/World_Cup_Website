date: 2026-08-13
edition: "Thursday · Aug. 13"
intro: "A daily, source-attributed roundup of Ravens practice reporting."
highlights:
  - title: "Wiggins and Humphrey are trending toward quick returns"
    text: "Jesse Minter said both cornerbacks are trending very well and could return early next week. Wiggins reportedly has no structural damage, easing concern after Tuesday's cart ride."
    sources:
      - "BaltimoreRavens.com"
      - "WBAL-TV"
  - title: "Jackson turns in one of camp's sharpest days"
    text: "ESPN's Jamison Hensley reported that Jackson was 11-of-12 midway through practice, with explosive completions to Rashod Bateman and Devontez Walker. The quarterback also continues to look more comfortable with Declan Doyle's new system."
    sources:
      - "BaltimoreRavens.com"
      - "ESPN"
  - title: "Flowers is back in 11-on-11 work"
    text: "After beginning the week with individual work, Zay Flowers returned to team periods and made a toe-tapping sideline catch. The progression suggests Saturday's quad contusion was only a brief interruption."
    sources:
      - "BaltimoreRavens.com"
  - title: "Madubuike is nearing the next stage of his return"
    text: "Minter said Nnamdi Madubuike is progressing very well from his neck injury and could begin team periods within the next week or two. Baltimore remains cautious, but he is moving beyond individual rehab work."
    sources:
      - "BaltimoreRavens.com"
  - title: "Ioane will be a key preseason watch"
    text: "While most established starters are expected to sit against Philadelphia, Minter said first-round rookie right guard Vega Ioane is expected to play and get his first NFL game reps."
    sources:
      - "BaltimoreRavens.com"
  - title: "Loop brings a perfect streak into Saturday"
    text: "Tyler Loop made all four field-goal attempts Thursday and has now completed four straight practices without a miss. The preseason opener provides his first real game-setting test."
    sources:
      - "BaltimoreRavens.com"
