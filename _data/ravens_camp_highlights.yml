date: 2026-08-29
edition: "Saturday · Aug. 29"
kicker: "Training camp"
heading: "Camp Highlights"
intro: "A source-attributed roundup from Saturday’s Ravens Training Camp Daily, covering roster cuts, a defensive-line trade and the final preseason decisions."
highlights:
  - title: "Roster cuts are underway, and Baltimore has already made several notable moves"
    text: "The Ravens waived veteran receiver Chris Moore, cornerbacks Robert Longerbeam and Lardarius Webb Jr., quarterback Austin Reed, center Nick Dawkins and several others Saturday. Moore could still be a practice-squad candidate, but his release further clarifies a receiver room that appears largely settled."
    sources:
      - "BaltimoreRavens.com"
      - "The Athletic"
      - "The Baltimore Sun"
      - "ESPN"
  - title: "The Ravens turned defensive-line depth into a future draft pick"
    text: "Baltimore reportedly traded C.J. Okoye to the Giants for a 2028 seventh-round pick, reuniting him with John Harbaugh and defensive line coach Dennis Johnson. Okoye played 13 games for Baltimore last season, but the Ravens’ crowded defensive front made him a logical candidate to move rather than simply waive."
    sources:
      - "NFL Network"
      - "BaltimoreRavens.com"
  - title: "Jovaughn Gwyn now looks like the favorite to start Week 1 at center"
    text: "Gwyn started Friday’s preseason finale and played only the opening two drives before Ethan Pocic took over, the clearest indication yet that Baltimore was treating Gwyn like a starter it wanted to protect. A botched exchange with Tyler Huntley was a blemish, but Pocic also committed a costly holding penalty, so this still feels more like Gwyn gaining the edge than emphatically winning the job."
    sources:
      - "PressBox"
      - "BaltimoreRavens.com"
  - title: "Tyler Loop has turned kicker back into a legitimate concern"
    text: "Loop went 2-for-4 Friday, missing from 58 and 51 yards, and finished the preseason 5-for-8. Jesse Minter softened his previous backing afterward, saying Baltimore will continue evaluating what is best for the team, which leaves open the possibility of adding veteran competition before Week 1."
    sources:
      - "PressBox"
      - "BaltimoreRavens.com"
  - title: "Ja’Kobi Lane appears to have completed his rise to the No. 3 receiver job"
    text: "Lane was held out of the preseason finale while Elijah Sarratt and Devontez Walker played, another strong indication Baltimore now views the third-round rookie as part of its established offensive group. After being the standout receiver throughout camp, Lane leaves August having earned more than just a developmental role."
    sources:
      - "PressBox"
  - title: "Joe Fagnano has made the third-quarterback decision genuinely difficult"
    text: "The undrafted rookie finished a strong preseason Friday and has played well enough that Baltimore must weigh carrying three quarterbacks against the risk of losing him on waivers. The Ravens’ own roster projection still leans toward keeping only Lamar Jackson and Tyler Huntley and attempting to bring Fagnano back on the practice squad."
    sources:
      - "BaltimoreRavens.com"
  - title: "The defense exits the preseason having backed up its strong camp with three dominant games"
    text: "Baltimore allowed only 13 points in 12 preseason quarters, including just one touchdown, and held Washington to 177 yards in Friday’s 41-3 finale. Preseason offense is hardly a perfect measuring stick, but combined with strong joint practices against Minnesota and Washington, Jesse Minter’s defense has produced about as much encouraging August evidence as possible."
    sources:
      - "PressBox"
