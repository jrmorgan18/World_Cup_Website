date: 2026-09-02
edition: "Wednesday · Sept. 2"
kicker: "Training camp"
heading: "Camp Highlights"
intro: "A source-attributed roundup from Wednesday’s Ravens Training Camp Daily, covering the final Week 1 health and roster decisions."
highlights:
  - title: "Zay Flowers remains the biggest health item, but Wednesday brought another encouraging sign"
    text: "Flowers was the only Raven who did not practice, yet ESPN’s Jamison Hensley reported that he was running sprints on a side field. Jesse Minter has characterized the issue as minor, and local reporting continues to point toward a full return next week. For now, this looks more like Baltimore protecting its No. 1 receiver than a developing Week 1 concern."
    sources:
      - "ESPN"
      - "The Baltimore Sun"
  - title: "The Ravens are treating Jake Moody as real competition for Tyler Loop"
    text: "Special teams coordinator Anthony Levine Sr. said Loop has embraced Moody’s arrival after going 5-for-8 during the preseason, while Minter still expects Loop to kick against Indianapolis. Baltimore has moved from unconditional backing to having an experienced alternative immediately available if Loop’s excellent practice work again fails to carry into games."
    sources:
      - "BaltimoreRavens.com"
  - title: "Baltimore will finally make its center decision after this week"
    text: "Declan Doyle said the Jovaughn Gwyn-Ethan Pocic competition remains up in the air and that he, Dwayne Ledford and Minter will settle the plan after this week’s practices. Gwyn’s late-camp momentum makes him the apparent favorite, but Pocic’s experience keeps this from being a ceremonial competition following Danny Pinter’s season-ending injury."
    sources:
      - "BaltimoreRavens.com"
  - title: "Doyle has put a concrete marker on what he wants from Lamar Jackson"
    text: "Doyle wants Jackson near a 70% completion rate. The emphasis is less about chasing a vanity stat than consistently taking checkdowns and the space defenses concede, fitting the broader camp theme of making Jackson more efficient within structure before relying on his improvisation. Jackson’s career high is 67.2%, so reaching Doyle’s target would represent a meaningful evolution of the passing offense."
    sources:
      - "BaltimoreRavens.com"
  - title: "Zion Young’s pass-rush development has exceeded the staff’s expectations"
    text: "Defensive coordinator Anthony Weaver said the second-round rookie has already made significant progress with his rush angles and plan of attack after relying more heavily on athleticism and power in college, while calling his potential against the run elite. That is coaching evaluation rather than proven NFL production, but it strengthens the case that Young can contribute immediately rather than serving purely as a developmental edge."
    sources:
      - "BaltimoreRavens.com"
  - title: "Baltimore finished its initial practice squad with veteran insurance at two offensive positions"
    text: "The Ravens added blocking tight end Nick Vannett and tackle A.J. Arcuri, giving them players with NFL game experience who could be elevated quickly if injuries strike. Arcuri is particularly useful after Baltimore traded Diego Pounds and emerged from camp with Carson Vinson as its primary swing tackle."
    sources:
      - "BaltimoreRavens.com"
