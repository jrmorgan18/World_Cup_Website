date: 2026-09-01
edition: "Tuesday · Sept. 1"
kicker: "Training camp"
heading: "Camp Highlights"
intro: "A source-attributed roundup from Tuesday’s Ravens Training Camp Daily, covering the final Week 1 decisions after Baltimore set its initial roster."
highlights:
  - title: "Tyler Loop remains the Week 1 kicker — for now"
    text: "Jesse Minter reiterated that he expects Loop to handle kicking duties against Indianapolis despite Baltimore adding former 49ers third-round pick Jake Moody to the practice squad. Moody gives the Ravens a ready-made alternative if Loop’s preseason inconsistency carries over, so the position is no longer quite as settled as it looked early in camp."
    sources:
      - "BaltimoreRavens.com"
      - "ESPN/NFL.com"
  - title: "Keeping Nnamdi Madubuike on the active roster is an encouraging recovery signal"
    text: "The Ravens could have placed Madubuike on injured reserve and guaranteed a four-game absence, but instead preserved the possibility of an earlier return as he continues progressing from neck surgery. His Week 1 availability is still uncertain, but the roster decision suggests Baltimore believes he is relatively close."
    sources:
      - "BaltimoreRavens.com"
      - "The Baltimore Banner"
  - title: "The Ravens still have not officially settled the center job"
    text: "Jovaughn Gwyn finished camp with the first-team offense and remains the apparent favorite after Danny Pinter’s season-ending injury, but Minter continues to characterize the competition with veteran Ethan Pocic as open. The evidence points toward Gwyn starting in Indianapolis unless Pocic makes a late push over the next two weeks."
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Joe Fagnano played his way onto the 53-man roster"
    text: "ESPN’s Jeremy Fowler reported that Baltimore is keeping the undrafted rookie as a third quarterback after he completed 56 of 75 passes for 509 yards, three touchdowns and one interception in the preseason. That is a meaningful roster choice for a team that usually prefers to use the spot elsewhere, but Fagnano made exposing him to waivers too risky."
    sources:
      - "ESPN"
  - title: "Ethan Burke is the other undrafted rookie who forced Baltimore’s hand"
    text: "The former Texas edge defender made the initial 53 after producing a sack, two forced fumbles, two pass breakups and two quarterback hits during the preseason. His length, special-teams potential and ability to affect plays without needing a featured pass-rush role separated him in one of the deepest competitions on the roster."
    sources:
      - "The Baltimore Sun"
      - "Ravens Wire"
  - title: "Adisa Isaac is staying in the organization despite losing his roster spot to Ethan Burke"
    text: "Isaac cleared waivers and re-signed to the practice squad along with fellow edge defender Kaimon Rucker. Burke’s combination of pass-rush flashes and special-teams value won the immediate job, but keeping Isaac nearby preserves experienced developmental depth at a position Baltimore has spent heavily to improve."
    sources:
      - "BaltimoreRavens.com"
  - title: "Baltimore appears prepared to carry only four safeties on the initial roster"
    text: "Veteran K’Von Wallace was released despite a productive summer and is expected to be a practice-squad candidate, leaving Kyle Hamilton, Malaki Starks, Jaylinn Hawkins and Keondre Jackson as the likely active group. The move creates room elsewhere while keeping a veteran fallback nearby if Wallace returns."
    sources:
      - "The Baltimore Sun"
      - "BaltimoreRavens.com"
