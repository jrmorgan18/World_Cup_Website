      - label: "Ravens · Official injury report"
        url: "https://www.baltimoreravens.com/team/injury-report/"
  - title: "The Ravens listed 19 players on Wednesday’s injury report, including several new concerns following the Atlanta game."
    text: >-
      Matthew Hibner missed practice with a hand injury, while Roger Rosengarten (knee), Emery Jones Jr. (knee), Trenton Simpson (hamstring) and Teddye Buchanan (groin) were among the limited participants. Kyle Hamilton (stinger) and Mark Andrews (hand) practiced fully. The number of players on the report could complicate personnel decisions on both sides of the ball.
    sources:
