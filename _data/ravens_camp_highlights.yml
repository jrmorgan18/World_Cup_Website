date: 2026-08-12
edition: "Wednesday · Aug. 12"
intro: "A daily, source-attributed roundup of Ravens practice reporting."
highlights:
  - title: "Cornerback injuries put Tampa's camp in sharper focus"
    text: "Marlon Humphrey left Wednesday's practice and did not return, one day after Nate Wiggins was carted off with a lower-body injury. Anthony Weaver expects both back soon, but T.J. Tampa's strong summer now carries added importance."
    sources:
      - "BaltimoreRavens.com"
      - "Jeff Zrebiec"
  - title: "Tampa keeps building a starting case"
    text: "Ja'Kobi Lane won a pair of vertical reps, but Tampa also broke up a deep ball to Devontez Walker and has consistently contested throws. Weaver called Tampa's camp tremendous and highlighted his ability to correct mistakes."
    sources:
      - "BaltimoreRavens.com"
  - title: "Madubuike advances his return"
    text: "After working mostly on his own following offseason neck surgery, Nnamdi Madubuike joined a defensive-line positional drill for the first time. Weaver said he looks phenomenal, though Baltimore has not set a timetable for full team work."
    sources:
      - "BaltimoreRavens.com"
  - title: "Passing offense still searching for rhythm"
    text: "The first-team offense struggled to generate separation and Tavius Robinson earned a free simulated sack. Mark Andrews stood out, however, with several productive short-yardage and red-zone plays."
    sources:
      - "BaltimoreRavens.com"
  - title: "Backup quarterback competition shifts"
    text: "Skylar Thompson is headed to injured reserve, and Baltimore signed former Bears quarterback Austin Reed after working out four passers. The move gives Declan Doyle a familiar option behind Lamar Jackson and Tyler Huntley while opening more room for Joey Fagnano."
    sources:
      - "Baltimore Beatdown"
      - "BaltimoreRavens.com"
  - title: "Center job remains open before the preseason opener"
    text: "Danny Pinter has handled much of the first-team work, but Doyle said Baltimore is still a ways away from choosing a starter. He wants Ethan Pocic to have a fair opportunity and is prioritizing communication and line organization in the evaluation."
    sources:
      - "BaltimoreRavens.com"
