date: 2026-10-10
edition: "October 10, 2026"
kicker: "Week 5 · Atlanta"
heading: "Ravens Daily"
intro: "Saturday's final updates added offensive-line depth for the Ravens and clarified Atlanta's availability ahead of Sunday night."
highlights:
  - title: "Atlanta ruled out leading pass rusher Za'Darius Smith on Saturday, giving Tyler Huntley and the Ravens' battered offensive line a welcome break."
    text: >-
      Smith, who leads the Falcons with 2.5 sacks, was downgraded from questionable because of a concussion/neck injury. With fellow edge defender Samson Ebukam also questionable, Atlanta elevated Bralen Trice and Drake Jackson from its practice squad.
    sources:
      - "Falcons Wire"
      - "AtlantaFalcons.com"
    source_links:
      - label: "Falcons Wire · Saturday update"
        url: "https://sports.yahoo.com/articles/falcons-rule-key-edge-rusher-205032974.html"
      - label: "Falcons transactions"
        url: "https://www.atlantafalcons.com/team/transactions/2026"
  - title: "The Ravens elevated offensive linemen Chuma Edoga and Kyle Hergel for Sunday night's game, reinforcing a unit still dealing with considerable injury uncertainty."
    text: >-
      Starting guard Andrew Vorhees remains questionable with a foot injury, while newly acquired center Cam Jurgens is unavailable. Edoga brings 25 career starts and experience at tackle and guard, while Hergel provides interior depth behind Vega Ioane, John Simpson and potentially Emery Jones Jr.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Ravens · Edoga and Hergel elevated"
        url: "https://www.baltimoreravens.com/news/ravens-practice-squad-elevations-kyle-hergel-chuma-edoga-falcons"
      - label: "Ravens injury report"
        url: "https://www.baltimoreravens.com/team/injury-report/"
  - title: "Atlanta placed linebacker Yasir Abdullah on injured reserve, further reducing its defensive depth ahead of Sunday's matchup."
    text: >-
      Abdullah had already been ruled out with a hamstring injury, but Saturday's transaction confirms an absence of at least four games. The Falcons signed defensive back Jammie Robinson to the active roster in the corresponding move, giving them additional secondary and special-teams depth.
    sources:
      - "AtlantaFalcons.com"
    source_links:
      - label: "Falcons · Abdullah placed on IR"
        url: "https://www.atlantafalcons.com/news/falcons-place-yasir-abdullah-on-ir-sign-jammie-robinson"
