date: 2026-09-19
edition: "September 19, 2026"
kicker: "Week 2 preparation"
heading: "Ravens Daily"
intro: "The final injury news and roster decisions shaping the Ravens' home opener against New Orleans."
highlights:
  - title: "Zay Flowers is officially out for Sunday’s home opener against New Orleans"
    text: >-
      Baltimore downgraded Flowers from doubtful Saturday afternoon after he managed only a limited Friday practice, removing the player who produced 150 receiving yards in the first half of Week 1. Rashod Bateman moves into the No. 1 role, with Devontez Walker set to return and LaJohntay Wester, Chris Moore and Elijah Sarratt filling out a suddenly much different receiver rotation.
    sources:
      - "BaltimoreRavens.com"
      - "Reuters"
  - title: "T.J. Tampa is going to injured reserve with his knee injury"
    text: >-
      The third-year corner will now miss at least four games after being injured in Indianapolis, turning what Jesse Minter initially described as potentially “a little bit of time” into a more significant absence. The Ravens still have Nate Wiggins, Marlon Humphrey and Chidobe Awuzie atop the depth chart, but Tampa’s absence removes useful outside-corner and special-teams depth.
    sources:
      - "BaltimoreRavens.com"
  - title: "The Ravens promoted Carl Jones Jr. to the 53-man roster with Teddye Buchanan still unavailable"
    text: >-
      Jones played 19 special-teams snaps after being elevated for Week 1 and now gets a permanent roster spot while Teddye Buchanan continues his return from last year’s knee injury. Trenton Simpson remains in line to start beside Roquan Smith against the Saints.
    sources:
      - "BaltimoreRavens.com"
  - title: "The Ravens elevated OT Gerad Lichtenhan, another indication that Ronnie Stanley’s status is a real game-day concern"
    text: >-
      The move is another indication that Ronnie Stanley’s status is a real game-day concern. Stanley and left guard John Simpson are both questionable after missing Wednesday and Thursday before returning on a limited basis Friday. If Stanley cannot play, second-year tackle Carson Vinson would be in line for his first NFL start protecting Lamar Jackson’s blind side.
    sources:
      - "BaltimoreRavens.com"
  - title: "New Orleans’ two biggest questionable players made the trip to Baltimore"
    text: >-
      New Orleans’ two biggest questionable players, WR Chris Olave (hamstring) and edge rusher Chase Young (calf), traveled with the Saints, keeping both in play for Sunday. New Orleans also elevated WR Kevin Austin Jr., although that move is not necessarily an indication of Olave’s status because the Saints carried only four receivers on the active roster.
    sources:
      - "NewOrleans.Football via LouisianaSports.net"
