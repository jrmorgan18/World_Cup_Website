date: 2026-09-15
edition: "September 15, 2026"
kicker: "Week 2 preparation"
heading: "Ravens Daily"
intro: "The roster moves and health questions shaping the Ravens' Week 2 plan."
highlights:
  - title: "Lane is headed for wrist surgery and a roughly month-long absence"
    text: >-
      Ja’Kobi Lane is expected to undergo wrist surgery and miss roughly a month. CBS Sports’ Matt Zenitz reported Tuesday that the promising rookie could have surgery as soon as Wednesday, with Baltimore hopeful he can return in about four weeks. That makes Lane a real short-term loss rather than a week-to-week question and puts more pressure on the Ravens’ receiver depth while Zay Flowers manages his hamstring.
    sources:
      - "CBS Sports/Matt Zenitz"
  - title: "The Ravens add Gage Larvadain to the practice squad"
    text: >-
      The Ravens added WR Gage Larvadain to the practice squad as their first response to the injuries. Larvadain appeared in 13 games for Cleveland last season, catching seven passes and serving as its primary punt returner; Baltimore also worked out Dante Pettis, Shedrick Jackson and Octavian Smith Jr. before making the move. With Lane headed for surgery and Flowers day-to-day, the Ravens are clearly fortifying a position that suddenly got thin.
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Jake Moody’s release ends the kicker competition"
    text: >-
      Baltimore released Jake Moody, effectively ending the kicker competition after one regular-season game. Tyler Loop followed his shaky preseason by drilling kicks from 57 and 45 yards in Indianapolis, and the Ravens were comfortable enough with that response to use Moody’s practice-squad spot on Larvadain. For now, Loop has the job without a veteran looking over his shoulder.
    sources:
      - "The Baltimore Banner"
      - "ESPN"
      - "BaltimoreRavens.com"
  - title: "Walker could return at the right time"
    text: >-
      Devontez Walker has a chance to return against New Orleans, which would come at an ideal time. Walker missed the opener with a groin injury, but Baltimore indicated Tuesday that he could be available this week; if Flowers is limited or held out, Walker and Rashod Bateman become considerably more important pieces of the passing game. The first real indication should come with Wednesday’s practice report.
    sources:
      - "BaltimoreRavens.com"
