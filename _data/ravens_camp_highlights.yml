date: 2026-10-04
edition: "October 4, 2026"
kicker: "Week 4 · Tennessee"
heading: "Ravens Daily"
intro: "The Ravens survived Tennessee 24-18, but the win came with a serious injury bill and several issues that will follow them into Week 5."
highlights:
  - title: "Lamar Jackson’s left ankle is now the Ravens’ biggest concern, although the early news is relatively encouraging."
    text: >-
      Jackson was injured on a sack just before halftime of Baltimore’s 24-18 win over Tennessee and did not return; he left the stadium in a protective boot, but NFL Network reported that he is believed to be day-to-day. Jesse Minter said there were discussions about putting Jackson back into the game, another indication that Baltimore may have been exercising caution with a 24-7 halftime lead.
    sources:
      - "BaltimoreRavens.com"
      - "Reuters"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/lamar-jackson-ankle-injury-ravens-titans-tyler-huntley"
  - title: "The Ravens lost three other starters, turning a routine-looking win into a potentially expensive afternoon."
    text: >-
      Marlon Humphrey left with a calf injury, Andrew Vorhees with a foot injury and Durham Smythe with an Achilles injury; none returned, and Minter had no immediate timetable for any of them. Vorhees’ injury is especially problematic for an offensive line already playing without its top three centers.
    sources:
      - "BaltimoreRavens.com"
      - "Reuters"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/ravens-injuries-durham-smythe-marlon-humphrey-andrew-vorhees-achilles-calf-sidelined"
  - title: "Vega Ioane’s first start at center went considerably better than anyone had a right to expect."
    text: >-
      The rookie handled a wet football, two quarterbacks and a matchup with three-time All-Pro Jeffery Simmons without an obvious snapping or protection disaster; Simmons finished without a sack, and Baltimore’s own review credited Ioane with holding up well throughout the afternoon. The center crisis is not solved after one game, but the emergency option looked viable.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/vega-ioane-first-start-center-ravens-titans-rookie"
  - title: "Baltimore’s offense disappeared after Jackson left."
    text: >-
      The Ravens scored 24 points before halftime but were shut out after the break, with four punts and a missed field goal on their five second-half possessions. Tyler Huntley was efficient, completing 8 of 9 passes, but Baltimore became considerably more conservative and never recreated the explosive offense that Jackson had directed to a 24-7 lead.
    sources:
      - "BaltimoreRavens.com"
      - "Reuters"
    source_links:
      - label: "Game recap"
        url: "https://www.baltimoreravens.com/news/game-recap-ravens-titans-week-4-game-recap-injuries-lamar-jackson"
  - title: "The penalty problem somehow got worse."
    text: >-
      Baltimore committed 13 penalties for 131 yards, pushing a problem Jesse Minter has emphasized repeatedly into legitimate early-season concern. Minter called the total “unacceptable” afterward and acknowledged that the Ravens continue to make games more difficult by getting in their own way.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "The Breakdown"
        url: "https://www.baltimoreravens.com/news/ravens-injuries-titans-breakdown-lamar-jackson-marlon-humphrey-2026"
  - title: "Zay Flowers looks fully past the hamstring problem."
    text: >-
      Flowers caught eight passes for 118 yards and a touchdown while playing a normal offensive role, with no reported setback after his workload had been carefully managed the previous week in Brazil. With Jackson’s availability suddenly uncertain, having Flowers back at full capacity becomes even more valuable.
    sources:
      - "Reuters"
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/game-recap-ravens-titans-week-4-game-recap-injuries-lamar-jackson"
  - title: "Tyler Loop showed off absurd range, then reminded everyone why kicker evaluation cannot revolve around one highlight."
    text: >-
      His 64-yard field goal was the longest ever made at M&T Bank Stadium, but he later missed from 40 yards as Tennessee climbed back into the game. The leg strength is beyond question. The week-to-week consistency still needs to follow.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/tyler-loop-history-longest-field-goal-mt-bank-stadium-ravens-titans"
