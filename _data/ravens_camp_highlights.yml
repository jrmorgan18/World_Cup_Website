date: 2026-09-14
edition: "September 14, 2026"
kicker: "Week 1 final"
heading: "Ravens Daily"
intro: "The numbers and health questions that matter after Baltimore's 41-23 opening win in Indianapolis."
highlights:
  - title: "Flowers is day-to-day, with cautious optimism for Week 2"
    text: >-
      Zay Flowers is day-to-day, and Baltimore sounds cautiously optimistic about Week 2. Jesse Minter said Monday he feels “pretty good” about Flowers’ hamstring after the receiver left Sunday’s win, though the Ravens are conscious of avoiding a season-long recurrence after the same hamstring cost him time in camp. Flowers’ practice progression this week will determine whether Baltimore gets its most explosive receiver against New Orleans.
    sources:
      - "BaltimoreRavens.com"
      - "ESPN"
  - title: "Lane’s wrist injury is the more serious concern"
    text: >-
      Ja’Kobi Lane’s wrist injury is the more serious concern and could cost him multiple games. Minter said Lane “may be a little bit longer,” while subsequent reporting indicated an initial diagnosis of a fractured wrist with additional imaging underway; injured reserve is a possibility. Losing Lane would thin a receiver group that was already without Devontez Walker in Week 1.
    sources:
      - "BaltimoreRavens.com"
      - "Reuters"
  - title: "The Ravens are considering adding a veteran receiver"
    text: >-
      Minter acknowledged Baltimore could look outside the building as it sorts through Flowers, Lane and Walker, although he also expressed confidence in Walker and rookie Elijah Sarratt as internal options. With Rashod Bateman, LaJohntay Wester and Chris Moore the healthy Week 1 finishers, this is now a position worth watching for a transaction.
    sources:
      - "Reuters"
      - "BaltimoreRavens.com"
  - title: "Hendrickson immediately changes the pass rush"
    text: >-
      Baltimore’s Week 1 tape offered encouraging evidence that Trey Hendrickson immediately changes the pass rush. Hendrickson did not record a sack, but he generated eight pressures and repeatedly beat Colts left tackle Bernhard Raimann. That kind of disruption is exactly what the Ravens paid for after last year’s pass-rush problems, and it came with Nnamdi Madubuike still unavailable.
    sources:
      - "BaltimoreRavens.com"
