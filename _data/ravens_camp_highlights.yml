date: 2026-08-15
edition: "Saturday · Aug. 15"
kicker: "Preseason opener"
heading: "Game Highlights"
intro: "A source-attributed roundup from Baltimore’s 24–7 preseason win over Philadelphia."
highlights:
  - title: "The defense set the tone from the opening whistle"
    text: "Baltimore held Philadelphia to six first downs, 159 total yards and an 0-for-9 mark on third down in a 24–7 win. Preseason opponent context matters, but the volume of three-and-outs was an encouraging first on-field sign for Jesse Minter’s aggressive defense."
    sources:
      - "NFL.com"
  - title: "Joe Fagnano made the strongest backup-quarterback statement"
    text: "The undrafted rookie completed 22 of 28 passes for 224 yards, a touchdown and an interception. With Skylar Thompson on injured reserve, Fagnano’s efficient night gave Baltimore a real data point in the competition behind Lamar Jackson and Tyler Huntley."
    sources:
      - "NFL.com"
  - title: "Ja’Kobi Lane carried his camp momentum into a game"
    text: "Lane caught three passes for 38 yards and scored Baltimore’s first touchdown on a 16-yard connection with Fagnano. One preseason score does not settle his role, but the third-round rookie again converted attention into production."
    sources:
      - "NFL.com"
  - title: "The rookie pass-catching depth showed up, too"
    text: "Elijah Sarratt led Baltimore with six catches for 66 yards, while tight end Matthew Hibner added five for 61. Alongside Lane, the production gave the Ravens a useful early read on a young group competing for limited offensive snaps."
    sources:
      - "NFL.com"
  - title: "Baltimore’s depth backs finished drives on the ground"
    text: "The Ravens ran 36 times for 142 yards. Adam Randall turned 12 carries into 46 yards and a 4-yard touchdown, while Austin Reed added a 14-yard scoring run in the fourth quarter."
    sources:
      - "NFL.com"
  - title: "Tyler Loop had a useful, imperfect first game test"
    text: "Loop missed a 49-yard field goal but made from 42 yards and converted all three extra points. After his spotless late-camp practice streak, the mixed night is a reminder that the preseason is where a kicker’s process gets tested under a different kind of pressure."
    sources:
      - "NFL.com"
