date: 2026-09-25
edition: "September 25, 2026"
kicker: "Week 3 · Dallas"
heading: "Ravens Daily"
intro: "The final injury picture, looming returns and Rio field concerns ahead of Baltimore’s Week 3 matchup with Dallas."
highlights:
  - title: "Ronnie Stanley is out against Dallas, putting Carson Vinson in line for his first NFL start"
    text: >-
      Stanley never practiced this week after aggravating his toe against New Orleans, and Baltimore ruled him out Friday in Rio. Vinson held up in relief last week, but protecting Lamar Jackson for four quarters is a much bigger assignment — and the most consequential confirmed absence on Baltimore’s side.
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Nnamdi Madubuike is poised to make his long-awaited return"
    text: >-
      Madubuike practiced fully all week and carries no game designation, putting him on track for his first appearance since the neck injury that ended his 2025 season and eventually required surgery. His interior pass rush could materially change a Ravens front that has generated pressure but struggled to finish plays consistently.
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Zay Flowers is officially questionable after returning to practice"
    text: >-
      Flowers was limited in Friday’s walkthrough after missing Wednesday and Thursday, and Jesse Minter said he has a “real opportunity” to play. It is encouraging but not definitive: Flowers followed essentially the same late-week pattern before being held out against New Orleans.
    sources:
      - "BaltimoreRavens.com"
      - "The Baltimore Banner"
  - title: "Teddye Buchanan is set up to make his season debut"
    text: >-
      Buchanan practiced fully all week and has no injury designation after completing his recovery from the knee injury that ended his rookie season. He could give Jesse Minter another starting-caliber linebacker against Dallas. Trenton Simpson has played well enough that Baltimore can rotate Buchanan in rather than immediately handing his old workload back.
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Trey Hendrickson is good to go despite the broken finger he has been playing through"
    text: >-
      Hendrickson progressed to full participation Friday and carries no game designation, removing another concern for a defense preparing for Dak Prescott and one of the league’s more productive passing attacks. Pairing Hendrickson with Madubuike for the first time would give Baltimore its most complete pass-rush group of the season.
    sources:
      - "BaltimoreRavens.com"
      - "NBC Sports"
  - title: "Maracanã field concerns sharpen as the NFLPA calls for more traction and stability work"
    text: >-
      Union executive director JC Tretter said league and union experts recommended reinforced stitching and will continue evaluating the grass through kickoff; the Ravens will get their first look at the stadium Saturday. Minter said Baltimore has prepared multiple footwear options and plans to adapt rather than alter its approach to the game.
    sources:
      - "The Baltimore Banner"
      - "NFLPA"
      - "BaltimoreRavens.com"
  - title: "Dallas will be missing four defensive starters, changing the matchup for Baltimore’s offense"
    text: >-
      Linebacker DeMarvion Overshown, cornerback Cobie Durant and safeties Malik Hooker and P.J. Locke were ruled out and did not travel to Brazil. Even if Flowers cannot return, that is a depleted Cowboys back seven for Jackson and Declan Doyle to attack as Baltimore tries to avoid falling to 1–2.
    sources:
      - "The Baltimore Banner"
