date: 2026-09-07
edition: "September 7, 2026"
kicker: "Week 1 briefing"
heading: "Ravens Daily"
intro: "The center decision, an opening-week health watch and the Indianapolis matchup heading into Week 1."
highlights:
  - title: "Jovaughn Gwyn has won the starting center job"
    text: "Jesse Minter announced that Gwyn will start Week 1 against Indianapolis, completing a competition that changed dramatically when Danny Pinter suffered a season-ending knee injury. Gwyn has never started an NFL game, so Baltimore will open the season with new starters at all three interior offensive-line spots — easily the biggest personnel question facing an otherwise loaded offense."
    sources:
      - "BaltimoreRavens.com"
  - title: "Nnamdi Madubuike has a legitimate chance to play in the opener"
    text: "Minter would not rule him out Monday and said Madubuike will participate in team work this week as Baltimore determines whether he is ready for game action for the first time since September 2025. Even limited snaps would materially change a defensive front that added Trey Hendrickson and Calais Campbell while Madubuike was rehabbing his neck injury."
    sources:
      - "BaltimoreRavens.com"
  - title: "Teddye Buchanan is also still alive for Week 1"
    text: "Minter grouped Buchanan with Madubuike among the injured players Baltimore will evaluate throughout the week and declined to rule either out. The Ravens don't need to force Buchanan back after Trenton Simpson's strong summer, but his availability would give the defense considerably more flexibility at inside linebacker."
    sources:
      - "BaltimoreRavens.com"
  - title: "Tyler Loop appears to have responded exactly as Baltimore hoped to the Jake Moody signing"
    text: "Minter said Loop has not missed a kick since the Ravens added Moody to the practice squad following Loop's 5-for-8 preseason. Loop remains the Week 1 kicker, but Moody's presence gives Baltimore an unusually credible fallback if the rookie's game-day inconsistency resurfaces."
    sources:
      - "BaltimoreRavens.com"
  - title: "Indianapolis' biggest downfield weapon is expected back against Baltimore"
    text: "Colts coach Shane Steichen said Alec Pierce is on track to play after offseason ankle surgery; Pierce topped 1,000 yards last season and has led the NFL in yards per catch in consecutive years. With Daniel Jones also returning from his torn Achilles, Minter said he expects Baltimore to see a healthy, potentially sharp version of the Colts quarterback rather than treating his layoff as an advantage."
    sources:
      - "BaltimoreRavens.com"
      - "Reuters"
