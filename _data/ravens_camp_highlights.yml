date: 2026-08-22
edition: "Saturday · Aug. 22"
kicker: "Training camp"
heading: "Camp Highlights"
intro: "A source-attributed roundup from Saturday’s Ravens Training Camp Daily, covering the 13-3 preseason win over Minnesota."
highlights:
  - title: "The defensive depth continues to look like a real strength"
    text: "Baltimore beat Minnesota 13-3 on Saturday, recording five sacks and two fourth-quarter takeaways while holding the Vikings without a touchdown. The starters had already dominated Minnesota during two joint practices, and now the second and third units have helped the Ravens allow just 10 points through two preseason games."
    sources:
      - "BaltimoreRavens.com"
      - "WBAL-TV"
  - title: "Ethan Burke made perhaps the strongest roster statement of the afternoon"
    text: "The edge defender had a sack, forced fumble, two pass breakups and two quarterback hits, showing considerably more than straight-line pass-rush ability. In a deep outside-linebacker room, that kind of special-teams-and-defense versatility is exactly what can secure one of the final roster spots."
    sources:
      - "BaltimoreRavens.com"
      - "Baltimore Beatdown"
  - title: "Mike Green responded well after a relatively quiet preseason opener"
    text: "Green sacked J.J. McCarthy and was part of a young front that repeatedly disrupted Minnesota’s quarterbacks. With Baltimore needing more reliable pressure beyond Trey Hendrickson, Green turning his camp flashes into preseason production is a more meaningful development than the sack itself."
    sources:
      - "BaltimoreRavens.com"
      - "Baltimore Beatdown"
  - title: "Joe Fagnano strengthened his case for a roster spot with another composed performance"
    text: "The undrafted rookie completed 15 of 20 passes for 123 yards and a touchdown without a turnover, giving him 327 passing yards and two touchdowns through two preseason games. Tyler Huntley remains the clear backup to Lamar Jackson, but Fagnano is making it increasingly difficult to expose him to waivers and hope he reaches the practice squad."
    sources:
      - "BaltimoreRavens.com"
  - title: "The center competition remains unresolved after its first game without Danny Pinter"
    text: "Jovaughn Gwyn started, while veteran Ethan Pocic also received work as Baltimore evaluates its options following Pinter’s serious knee injury. Local postgame analysis did not identify either player as clearly separating, which means this remains the most consequential unsettled starting job on the roster."
    sources:
      - "BaltimoreRavens.com"
      - "Baltimore Beatdown"
  - title: "Vega Ioane had a bumpier second preseason game"
    text: "After a strong debut and encouraging joint practices, the first-round right guard drew criticism for penalties and missed assignments against Minnesota. There is no reason to turn one August game into a larger concern, but it was a useful reminder that even if Ioane is essentially penciled into the lineup, the rookie portion of his development is not finished."
    sources:
      - "Baltimore Beatdown"
  - title: "Tyler Loop answered his first preseason miss cleanly"
    text: "After pushing a 49-yarder wide against Philadelphia, Loop hit from the same distance Saturday and added another field goal in the 13-3 win. Combined with his excellent camp work, including a 6-for-6 session Thursday, there is still little evidence that Baltimore needs to manufacture a kicking competition."
    sources:
      - "BaltimoreRavens.com"
