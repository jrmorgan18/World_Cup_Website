date: '2026-11-28'
edition: November 28, 2026
kicker: Week 12 · Texans preparation
heading: Ravens Daily
intro: The Ravens prepare for Houston with Vega Ioane, Nnamdi Madubuike and Jaylinn Hawkins ruled out, Marlon Humphrey returning and several availability questions still unresolved.
highlights:
- title: Vega Ioane has been ruled out against Houston after suffering a hand injury during Thursday's practice.
  text: Jesse Minter does not anticipate a lengthy absence, with Baltimore's bye coming next week. Emery Jones Jr. and Ryan Neuzil are candidates to replace Ioane, disrupting an offensive line that finally showed signs of improvement against Carolina.
  sources:
  - BaltimoreRavens.com/Ryan Mink
  - Jesse Minter
  source_links:
  - label: Ravens injury report
    url: https://www.baltimoreravens.com/news/injury-report-ravens-texans-vega-ioane-nnamdi-madubuike-2026
- title: Marlon Humphrey will play Sunday following his disciplinary deactivation last week, Minter confirmed Friday.
  text: His role remains uncertain after T.J. Tampa earned increased playing time with his performance against Carolina. ESPN's Jamison Hensley also observed Humphrey warming up alongside special-teams players Friday, something he hadn't done previously this season.
  sources:
  - BaltimoreRavens.com
  - ESPN/Jamison Hensley
  source_links:
  - label: News & Notes
    url: https://www.baltimoreravens.com/news/marlon-humphrey-ravens-texans-will-anderson-roger-rosengarten-week-12-2026
- title: Nnamdi Madubuike and Jaylinn Hawkins have officially been ruled out against Houston.
  text: Madubuike will miss his second consecutive game with a hamstring injury, while Hawkins will miss his sixth straight with a knee injury. Baltimore's defensive front remains particularly vulnerable without its premier interior disruptor.
  sources:
  - Jesse Minter
  - BaltimoreRavens.com
  source_links:
  - label: Ravens injury report
    url: https://www.baltimoreravens.com/news/injury-report-ravens-texans-vega-ioane-nnamdi-madubuike-2026
- title: Derrick Henry remains questionable as he works toward final concussion-protocol clearance, while cornerback Chidobe Awuzie is questionable with a back injury.
  text: Henry's return to full practice Thursday and Minter's previously expressed optimism remain encouraging, but his availability is not yet guaranteed.
  sources:
  - ClutchPoints
  - Week 12 injury report
- title: Houston will regain running back Woody Marks and wide receiver Marvin Harrison Jr. on Sunday.
  text: Marks has recovered from a concussion, while Harrison returns from a hamstring injury that sidelined him for two games. However, starting left guard Keylan Rutledge and receiver Kayshon Boutte have been ruled out, and standout edge rusher Danielle Hunter has not practiced all week.
  sources:
  - Houston Chronicle
  - Aaron Wilson
  source_links:
  - label: Houston availability update
    url: https://sports.yahoo.com/nfl/articles/houston-texans-welcome-back-woody-225310830.html
- title: The Ravens have settled on a punt-return plan following LaJohntay Wester's release, but Minter declined to identify the replacement Friday.
  text: Malaki Starks handled the assignment during the second half against Carolina, although Baltimore has not publicly committed to him moving forward.
  sources:
  - Jesse Minter
  - BaltimoreRavens.com
