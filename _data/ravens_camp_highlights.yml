date: 2026-09-11
edition: "September 11, 2026"
kicker: "Week 1 injury report"
heading: "Ravens Daily"
intro: "The final injury picture for Baltimore's season opener against Indianapolis."
highlights:
  - title: "Nnamdi Madubuike will not play in Sunday’s opener"
    text: "Jesse Minter ruled him out Friday despite saying the Pro Bowl defensive tackle is ‘really, really close’ after two weeks of contact-heavy team work. Baltimore is still taking the long view with his return from last year’s neck injury, so Broderick Washington Jr. and the rest of the interior rotation will have to cover his snaps against Indianapolis."
    sources:
      - "BaltimoreRavens.com"
  - title: "Teddye Buchanan is also out, putting Trenton Simpson in line to start next to Roquan Smith"
    text: "Buchanan was limited all week as he works back from the knee injury that ended his 2025 season, and Baltimore has only three healthy inside linebackers on the 53-man roster. A practice-squad elevation for Carl Jones Jr. is therefore a realistic possibility before Sunday."
    sources:
      - "BaltimoreRavens.com"
      - "NBC Sports"
  - title: "Zay Flowers is fully cleared for Week 1"
    text: "Flowers practiced fully Thursday and Friday and carries no game designation after spending much of the late summer managing a hamstring issue. That removes the biggest offensive injury concern heading into the debut of Declan Doyle’s system."
    sources:
      - "BaltimoreRavens.com"
  - title: "Devontez Walker is the remaining notable Ravens injury question"
    text: "Walker was limited throughout the week with a groin injury and is officially questionable; if he cannot go, rookie Elijah Sarratt could see more work behind Zay Flowers, Rashod Bateman and Ja’Kobi Lane."
    sources:
      - "BaltimoreRavens.com"
      - "ESPN/Jamison Hensley"
  - title: "Indianapolis will have Alec Pierce, though possibly on a restricted workload"
    text: "The Colts’ top vertical threat was limited all week after offseason ankle surgery but has been cleared to play. Baltimore’s secondary therefore still has to account for the field-stretching element Pierce brings, even if Indianapolis manages his snaps."
    sources:
      - "BaltimoreRavens.com"
