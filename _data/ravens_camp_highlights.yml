date: "2026-11-08"
edition: "November 8, 2026"
kicker: "Week 9 · Looking Ahead"
heading: "Ravens Daily"
intro: "Baltimore enters an extended break at 4-5, with Jacoby Brissett expected to make his Ravens debut against the Chargers and Lamar Jackson hoping to return later this season."
highlights:
  - title: "The Ravens are not expected to trade Derrick Henry before Tuesday's deadline."
    text: >-
      ESPN's Adam Schefter reported that Baltimore told Henry it has no intention of moving him and never seriously considered a deal. The Ravens are keeping the veteran back as they try to stay in the playoff race after four straight losses.
    sources:
      - "ESPN/Adam Schefter"
      - "NFL.com"
    source_links:
      - label: "ESPN report"
        url: "https://www.espn.com/nfl/story/_/id/50400748/sources-ravens-not-expected-trade-star-rb-derrick-henry"
      - label: "NFL.com report"
        url: "https://www.nfl.com/news/report-ravens-not-expected-to-trade-rb-derrick-henry-before-nov-10-deadline"
  - title: "The Giants have inquired about Justice Hill ahead of the trade deadline."
    text: >-
      ESPN's reporting identifies Hill, not Henry, as the Ravens running back New York called about. No deal has been reported, and Baltimore's willingness to move Hill remains unknown. John Harbaugh coached Hill throughout his Ravens career, making the connection an understandable one to watch.
    sources:
      - "ESPN/Adam Schefter"
      - "BaltimoreRavens.com"
    source_links:
      - label: "Ravens trade-deadline roundup"
        url: "https://www.baltimoreravens.com/news/ravens-trade-deadline-buyers-sellers-derrick-henry-justice-hill-jacoby-brissett-playoff-chances"
      - label: "Giants Wire report"
        url: "https://staging-aws.sports.yahoo.com/articles/report-york-giants-inquired-ravens-132524070.html"
  - title: "The Ravens waived Austin Reed to make room for Jacoby Brissett on the 53-man roster."
    text: >-
      Reed backed up Joe Fagnano against Jacksonville but did not play. Brissett is expected to make his Baltimore debut against the Chargers on November 16, while Fagnano and Kedon Slovis remain on the roster.
    sources:
      - "BaltimoreRavens.com/Ryan Mink"
    source_links:
      - label: "Ravens roster move"
        url: "https://www.baltimoreravens.com/news/ravens-austin-reed-jacoby-brissett-waive-quarterback"
  - title: "The extended break gives Brissett time to prepare for his expected first start with Baltimore."
    text: >-
      After Thursday's 33-10 loss, the Ravens' next game is Monday night, November 16, against the Chargers. The 11-day gap gives Brissett time to learn Declan Doyle's offense, but how much of the playbook he can absorb before his debut remains an open question.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Ravens roster move"
        url: "https://www.baltimoreravens.com/news/ravens-austin-reed-jacoby-brissett-waive-quarterback"
      - label: "Cardinals trade announcement"
        url: "https://www.azcardinals.com/news/jacoby-brissett-trade-to-ravens-becomes-official"
  - title: "Lamar Jackson intends to return this season while recovering from a fractured, dislocated thumb."
    text: >-
      NFL Network's Ian Rapoport reported a six-to-nine-week recovery estimate and said Jackson told teammates he plans to return. That range could put him back as early as the December 20 game in Pittsburgh or as late as the Week 18 game on January 9 or 10; his return depends on recovery and medical clearance. Baltimore did not play Sunday, and Jackson's report was the only new confirmed team development that day.
    sources:
      - "NFL Network/Ian Rapoport"
      - "BaltimoreRavens.com"
      - "NBC Sports"
