date: 2026-10-03
edition: "October 3, 2026"
kicker: "Week 4 · Tennessee"
heading: "Ravens Daily"
intro: "The Ravens put Jovaughn Gwyn and Ethan Pocic on injured reserve Saturday, setting up Vega Ioane for his first start at center. Ronnie Stanley and Zay Flowers remain questionable for Sunday."
highlights:
  - title: "The Ravens officially placed centers Jovaughn Gwyn and Ethan Pocic on injured reserve Saturday, confirming that the offensive-line upheaval will extend well beyond the Titans game."
    text: >-
      They join Danny Pinter as the third Baltimore center to hit IR this season, leaving first-round rookie Vega Ioane slated to make his first start at center Sunday. Jesse Minter has described both injuries as long-term.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/jovaughn-gwyn-ethan-pocic-injured-reserve-kyle-hergel-ravens-titans?utm_source=chatgpt.com"
  - title: "Baltimore elevated guard Kyle Hergel from the practice squad for Sunday, providing immediate insurance for the reshuffled interior line."
    text: >-
      Hergel, signed this week after spending last season with Declan Doyle in Chicago, has only 45 career offensive snaps but can provide depth behind a group expected to feature Ioane at center and Andrew Vorhees back at right guard. Veteran center Andre James was not elevated as he continues working back from a high ankle sprain and learning Baltimore's offense.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/jovaughn-gwyn-ethan-pocic-injured-reserve-kyle-hergel-ravens-titans?utm_source=chatgpt.com"
  - title: "Ronnie Stanley remains the biggest game-day decision after Baltimore made no further announcement on his questionable status Saturday."
    text: >-
      Stanley practiced on a limited basis Wednesday and Thursday before receiving a rest day Friday, and Minter said he was encouraged by how the left tackle looked in those two sessions. Carson Vinson would make a second straight start if Stanley's toe isn't ready.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/injury-report-ravens-titans-trey-hendrickson-ronnie-stanley-zay-flowers-lamar-jackson-2026?utm_source=chatgpt.com"
  - title: "Zay Flowers likewise remains questionable, although the week's evidence points toward him playing and carrying a larger workload."
    text: >-
      Flowers reached full participation Thursday and said the hamstring issue feels behind him before receiving a rest-related limitation Friday. After producing 84 yards on just 21 snaps in Dallas, getting Flowers closer to full-time would give Baltimore an important pressure-release option against a Tennessee front led by Jeffery Simmons.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/injury-report-ravens-titans-trey-hendrickson-ronnie-stanley-zay-flowers-lamar-jackson-2026?utm_source=chatgpt.com"
  - title: "Baltimore's plan without Trey Hendrickson is coming into focus: Mike Green and Ethan Burke should see larger roles, with Tavius Robinson carrying even more pass-rush responsibility."
    text: >-
      Hendrickson is out following a procedure on his broken finger, and Minter expects the absence to be “very, very short term.” Robinson enters Sunday leading the Ravens with two sacks and six quarterback hits, while the undrafted Burke could receive his first regular-season defensive snaps.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/injury-report-ravens-titans-trey-hendrickson-ronnie-stanley-zay-flowers-lamar-jackson-2026?utm_source=chatgpt.com"
  - title: "Lamar Jackson enters Sunday without an injury designation after the back issue that briefly created concern earlier in the week."
    text: >-
      Jackson was limited Wednesday before practicing fully Thursday and Friday, removing any real uncertainty about his availability. With Baltimore breaking in a rookie center against a strong Tennessee interior, Jackson's mobility and communication with Ioane become particularly important.
    sources:
      - "BaltimoreRavens.com"
