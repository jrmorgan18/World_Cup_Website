date: 2026-09-14
edition: "September 14, 2026"
kicker: "Week 1 final"
heading: "Ravens Daily"
intro: "The numbers and health questions that matter after Baltimore's 41-23 opening win in Indianapolis."
highlights:
  - title: "The first Doyle game looked exactly as explosive as advertised"
    text: "Baltimore posted 506 official net yards, scored four touchdowns on its first five drives and generated 10 explosive plays. Lamar Jackson threw for 324 yards, Derrick Henry ran for 144 and three touchdowns, and the Ravens opened 1-0 with a 41-23 road win."
    sources:
      - "BaltimoreRavens.com"
  - title: "The defense found its response after the opening drive"
    text: "Indianapolis opened with a nine-play, 65-yard touchdown drive, then managed only 23 yards across its next four possessions. Baltimore finished with two takeaways and nine quarterback hits while holding the Colts to 251 total net yards."
    sources:
      - "BaltimoreRavens.com"
  - title: "Zay Flowers and Ja’Kobi Lane turned a great day into a real Week 2 concern"
    text: "Flowers set a career high with 150 receiving yards before leaving with a hamstring injury. Lane was ruled out at halftime with a wrist injury, and the initial diagnosis reported after the game was a fractured wrist. No official Week 2 designation has been published for either receiver."
    sources:
      - "BaltimoreRavens.com"
  - title: "Tyler Loop supplied the clean answer Baltimore needed"
    text: "After an uneven preseason, Loop made both field goals—57 and 45 yards—and all five extra points. The 57-yarder was the longest field goal of his career, and the 45-yarder helped finish the game."
    sources:
      - "BaltimoreRavens.com"
  - title: "Week 2 brings New Orleans to Baltimore"
    text: "The Ravens host the Saints in their home opener on September 20. New Orleans opened its season with a 31-30 overtime loss to Detroit, while Baltimore arrives with early top-five marks in both offensive EPA per play and defensive EPA allowed per play."
    sources:
      - "BaltimoreRavens.com"
