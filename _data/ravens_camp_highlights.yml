date: 2026-08-17
edition: "Monday · Aug. 17"
kicker: "Training camp"
heading: "Camp Highlights"
intro: "A source-attributed roundup from Monday’s Ravens practice, ahead of joint work with Minnesota."
highlights:
  - title: "Baltimore’s top corners are back in full team work"
    text: "Nate Wiggins and Marlon Humphrey both returned to full 11-on-11 work after missing most of last week. Their return puts Baltimore’s top cornerbacks back on the field before this week’s joint practices with Minnesota, a more meaningful test than most remaining preseason snaps."
    sources:
      - "BaltimoreRavens.com"
  - title: "Teddye Buchanan made his first practice return"
    text: "Buchanan practiced for the first time since tearing his ACL in December after coming off PUP on Friday. Baltimore plans to ramp him up gradually before full team periods, leaving an intriguing linebacker decision as Trenton Simpson has made a strong case for snaps in Buchanan’s absence."
    sources:
      - "BaltimoreRavens.com"
  - title: "Adisa Isaac is stacking healthy, disruptive practices"
    text: "The third-year outside linebacker generated what would have been two sacks Monday and has put together one of the stronger defensive camps. After injuries disrupted his first two seasons, the important development is that Isaac is sustaining healthy work rather than only flashing in limited opportunities."
    sources:
      - "BaltimoreRavens.com"
  - title: "The starting passing game found its rhythm"
    text: "Lamar Jackson connected with Rashod Bateman for two touchdowns, including a post thrown between two defenders, and Zay Flowers turned a catch over the middle into a long score. With Baltimore’s established offensive stars sitting out Saturday’s preseason opener, the Minnesota practices should offer a clearer read on Declan Doyle’s offense."
    sources:
      - "BaltimoreRavens.com"
  - title: "Jonathan Ward adds temporary backfield depth"
    text: "Baltimore signed the veteran running back while Rasheen Ali works through an injury. Jesse Minter said Ali is not expected to be out for a “crazy” amount of time, pointing to a camp-depth move, but missed work still matters in a crowded competition behind Derrick Henry and Justice Hill."
    sources:
      - "BaltimoreRavens.com"
  - title: "A quiet day still produced two highlight-reel plays"
    text: "Jaylinn Hawkins made a leaping end-zone interception of Joe Fagnano, and rookie tight end Josh Cuevas added a one-handed sideline catch. Otherwise, a relatively uneventful practice was a welcome change after last week’s injury scares before the Ravens face unfamiliar schemes in Minnesota."
    sources:
      - "BaltimoreRavens.com"
