date: 2026-10-17
edition: "October 17, 2026"
kicker: "Week 6 · Cleveland"
heading: "Ravens Daily"
intro: "Tyler Huntley will start again in Cleveland, Trey Hendrickson returns, and the Ravens are monitoring offensive-line depth and Ja'Kobi Lane's availability."
highlights:
  - title: "Lamar Jackson has officially been ruled out for Sunday's AFC North showdown in Cleveland, leaving Tyler Huntley to make his second consecutive start."
    text: >-
      Jackson has not practiced since suffering his ankle injury against Tennessee, and Jesse Minter said the decision was made in the quarterback's best interest. Huntley will try to build on last week's overtime comeback in Atlanta, but Baltimore now faces a divisional opponent without its franchise quarterback for the second straight week.
    sources:
      - "BaltimoreRavens.com"
      - "ESPN"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/lamar-jackson-injury-report-ravens-browns-sidelined-matt-hibner-broderick-washington"
  - title: "Cam Jurgens will not make his Ravens debut Sunday, leaving Baltimore's offensive line unsettled for another week."
    text: >-
      Jurgens remains in concussion protocol, meaning rookie Vega Ioane will start at center for the third consecutive game. Both Andrew Vorhees (foot) and Emery Jones Jr. (ankle) are questionable, creating additional uncertainty at right guard despite Ioane's impressive performance out of position.
    sources:
      - "BaltimoreRavens.com"
      - "Baltimore Beatdown"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/cam-jurgens-concussion-debut-vega-ioane-tyler-huntley-josh-cuevas-2026"
  - title: "Trey Hendrickson is cleared to return against Cleveland after missing two games following finger surgery."
    text: >-
      Hendrickson practiced fully throughout the week and carries no injury designation, giving Baltimore its top edge rusher back against a Browns offensive line that surrendered eight sacks last Sunday. Cleveland quarterback Deshaun Watson has already been sacked a league-high 19 times, making Hendrickson's return particularly well-timed.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/lamar-jackson-injury-report-ravens-browns-sidelined-matt-hibner-broderick-washington"
  - title: "Zay Flowers and Rashod Bateman are cleared to play, while rookie Ja'Kobi Lane could make his return from injured reserve."
    text: >-
      Flowers (toe) and Bateman (shoulder) have no injury designations, and Lane practiced fully all three days after recovering from wrist surgery. Lane remains questionable and must be activated before Sunday, but Baltimore could have its deepest receiving rotation in weeks despite Jackson's absence.
    sources:
      - "Ravens official injury report"
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/lamar-jackson-injury-report-ravens-browns-sidelined-matt-hibner-broderick-washington"
  - title: "The Ravens ruled out rookie tight end Matt Hibner and defensive tackle Broderick Washington, creating additional depth concerns on both sides of the ball."
    text: >-
      Hibner's hand injury should open a larger role for fellow rookie Josh Cuevas, who caught two passes for 26 yards against Atlanta. Minter said Hibner is not expected to require injured reserve, but his absence further stretches a tight end group already missing Durham Smythe for the season.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/cam-jurgens-concussion-debut-vega-ioane-tyler-huntley-josh-cuevas-2026"
  - title: "Cleveland's injury outlook improved Friday, with three important starters returning to practice ahead of Sunday's divisional matchup."
    text: >-
      Defensive tackle Mason Graham, linebacker Carson Schwesinger and running back Quinshon Judkins all participated on a limited basis and are questionable, giving the Browns a chance to recover significant talent on both sides of the ball. Cleveland did rule out defensive tackles Mike Hall Jr. and Kalia Davis, however, potentially leaving its interior defensive line vulnerable against Derrick Henry.
    sources:
      - "ClevelandBrowns.com"
      - "BaltimoreRavens.com"
    source_links:
      - label: "clevelandbrowns.com"
        url: "https://www.clevelandbrowns.com/news/quinshon-judkins-questionable-for-week-6-vs-ravens-injury-report"
