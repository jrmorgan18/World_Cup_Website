date: 2026-09-22
edition: "September 22, 2026"
kicker: "Week 3 preparation"
heading: "Ravens Daily"
intro: "The defensive adjustments, injury updates and roster moves shaping the Ravens’ Week 3 trip to face Dallas."
highlights:
  - title: "Jesse Minter wants Chidobe Awuzie back in the defensive rotation"
    text: >-
      Awuzie played just one snap against New Orleans. Minter said he wants the veteran corner on the field more as the Ravens search for answers after their fourth-quarter collapse, making this the clearest sign yet that Sunday’s secondary usage was not a permanent demotion. How the Ravens divide snaps among Awuzie, Chandler Rivers and their three-safety packages against Dallas is worth watching.
    sources:
      - "BaltimoreRavens.com"
  - title: "The Ravens are still working to establish their defensive identity"
    text: >-
      New Orleans exposed breakdowns in coverage and tackling. The Ravens rank sixth in total defense and fifth in pressure rate through two games, but the Saints beat the rush with quick throws and converted checkdowns after missed tackles. Minter cited tackling, pursuit angles and coverage execution as areas that must improve. That combination will be tested by Dak Prescott, who has completed 73.8% of his passes through two games.
    sources:
      - "BaltimoreRavens.com"
  - title: "Nnamdi Madubuike could make his season debut Sunday in Rio"
    text: >-
      The Ravens have not cleared Madubuike yet, but said Tuesday they hope the Pro Bowl defensive tackle can return against Dallas after missing the first two games while recovering from neck surgery. His return would add an interior pass-rush threat to a front already generating pressure on 43.8% of opposing dropbacks.
    sources:
      - "BaltimoreRavens.com"
  - title: "The Ravens signed receiver Shedrick Jackson to the practice squad"
    text: >-
      Jackson has appeared in 10 NFL games and caught four passes for 56 yards and a touchdown for Las Vegas last season. He joins Xavier Guillory and Gage Larvadain on the practice squad, giving the Ravens additional insurance with Ja’Kobi Lane on injured reserve and Zay Flowers working back from a hamstring injury. It is a depth move, not evidence that Flowers will miss another game.
    sources:
      - "BaltimoreRavens.com"
  - title: "Wednesday practice is the key checkpoint for the Ravens’ Week 3 injury group"
    text: >-
      Flowers, Madubuike and Teddye Buchanan all have a chance to return against Dallas. Ronnie Stanley’s status also bears watching after a toe injury forced him out of the fourth quarter Sunday. Minter said Monday the Ravens were on a “positive trajectory” with several players; Wednesday’s first Cowboys-week injury report should show how much of that optimism translates to the field.
    sources:
      - "BaltimoreRavens.com"
