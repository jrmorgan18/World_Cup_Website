date: 2026-08-26
edition: "Wednesday · Aug. 26"
kicker: "Training camp"
heading: "Camp Highlights"
intro: "A source-attributed roundup from Wednesday’s Ravens Training Camp Daily, covering the final joint practice of camp against Washington."
highlights:
  - title: "Baltimore’s defense finished camp with another dominant joint-practice performance"
    text: "Jayden Daniels spent much of Wednesday under pressure or throwing into tight windows, while Washington struggled to create room in the running game. After similarly strong work against Minnesota last week, the Ravens have now handled three joint practices well enough that the defensive optimism is based on more than beating up their own offense in Owings Mills."
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Kyle Hamilton looked like the best player on the field"
    text: "Hamilton made a one-handed red-zone breakup, intercepted Daniels in the end zone, added another breakup and produced a run stop during team periods. One practice should not be inflated into a larger conclusion, but this was a useful example of how Jesse Minter can move Hamilton around without sacrificing his impact anywhere."
    sources:
      - "BaltimoreRavens.com"
  - title: "Trey Hendrickson closed camp looking much more like his pre-injury self"
    text: "Hendrickson repeatedly beat Washington tackle Brandon Coleman for would-be sacks and also won cleanly in one-on-ones. After similar success against Christian Darrisaw last week, the encouraging part is not the practice sack count but that Baltimore’s biggest pass-rush addition is consistently winning individual matchups against starting-caliber tackles."
    sources:
      - "BaltimoreRavens.com"
  - title: "Zay Flowers’ absence appears precautionary rather than another significant injury concern"
    text: "Flowers and rookie edge defender Zion Young both sat out the joint practice with what Minter described as minor issues, saying the Ravens were prioritizing their Week 1 health. Baltimore also signed linebacker Michael Barrett, who played for Minter at Michigan, while Teddye Buchanan continues to ramp back up from his ACL injury."
    sources:
      - "BaltimoreRavens.com"
