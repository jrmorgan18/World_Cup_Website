date: "2026-10-30"
edition: "October 30, 2026"
kicker: "Week 8 · Buffalo"
heading: "Ravens Daily"
intro: "Thursday's practice brought progress for Jackson, Ioane and the defensive leaders as the Ravens prepare for Buffalo."
highlights:
  - title: "Rookie guard Vega Ioane returned to practice just four days after suffering a reported MCL sprain, raising the possibility he could play Sunday against Buffalo."
    text: >-
      Ioane was limited Thursday after missing Wednesday's session, and CBS Sports' Matt Zenitz reports he is pushing to play despite initial expectations that he would miss time. His availability would be a significant boost to an offensive line that has struggled with injuries and inconsistent run blocking.
    sources:
      - "BaltimoreRavens.com"
      - "CBS Sports/Matt Zenitz"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/ravens-injury-report-vega-ioane-kyle-hamilton-roquan-smith-ravens-practice-return-2026"
  - title: "Lamar Jackson practiced fully for the second consecutive day, putting him firmly on track to return against the Bills after missing three games with a high ankle sprain."
    text: >-
      Offensive coordinator Declan Doyle acknowledged the challenge of getting Jackson back into game rhythm, saying Baltimore is emphasizing realistic game-speed repetitions in practice. Jackson has not officially been cleared for Sunday, but his participation represents a substantial improvement over last week's limited practices.
    sources:
      - "BaltimoreRavens.com"
      - "NBC Sports"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/ravens-injury-report-vega-ioane-kyle-hamilton-roquan-smith-ravens-practice-return-2026"
  - title: "Defensive leaders Kyle Hamilton and Roquan Smith both returned to limited practice after missing Wednesday with knee injuries."
    text: >-
      Jesse Minter had characterized their absences as routine postgame issues, and Thursday's participation suggests both have a reasonable chance to face Josh Allen. Starting safety Jaylinn Hawkins remained sidelined for a second consecutive day, however, leaving Baltimore's secondary potentially shorthanded again.
    sources:
      - "BaltimoreRavens.com"
      - "ESPN/Jamison Hensley"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/ravens-injury-report-vega-ioane-kyle-hamilton-roquan-smith-ravens-practice-return-2026"
  - title: "Doyle acknowledged that Baltimore's second-half offensive failures may partly reflect his own play-calling adjustments."
    text: >-
      The Ravens are averaging 16.8 first-half points compared with just 7.2 after halftime, and Doyle admitted he has sometimes abandoned his scripted second-half plays too quickly. Baltimore has gone two consecutive games without a second-half touchdown, making Doyle's willingness to reconsider his approach particularly significant heading into Buffalo.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/declan-doyle-second-half-adjustments--script-run-game-legends-kyle-hamilton-scars"
  - title: "Baltimore's offensive coordinator identified communication breakdowns as a significant contributor to the Ravens' deteriorating rushing attack."
    text: >-
      Doyle praised Cam Jurgens' debut at center but acknowledged that assignments are not consistently being communicated across the offensive line, leaving defenders unblocked. Derrick Henry managed just 45 yards on 17 carries against Cincinnati, and fixing those protection and blocking assignments is essential regardless of whether Jackson returns Sunday.
    sources:
      - "BaltimoreRavens.com"
    source_links:
      - label: "Baltimore Ravens"
        url: "https://www.baltimoreravens.com/news/declan-doyle-second-half-adjustments--script-run-game-legends-kyle-hamilton-scars"
  - title: "Baltimore's defensive front is getting healthier, with John Jenkins and Broderick Washington upgrading to full participation Thursday."
    text: >-
      Ronnie Stanley also returned to full practice, while cornerback T.J. Tampa participated fully as he continues working toward activation from injured reserve. Tampa has not yet been added to the active roster, but the improved participation across both lines provides encouraging depth news ahead of Sunday's matchup.
    sources:
      - "Baltimore Beatdown injury report"
    source_links:
      - label: "Baltimore Beatdown"
        url: "https://www.baltimorebeatdown.com/baltimore-ravens-injuries/87183/ravens-injury-report-vega-ioane-returns-lamar-jackson-full-again"
  - title: "Buffalo's injury concerns intensified Thursday, with starting right tackle Spencer Brown missing his second consecutive practice because of a back injury."
    text: >-
      Cornerback Dee Alford was downgraded to a nonparticipant, while defensive tackle Ed Oliver returned to full participation. Brown's potential absence would be particularly significant for Baltimore's pass rush, which is trying to replace Tavius Robinson's production while preparing to contain Josh Allen.
    sources:
      - "Buffalo Rumblings"
      - "Baltimore Beatdown"
    source_links:
