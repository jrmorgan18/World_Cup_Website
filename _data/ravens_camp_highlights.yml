date: 2026-08-09
edition: "Weekend roundup · Aug. 8–9"
intro: "A daily, source-attributed roundup of Ravens practice reporting."
highlights:
  - title: "Lane keeps earning first-team opportunities"
    text: "The third-round rookie kept producing against top corners over both practices, including winning vertical and contested reps with Zay Flowers sidelined."
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Flowers' outlook remains short-term"
    text: "Flowers missed Sunday after Saturday's quad contusion, but Jesse Minter indicated the receiver is day-to-day and expected back soon."
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Cadence work brought a costly reminder"
    text: "Baltimore logged eight false starts during Sunday's padded practice while experimenting with varied cadences. The defense capitalized with takeaways and pressure from defensive-back and linebacker blitzes."
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Tampa and Johnson add to the depth picture"
    text: "T.J. Tampa followed Thursday's forced fumble with another strong practice as he competes for an outside-corner role. Baltimore also signed inside linebacker Jamon Johnson and waived cornerback Matthew McDoom."
    sources:
      - "BaltimoreRavens.com"
  - title: "Loop stays perfect; reinforcements may be close"
    text: "Rookie kicker Tyler Loop made every attempt, including three from 50-plus yards. Calais Campbell rejoined team work, while Travis Jones and Aeneas Peebles were reported as nearing returns."
    sources:
      - "The Baltimore Banner"
      - "BaltimoreRavens.com"
  - title: "Doyle's pre-snap disguise remains a theme"
    text: "Justice Hill told The Baltimore Banner that Doyle's offense is designed to make runs and passes look alike before the snap, with players now refining its moving parts."
    sources:
      - "The Baltimore Banner"
