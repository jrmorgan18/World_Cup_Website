date: 2026-08-21
edition: "Friday · Aug. 21"
kicker: "Training camp"
heading: "Camp Highlights"
intro: "A source-attributed roundup from Friday’s Ravens Training Camp Daily, with no Ravens practice scheduled as Baltimore turns toward Saturday’s preseason game."
highlights:
  - title: "The center competition now defines Saturday’s preseason game"
    text: "Danny Pinter, who had taken most of the first-team work, suffered a torn patellar tendon Wednesday and is expected to miss the season. Ethan Pocic and Jovaughn Gwyn are now the primary candidates, with Corey Bullock also expected to get center reps against Minnesota."
    sources:
      - "BaltimoreRavens.com"
      - "NFL Network"
  - title: "Jovaughn Gwyn has a real chance to claim the center job"
    text: "Gwyn stepped into the first-team offense after Pinter went down and held up well against Minnesota’s pressure packages. Jesse Minter said Gwyn played “really well” on Wednesday’s tape; Pocic has the experience advantage, but he is still working back from last year’s Achilles injury, so Baltimore has reason to keep the competition open."
    sources:
      - "BaltimoreRavens.com"
  - title: "Baltimore’s secondary leaves Minnesota with real reason for optimism"
    text: "Marlon Humphrey and Nate Wiggins rebounded from last week’s injury scares with excellent two-day performances against Justin Jefferson and Jordan Addison. Humphrey may have been Baltimore’s best player over the sessions, while Wiggins repeatedly challenged Minnesota’s top receivers downfield and in the red zone."
    sources:
      - "BaltimoreRavens.com"
  - title: "Trey Hendrickson supplied the pass-rush evidence Baltimore wanted"
    text: "Hendrickson consistently won against Vikings left tackle Christian Darrisaw and produced two would-be third-down sacks Thursday. Winning those reps against a high-end tackle matters more than piling up pressure against Baltimore’s backup offensive linemen in a normal camp practice."
    sources:
      - "BaltimoreRavens.com"
  - title: "Ja’Kobi Lane keeps passing every new test"
    text: "After emerging as camp’s breakout player and scoring in the preseason opener, Lane followed with a deep catch from Lamar Jackson Wednesday and two red-zone touchdowns Thursday. Saturday offers another opportunity to show that his rapid climb can survive actual game coverage."
    sources:
      - "BaltimoreRavens.com"
  - title: "Tyler Loop can turn practice success into game evidence"
    text: "Loop has been excellent through most of camp and went 6-for-6 Thursday, but he missed a 49-yarder in the preseason opener. Baltimore does not appear eager to manufacture a kicking competition; clean game reps remain the easiest way for Loop to put that conversation away."
    sources:
      - "BaltimoreRavens.com"
  - title: "Saturday’s game is about the roster behind the starters"
    text: "Baltimore used the Minnesota joint practices to give Lamar Jackson, Derrick Henry and the rest of its core meaningful work against another team. The most useful evaluations Saturday should therefore come at center and among the young receivers, tight ends, defensive backs and other players fighting for roles behind the starters."
    sources:
      - "BaltimoreRavens.com"
