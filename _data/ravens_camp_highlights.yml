date: 2026-09-24
edition: "September 24, 2026"
kicker: "Week 3 preparation"
heading: "Ravens Daily"
intro: "The injuries, returns and roster questions shaping Baltimore’s Week 3 trip to face Dallas in Rio."
highlights:
  - title: "Zay Flowers missed a second straight practice, and Sunday is looking less likely"
    text: >-
      Flowers did some work on the side Thursday but never joined practice. NFL Network reported that a Week 4 return is looking more likely. Baltimore has scored four touchdowns on five drives with Flowers this season, compared with three on 16 drives since his hamstring injury.
    sources:
      - "ESPN (Jamison Hensley)"
      - "NFL Network"
      - "BaltimoreRavens.com"
  - title: "Nnamdi Madubuike is traveling to Brazil after a second full practice"
    text: >-
      Madubuike said he felt “way faster” Thursday than Wednesday and that he and the coaches feel good about his progress, while stopping short of confirming he will play. ESPN’s Jeremy Fowler reported that two full practices have him poised to make his first appearance since September 2025.
    sources:
      - "ESPN (Jeremy Fowler)"
      - "BaltimoreRavens.com"
  - title: "Teddye Buchanan is expected to make his season debut against Dallas"
    text: >-
      CBS Sports’ Matt Zenitz reported Buchanan will play Sunday after the second-year linebacker practiced fully again Thursday, about nine months after tearing his ACL. His return sets up a personnel choice: Trenton Simpson has played well next to Roquan Smith, and Anthony Weaver called having all three available a “beautiful problem.”
    sources:
      - "CBS Sports (Matt Zenitz)"
      - "BaltimoreRavens.com"
  - title: "Ronnie Stanley’s absence leaves left tackle as Baltimore’s other major injury concern"
    text: >-
      Stanley aggravated his toe against New Orleans and has not practiced this week. Carson Vinson replaced him in the fourth quarter Sunday and is the obvious next man up if Stanley cannot play. John Simpson progressed from limited Wednesday to full participation Thursday.
    sources:
      - "BaltimoreRavens.com"
  - title: "Trey Hendrickson returned to practice while managing his broken finger"
    text: >-
      Hendrickson was limited Thursday after sitting out Wednesday, following the workload management that let him play through the injury and record a sack against New Orleans. Malaki Starks (hamstring) remained limited, while Zion Young (quad) improved to full participation.
    sources:
      - "Ravens injury report"
      - "Baltimore Beatdown"
  - title: "Four Cowboys defenders are ruled out, thinning Dallas’ secondary"
    text: >-
      Starting safety Malik Hooker, replacement safety P.J. Locke, cornerback Cobie Durant and linebacker DeMarvion Overshown will all miss Sunday’s game. That gives Lamar Jackson a depleted defense to attack, a meaningful break for a passing game likely to be without Flowers and Dallas’ reshuffled corner and safety rotations.
    sources:
      - "The Dallas Morning News"
  - title: "Declan Doyle says Devontez Walker can earn a larger role"
    text: >-
      Walker played only 17 offensive snaps in his season debut but made a 47-yard catch against New Orleans. Doyle said roles can change with performance and praised how Walker handled his limited package. If Flowers sits again, Walker’s vertical ability is an obvious way to replace some of the missing explosiveness.
    sources:
      - "BaltimoreRavens.com"
