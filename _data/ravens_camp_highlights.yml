date: '2026-11-20'
edition: November 20, 2026
kicker: Week 11 · Panthers preparation
heading: Ravens Daily
intro: The Ravens prepare for Carolina with three defensive starters unavailable and Vega Ioane cleared to play.
highlights:
- title: Nnamdi Madubuike has been ruled out against Carolina, removing Baltimore's most disruptive interior defensive lineman.
  text: Madubuike missed all three practices after suffering a hamstring injury against the Chargers and leads Ravens defensive
    linemen with 26 pressures, according to PFF. His absence puts more responsibility on Travis Jones and the remaining defensive
    front to contain Carolina's rushing attack.
  sources:
  - The Baltimore Banner/Jonas Shaffer
  - BaltimoreRavens.com
  source_links:
  - label: Ravens injury report
    url: https://www.baltimoreravens.com/news/injury-report-ravens-panthers-nnamdi-madubuike-jaylinn-hawkins-practice-week-11
- title: Baltimore will also be without Jaylinn Hawkins and Marlon Humphrey, forcing significant changes to the secondary.
  text: Hawkins was ruled out after missing Friday's practice with his lingering knee injury, while Humphrey will serve a
    one-game deactivation following his derogatory comments about Baltimore. Chidobe Awuzie and T.J. Tampa are expected to
    absorb Humphrey's responsibilities, and Jesse Minter said Friday that he expects the veteran cornerback back at the facility
    Monday.
  sources:
  - BaltimoreRavens.com
  - Jesse Minter press conference
  source_links:
  - label: Ravens injury report
    url: https://www.baltimoreravens.com/news/injury-report-ravens-panthers-nnamdi-madubuike-jaylinn-hawkins-practice-week-11
  - label: Minter’s Friday press conference
    url: https://www.baltimoreravens.com/news/transcript-press-conference-11-20-26
- title: Vega Ioane is cleared to play Sunday, providing an important boost to Baltimore's struggling offensive line.
  text: The first-round guard practiced fully Thursday and Friday despite knee and shoulder concerns and carries no injury
    designation. John Simpson was added to Friday's report with a shoulder issue but is also cleared, giving the Ravens their
    expected starting interior combination as they try to revive a rushing attack that managed just 16 yards against the Chargers.
  sources:
  - Ravens official injury report
  - BaltimoreRavens.com
  source_links:
  - label: Official Week 11 injury report
    url: https://www.baltimoreravens.com/team/injury-report/week/REG-11
- title: Carolina will be missing starting linebacker Bobby Okereke, although several important offensive contributors could
    return.
  text: Okereke is out with a foot injury, while tight ends Darren Waller and Tommy Tremble remain questionable with knee
    injuries. Starting cornerback Mike Jackson practiced fully throughout the week and could return from injured reserve,
    potentially strengthening Carolina's coverage against Jacoby Brissett.
  sources:
  - Carolina Panthers official injury report
  - BaltimoreRavens.com
  source_links:
  - label: Panthers final injury report
    url: https://www.panthers.com/news/week-11-friday-injury-report-two-ruled-out-for-ravens-game-bobby-okereke-isaiah-simmons
- title: Minter and Anthony Weaver are emphasizing defensive run-fit discipline after another poor performance against the
    ground game.
  text: Minter said Friday that Weaver used film during the defensive meeting to contrast successful snaps with plays where
    one defender's incorrect assignment compromised the entire structure. The Ravens surrendered 160 rushing yards against
    Los Angeles, and Minter acknowledged the difficulty of correcting physical and technical mistakes during a shortened practice
    week.
  sources:
  - BaltimoreRavens.com
  - Jesse Minter press conference
  source_links:
