date: 2026-10-14
edition: "October 14, 2026"
kicker: "Week 6 · Cleveland"
heading: "Ravens Daily"
intro: "Lamar Jackson remains day-to-day, while Trey Hendrickson and Ja’Kobi Lane took important steps toward Sunday’s AFC North matchup in Cleveland."
highlights:
  - title: "Lamar Jackson missed Wednesday’s practice, but ESPN’s Adam Schefter reports he has a realistic chance to return against Cleveland."
    text: >-
      Jesse Minter continues to describe Jackson’s ankle injury as day-to-day and emphasized that the quarterback is doing everything possible to get back on the field. Jackson has not practiced since October 4, leaving Tyler Huntley preparing for another potential start while the Ravens wait for a clearer indication of their franchise quarterback’s availability.
    sources:
      - "ESPN / Adam Schefter"
      - "BaltimoreRavens.com"
    source_links:
      - label: "Ravens · Jackson reportedly has a realistic chance to face Cleveland"
        url: "https://www.baltimoreravens.com/news/lamar-jackson-injury-report-ravens-browns-realistic-chance"
      - label: "Ravens · Jackson and teammates injury updates"
        url: "https://www.baltimoreravens.com/news/news-notes-injury-updates-lamar-jackson-cam-jurgens-trey-hendrickson-jakobi-lane-mike-green-vega-ioane"
  - title: "Trey Hendrickson returned to full practice Wednesday, a significant step toward getting the Ravens’ top edge rusher back on the field."
    text: >-
      Hendrickson has missed two games following surgery on a broken finger, but participated with his hand wrapped and appears on track to face Cleveland. His return would give Jesse Minter another proven pass rusher alongside the improving Mike Green, potentially reducing the defense’s reliance on manufactured pressure.
    sources:
      - "Ravens official injury report"
      - "The Baltimore Banner"
    source_links:
      - label: "Ravens · Official injury report"
        url: "https://www.baltimoreravens.com/team/injury-report/"
      - label: "Ravens · October 14 press conference transcript"
        url: "https://www.baltimoreravens.com/news/transcript-press-conferences-10-14-26"
  - title: "Ja’Kobi Lane was activated from injured reserve and returned to full practice, putting the rookie receiver in position for a possible Sunday debut."
    text: >-
      Lane underwent wrist surgery after the season opener and missed four games. Baltimore activated him from injured reserve Wednesday, and he practiced fully. His 6-foot-4 frame could give Declan Doyle another red-zone option, particularly valuable with Durham Smythe out for the season and the tight end rotation increasingly thin.
    sources:
      - "BaltimoreRavens.com"
      - "NFL Network / Mike Garafolo"
    source_links:
      - label: "Ravens · Lane activated and returns to practice"
        url: "https://www.baltimoreravens.com/news/injury-report-jakobi-lane-cam-jurgens-ravens-browns-returns-practice-injured-reserve"
      - label: "Ravens · Official injury report"
        url: "https://www.baltimoreravens.com/team/injury-report/"
  - title: "Cam Jurgens practiced for the first time since arriving from Philadelphia, but remains in concussion protocol."
    text: >-
      The newly acquired center was a limited participant Wednesday and wore a red non-contact jersey, leaving his availability for Cleveland uncertain. Getting Jurgens cleared would allow the Ravens to move Vega Ioane back to guard and begin assembling something closer to the intended offensive line.
    sources:
      - "BaltimoreRavens.com"
