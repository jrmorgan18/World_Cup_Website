date: 2026-10-01
edition: "October 1, 2026"
kicker: "Week 4 · Tennessee"
heading: "Ravens Daily"
intro: "Lamar Jackson and Zay Flowers are trending toward full workloads, while the Ravens prepare rookie Vega Ioane for his first start at center against Tennessee."
highlights:
  - title: "Lamar Jackson is back to full practice after a minor back issue"
    text: >-
      Jackson was limited Wednesday, but returned as a full participant Thursday after Jesse Minter called the issue “something small.” Barring a setback, he is on track to start Sunday against Tennessee.
    sources:
      - "BaltimoreRavens.com · Oct. 1 injury report"
  - title: "Zay Flowers practiced fully and says his hamstring feels behind him"
    text: >-
      Flowers was deliberately limited to 21 snaps against Dallas but still gained 84 receiving yards. After a full Thursday practice, the Ravens expect to move him much closer to his normal workload against the Titans.
    sources:
      - "BaltimoreRavens.com · Oct. 1 News & Notes"
  - title: "Ronnie Stanley remains limited; John Simpson is back to full participation"
    text: >-
      Stanley has been limited for a second straight day with the toe injury that kept him out against Dallas. Friday’s practice and game designation are the key checkpoints. Simpson improved from limited to full Thursday, a useful stabilizing sign as the Ravens break in a new center.
    sources:
      - "BaltimoreRavens.com · Oct. 1 injury report"
  - title: "Vega Ioane is preparing for his first start at center"
    text: >-
      Declan Doyle is treating the position switch as an offense-wide communication challenge, with Lamar Jackson, the coaches and the other linemen all responsible for helping the rookie. Ioane’s first start comes against four-time Pro Bowl defensive tackle Jeffery Simmons.
    sources:
      - "BaltimoreRavens.com · Oct. 1 News & Notes and press transcript"
  - title: "Andre James is still learning the offense after a month away from football"
    text: >-
      The veteran center said Wednesday was his first football activity in a month as he recovers from a high ankle sprain and gets up to speed after joining the practice squad. His 61 career starts offer longer-term experience, but Ioane remains the Week 4 plan.
    sources:
      - "BaltimoreRavens.com · Oct. 1 News & Notes"
  - title: "Trey Hendrickson missed practice again; Marlon Humphrey advanced to full"
    text: >-
      Hendrickson sat out Thursday with the broken finger he has played through since Week 2. He followed a similar early-week pattern before playing against Dallas, so Friday’s designation should offer a clearer read. Humphrey moved from limited Wednesday to full participation Thursday with his hamstring issue.
    sources:
      - "BaltimoreRavens.com · Oct. 1 injury report"
  - title: "The Ravens are reassessing their short-yardage options"
    text: >-
      After Derrick Henry was stopped four times in key situations against Dallas, Doyle said a quarterback sneak needs to be available in some form and that the staff is reviewing both the scheme and execution. That is a tactical response to one of the offense’s clearest early-season problems, not a promise that Jackson will become the default short-yardage runner.
    sources:
      - "BaltimoreRavens.com · Oct. 1 press transcript"
