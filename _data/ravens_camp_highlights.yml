date: 2026-08-11
edition: "Tuesday · Aug. 11"
intro: "A daily, source-attributed roundup of Ravens practice reporting."
highlights:
  - title: "Wiggins injury scare turns encouraging"
    text: "Nate Wiggins was carted off after a lower-body injury covering Ja'Kobi Lane in one-on-ones, but subsequent testing reportedly showed no structural damage. Jesse Minter voiced optimism after practice, though Baltimore has not set a return timetable."
    sources:
      - "BaltimoreRavens.com"
      - "ESPN"
  - title: "Flowers back far sooner than expected"
    text: "Zay Flowers returned for positional work Tuesday after missing just one practice with a quad contusion, with Minter saying the limited workload was simply part of the plan as the soreness subsides."
    sources:
      - "ESPN"
      - "BaltimoreRavens.com"
  - title: "Travis Jones activated off PUP"
    text: "Jones took part in positional drills for the first time this summer after recovering from a pectoral injury. Minter said the Ravens may ease him in, but his return starts restoring depth and power to the defensive interior."
    sources:
      - "ESPN"
  - title: "Corner depth answers the bell after Wiggins goes down"
    text: "Marlon Humphrey had one of his best practices of camp, breaking up a pass on Mark Andrews and picking one off in the end zone, while T.J. Tampa added another breakup and a simulated sack. Minter pointed to Humphrey, Chidobe Awuzie and Tampa as reasons for confidence if Wiggins misses time."
    sources:
      - "BaltimoreRavens.com"
  - title: "Walker pushes into the No. 3 receiver conversation"
    text: "Devontez Walker was arguably Baltimore's best offensive player Tuesday, producing a long gain against Tampa and a strong red-zone catch from Lamar Jackson. Ja'Kobi Lane remains the camp headline, but Walker is making the receiver competition harder to call."
    sources:
      - "BaltimoreRavens.com"
  - title: "Loop still hasn't missed"
    text: "Tyler Loop went 7-for-7 Tuesday, his third straight practice without a miss, and is now 33-of-35 for camp with a perfect 8-for-8 from beyond 50 yards, per ESPN. Preseason games will be the real test, but it's been about as clean a summer as a kicker can have."
    sources:
      - "BaltimoreRavens.com"
      - "ESPN"
  - title: "Don't expect the starters Saturday"
    text: "Minter said several veterans, including Lamar Jackson, will sit out the preseason opener against Philadelphia. Expect the game to double as an evaluation night for the receiver, center, cornerback and back-of-roster battles instead."
    sources:
      - "ESPN"
      - "BaltimoreRavens.com"
