zavier-gozo:
  club: Real Salt Lake
  position: Winger / wingback
  updated: July 2026
  summary: >-
    Gozo is the best combination of current production, age and immediate readiness in this prospect group. He is a direct, explosive attacker who wants to receive facing goal, isolate a defender and attack the box. He can stay wide, run diagonally behind the line or function as an aggressive wingback.
  strengths: Acceleration, one-on-one threat, shot volume, off-ball runs, positional versatility and improving defensive effort.
  questions: Final-third decisions can be rushed; his finishing must hold over a full season; his ultimate role remains unsettled; and his weaker foot needs continued development.
  usmnt_case: His directness could earn him an early bench role before he becomes a complete player.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1455818/zavier-gozo" }
    - { label: MLS feature, url: "https://www.mlssoccer.com/news/zavier-gozo-real-salt-lake-s-homegrown-teenage-sensation" }

noahkai-banks:
  club: FC Augsburg
  position: Center back
  updated: July 2026
  status: U.S. / Germany decision unresolved
  summary: >-
    Banks owns the strongest club resume in this research group. More than 1,700 Bundesliga minutes as a teenage center back is powerful evidence. He is a modern, front-foot defender who receives calmly, steps into midfield and looks to break lines rather than merely recycle possession.
  strengths: High-level senior experience, composure, progressive passing, anticipation, recovery ability and a high physical and technical ceiling.
  questions: Aerial dominance is inconsistent for his size; he can become overaggressive stepping out; and his national-team decision remains unresolved.
  usmnt_case: If he chooses the United States, he immediately becomes one of the most important young center backs in the pool.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1641063/noahkai-banks" }
    - { label: U.S. Soccer, url: "https://www.ussoccer.com/players/b/noahkai-banks" }

julian-hall:
  club: New York Red Bulls
  position: Striker / wide forward
  updated: July 2026
  status: U.S. / Poland eligible
  summary: >-
    Hall is already producing like a senior scorer. His game is based on mobility, separation and attacking space rather than traditional target-forward play. He presses, runs across center backs and is especially dangerous when New York forces turnovers.
  strengths: Movement behind defenders, acceleration, box timing, transition finishing and pressing intensity.
  questions: Hold-up play, back-to-goal strength and aerial influence remain developmental; his long-term role is not settled; and Poland remains an alternative.
  usmnt_case: He has already cleared the first hurdle that defeats many striker prospects by scoring against adults at a young age.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1489675/julian-hall" }
    - { label: Red Bulls, url: "https://www.newyorkredbulls.com/news/red-bull-new-york-forward-julian-hall-named-to-the-2026-mls-all-star-game-presented-by-chime-roster" }

adri-mehmeti:
  club: New York Red Bulls
  position: Defensive midfielder / No. 8
  updated: July 2026
  summary: >-
    Mehmeti may have the most impressive age-to-responsibility relationship in the group. At 17, he has already been trusted for substantial MLS minutes in central midfield. He scans, anticipates passing lanes, moves the ball quickly and can break lines from deeper positions.
  strengths: Tactical maturity, calm receiving under pressure, anticipation, interceptions, line-breaking passing and unusual senior responsibility for his age.
  questions: He lacks overwhelming size or speed; large transition spaces can expose him; and he needs more progressive carrying and final-third production.
  usmnt_case: If Mehmeti develops into a true six/eight controller, he fills a valuable niche in the American pool.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1715268/adri-mehmeti" }
    - { label: Red Bulls profile, url: "https://www.newyorkredbulls.com/players/adri-mehmeti/" }

neil-pierre:
  club: Philadelphia Union
  position: Center back
  updated: July 2026
  summary: >-
    Pierre combines an unusual physical profile, strong age-adjusted production and a rapidly improving senior resume. His progression from MLS NEXT Pro to productive minutes in Denmark and then immediate usefulness in MLS gives the projection real momentum.
  strengths: Exceptional aerial range, set-piece threat, mobility for his frame, penalty-area defending, recovery potential and youth-national-team leadership.
  questions: The top-level sample remains small; progressive passing is not consistently polished; and quicker attackers can test his turning radius.
  usmnt_case: Center back should be one of the most open positions in the cycle, and Pierre's physical ceiling and trajectory put him near the top of the domestic prospect group.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1517896/neil-pierre" }
    - { label: Philadelphia Union, url: "https://www.philadelphiaunion.com/players/neil-pierre/" }

chris-brady:
  club: Chicago Fire
  position: Goalkeeper
  updated: July 2026
  summary: >-
    Brady is the highest-floor goalkeeper in this group because he has already handled several seasons as an MLS starter. He is a large, athletic keeper whose best traits are reactions, close-range saves and control of crosses.
  strengths: First-team experience, frame, reactions, high-ball command and familiarity with the senior USMNT environment.
  questions: Long distribution remains uneven; save percentage has fluctuated; and he is not yet an elite sweeper or possession goalkeeper.
  usmnt_case: The post-2026 goalkeeper order is open. Brady has a more proven floor than Diego Kochen, even if Kochen may possess the higher technical ceiling.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1245998/chris-brady" }
    - { label: U.S. Soccer, url: "https://www.ussoccer.com/players/b/chris-brady" }

rokas-pukstas:
  club: Hajduk Split
  position: Box-to-box No. 8
  updated: July 2026
  summary: >-
    Pukstas has one of the strongest professional resumes among young, unestablished American midfielders. His game is built around running power, timing and penalty-area instincts. He is most effective as a No. 8 who presses, competes for second balls and arrives late in scoring positions.
  strengths: Late penalty-area runs, scoring instinct, work rate, box-to-box movement, duel competitiveness, pressing value and extensive senior experience.
  questions: Progressive passing and chance creation lag behind his scoring; he can become peripheral when asked to dictate possession; and the Croatian league requires a quality adjustment.
  usmnt_case: He has a strong chance to become a useful international No. 8 even if he never develops into the midfield's primary organizer.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1377897/rokas-pukstas" }
    - { label: U.S. Soccer, url: "https://www.ussoccer.com/players/p/rokas-pukstas" }

cavan-sullivan:
  club: Philadelphia Union
  position: Attacking midfielder / winger
  updated: July 2026
  summary: >-
    Sullivan has the highest theoretical ceiling but is not yet the most likely immediate contributor. His game is built around close control, imagination and seeing passing windows early. He can receive between lines, escape pressure and attempt actions that reshape a possession.
  strengths: Creativity, tight-space control, disguised passing, pressure resistance and rare technical upside.
  questions: Modest senior production, developing physicality, occasional forced-risk decisions, defensive consistency and an elite-club pathway with no guaranteed first-team opportunity.
  usmnt_case: He will still be only 20 at the 2030 World Cup and has the tools to become a transformative creator.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1630736/cavan-sullivan" }
    - { label: MLS profile, url: "https://www.mlssoccer.com/players/cavan-sullivan/" }

niko-tsakiris:
  club: San Jose Earthquakes
  position: No. 8 / No. 10
  updated: July 2026
  summary: >-
    Tsakiris is one of the most polished creators in the MLS group. He can vary tempo, carry through pressure and create through combinations, switches and set pieces. His 2026 production was excellent, although injuries reduced the total sample.
  strengths: Vision, chance creation, tempo control, set pieces, left-footed passing and ball carrying.
  questions: Injury interruptions, limited aerial impact, uneven defensive-duel output and a crowded pathway among attacking midfielders.
  usmnt_case: His ceiling depends on proving he can function as a genuine two-way No. 8 rather than only as a No. 10.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1339609/niko-tsakiris" }
    - { label: San Jose Earthquakes, url: "https://www.sjearthquakes.com/news/news-san-jose-earthquakes-sign-niko-tsakiris-to-new-multiyear-u22-initiative-player-contract" }

paxten-aaronson:
  club: Colorado Rapids
  position: Attacking midfielder / No. 8
  updated: July 2026
  summary: >-
    Aaronson is one of the least speculative prospects in the group. He has played in Germany and the Netherlands and returned to MLS as a proven professional. He is a high-energy attacking midfielder who presses, combines quickly and times late runs into scoring positions.
  strengths: Off-ball movement, pressing, box arrivals, combination play, versatility and a solid professional floor.
  questions: He lacks one overwhelming trait, can influence without controlling matches and may settle as a useful squad player rather than a first-choice international.
  usmnt_case: >-
    His route is straightforward: sustain production and turn his versatility into a tactical advantage rather than positional ambiguity.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1171008/paxten-aaronson" }
    - { label: U.S. Soccer, url: "https://ussoccer.com/stories/2023/11/the-brotherhood-aaronsons-are-the-latest-set-of-brothers-to-represent-usmnt" }

mathis-albert:
  club: Borussia Dortmund
  position: Winger
  updated: July 2026
  summary: >-
    Albert demonstrates why a minutes-only screen is insufficient. He had virtually no Bundesliga role in 2025-26, but became the youngest American to appear in the league, trained with Dortmund's senior team and impressed during the 2026 preseason. His projection rests on exceptional acceleration and the ability to attack defenders directly.
  strengths: Explosive speed, one-on-one confidence, diagonal running, finishing potential and a very high ceiling in an elite environment.
  questions: Almost no first-team sample, limited strength, developing defensive habits and decision-making, and intense competition inside Dortmund.
  usmnt_case: Genuine Dortmund first-team consideration at 17 is a sufficiently rare signal to justify tracking him closely despite the limited proof.
  sources:
    - { label: Bundesliga profile, url: "https://www.bundesliga.com/en/bundesliga/news/mathis-albert-who-is-borussia-dortmunds-record-breaking-american-teenager-37108" }
    - { label: Borussia Dortmund, url: "https://www.bvb.de/de/en/news/news-overview/news.html/2026/1/9/These-young-players-stood-out-at-the-training-camp.html" }

diego-kochen:
  club: FC Barcelona / Lyngby
  position: Goalkeeper
  updated: July 2026
  summary: >-
    Kochen is the highest-upside goalkeeper in this group but lacks Brady's senior resume. He fits the modern possession model: comfortable with the ball, willing to invite pressure and capable of passing through the first line. His 2026-27 loan to Lyngby is the critical test.
  strengths: Distribution, composure in buildup, agility, reflexes and one-on-one goalkeeping.
  questions: Minimal senior evidence, a need for greater strength and box authority, previous injury interruptions and no guarantee of winning the Lyngby job.
  usmnt_case: A season as a Danish top-flight starter could move him rapidly up the goalkeeper depth chart; a reserve season would weaken the projection.
  sources:
    - { label: U.S. Soccer, url: "https://www.ussoccer.com/players/k/diego-kochen" }
    - { label: FC Barcelona, url: "https://www.fcbarcelona.com/en/football/barca-b/news/4529935/diego-kochen-loaned-to-lyngby-boldklub" }

benjamin-cremaschi:
  club: Parma
  position: Box-to-box No. 8
  updated: July 2026
  summary: >-
    Cremaschi's limited 2025-26 Serie A minutes understate the total case. Parma's long-term commitment, his productive U-20 World Cup and his leadership record keep him in the discussion. His best qualities often appear without the ball through pressing, ground coverage and assertive runs beyond the forwards.
  strengths: Off-ball movement, late box arrivals, pressing intensity, stamina, size, positional flexibility, leadership and scoring instincts from midfield.
  questions: Almost no Serie A evidence, a loose first touch under pressure, limited progressive-passing impact, positional ambiguity and recovery from injury.
  usmnt_case: His best path is becoming a tactically reliable, goal-contributing No. 8 who supports more creative midfielders.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1354177/benjamin-cremaschi" }
    - { label: Parma, url: "https://www.parmacalcio1913.com/en/main-news/parma-calcio-e-benjamin-cremaschi-insieme-fino-al-2031/" }
    - { label: U.S. Soccer, url: "https://www.ussoccer.com/players/c/benjamin-cremaschi" }

kevin-paredes:
  club: VfL Wolfsburg
  position: Wingback / winger
  updated: July 2026
  summary: >-
    Paredes is the research group's largest injury adjustment. Foot surgery and a later muscular injury wiped out much of 2025-26, making his minutes a poor reflection of his established ability. When healthy, he is a high-energy two-way wide player who carries forward, presses, tackles and arrives in the box.
  strengths: Vertical ball carrying, pressing, tackling, off-ball runs, positional versatility and prior Bundesliga proof.
  questions: Durability, two lost developmental seasons, inconsistent passing and ball security, limited aerial influence and uncertainty in his club situation.
  usmnt_case: His ability has already been demonstrated; the issue is whether health and club context allow him to restore the trajectory.
  sources:
    - { label: ESPN injury report, url: "https://www.espn.com/soccer/story/_/id/45966467/usa-kevin-paredes-injury-wolfsburg" }
    - { label: Wolfsburg, url: "https://www.vfl-wolfsburg.de/en/newsdetails/news-detail/detail/news/the-team-have-done-very-well" }

peyton-miller:
  club: New England Revolution
  position: Left back / wingback / winger
  updated: July 2026
  summary: >-
    Miller is an explosive left-sided runner whose attack has developed faster than his defending. He is most dangerous accelerating into space, overlapping, carrying in transition or attacking the back post.
  strengths: Pace, acceleration, transition threat, overlapping runs, scoring potential and multi-position utility.
  questions: Defensive positioning, smaller frame, variable crossing and final-ball selection, role uncertainty and interrupted continuity.
  usmnt_case: Miller has the athletic ceiling to challenge for the long-term opening behind Antonee Robinson but must become dependable without the ball.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1473789/peyton-miller" }
    - { label: New England Revolution, url: "https://www.revolutionsoccer.net/news/revolution-sign-homegrown-defender-peyton-miller-to-extension" }

cooper-sanchez:
  position: Central / attacking midfielder
  updated: July 2026
  status: Watchlist profile
  summary: >-
    Sanchez has unusually substantial MLS experience for an 18-year-old midfielder. His senior evidence is meaningful; the next question is whether he establishes a clear long-term role and an international-level trait that separates him from the other young central midfielders.
  questions: Role definition, positional fit and the development of a repeatable standout trait will determine whether he rises within the pool.

beau-leroux:
  club: San Jose Earthquakes
  position: Central / defensive midfielder
  updated: July 2026
  summary: >-
    Leroux is the late-developing, high-floor midfielder in the group. He covers ground, competes defensively, plays the next progressive pass and arrives late around the box. His balanced senior production makes him easier to project than many younger names.
  strengths: Two-way balance, ground coverage, simple progression, late runs, duel competitiveness and rapid adaptation to a major MLS role.
  questions: Less age runway, no clearly elite trait, an uncertain ceiling against faster international pressure and the possibility that he projects as depth.
  usmnt_case: Coaches can understand and use his profile quickly. Current reliability raises his probability even if his ceiling is lower than several younger prospects.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1626423/beau-leroux" }
    - { label: San Jose Earthquakes, url: "https://www.sjearthquakes.com/players/beau-leroux/" }

francis-westfield:
  club: Philadelphia Union
  position: Right back / left back
  updated: July 2026
  status: Watchlist profile
  summary: >-
    Westfield has meaningful Philadelphia minutes at right back and strong early-career performance indicators. He begins just outside the leading prospect tier because right back offers a more crowded pathway and several younger candidates carry greater projected upside.
  questions: Separating from the right-back competition and proving that the early senior performance is sustainable are the next tests.

cole-campbell:
  club: SV Elversberg
  position: Winger
  updated: July 2026
  summary: >-
    Campbell remains a high-upside winger despite a stalled Dortmund pathway. His defining traits are pace, directness and repeated attacks at the fullback. The move to Elversberg creates the first credible opportunity to convert those tools into regular senior production.
  strengths: Speed, one-on-one threat, runs behind, two-flank flexibility and substantial attacking ceiling.
  questions: Very little senior proof, inconsistent end product, defensive concentration, limited evidence against settled defenses and immediate pressure to justify the transfer.
  usmnt_case: A productive 2026-27 season could move him sharply upward; another year without meaningful minutes would weaken the case.
  sources:
    - { label: Transfer report, url: "https://www.welt.de/regionales/nrw/article6a4f67aebb0cf80de56a345c/rekordtransfer-elversberg-holt-campbell-aus-dortmund.html" }

luca-bombino:
  club: San Diego FC
  position: Left back
  updated: July 2026
  summary: >-
    Bombino is a calmer, more possession-oriented left back than Peyton Miller. He progresses attacks through positioning, combination play and sensible passing under pressure rather than elite explosiveness. He can step inside during buildup and already has meaningful senior minutes.
  strengths: Composure, buildup understanding, combination play, inverted positioning, crossing and senior experience.
  questions: Average rather than elite recovery speed, vulnerability in isolated defensive matchups, disciplinary interruptions and a ceiling that currently looks solid rather than spectacular.
  usmnt_case: His pathway depends on becoming a highly dependable possession fullback at a position with a plausible opening.
  sources:
    - { label: FotMob, url: "https://www.fotmob.com/players/1617160/luca-bombino" }
    - { label: San Diego FC, url: "https://www.sandiegofc.com/players/luca-bombino/" }
