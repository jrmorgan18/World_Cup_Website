        name: Adri Mehmeti
        club: New York Red Bulls
        trend: "→"
        direction: steady
        direction_label: Holding
        context: Suspension
        recap: "Did not play against Orlando while serving the one-match suspension created by his late second yellow against Charlotte. No performance statistics apply this week."
        development_read: "No new performance evaluation. The absence was disciplinary rather than form-related, so his Project 2030 outlook remains even."
        sources:
