  - id: "2026-08-02"
    group: prospects
    group_label: Prospects
    published: "August 3, 2026"
    window: "July 27-August 2, 2026"
    week_ending: "August 2, 2026"
    source_note: "Official club, league and competition reporting prioritized; local club coverage used next, with ESPN and FotMob used only where official post-match detail was unavailable at the reporting cutoff"
    summary:
      biggest_risers: "Neil Pierre, Cavan Sullivan, Francis “Frankie” Westfield, Peyton Miller, Julian Hall, Justin Ellis, Zavier Gozo and Diego Kochen. Philadelphia’s three prospects all produced strong evidence, Miller added an assist from a winger role, Hall and Gozo represented MLS at the All-Star Game, Ellis logged another near-full MLS start, and Kochen paired another Danish top-flight start with a high-level save."
      issues_to_monitor: "Caleb Wiley’s omission from Chelsea’s tour group, and Benjamin Cremaschi and Niko Tsakiris in injury recovery."
      best_story: "Philadelphia’s prospects carried the week in a 3-2 comeback win over Atlanta. Pierre’s 90+6-minute header tied it before the Union completed the turnaround, Westfield started at right back and hit the crossbar while driving the stoppage-time pressure, and Sullivan created chance after chance from the right of midfield, forcing two strong saves."
    players:
      - profile: caleb-wiley
        name: Caleb Wiley
        club: Chelsea
        trend: "?"
        direction: insufficient
        direction_label: No new evidence
        context: Preseason
        recap: "No appearance was verified in Chelsea’s July 28 or August 1 friendlies. Wiley was not included among the 29 players Chelsea said were in Sydney for its Australia and Asia tour."
        development_read: "No performance evaluation this week. His omission makes the next loan or permanent move—and a reliable route to minutes—the immediate development question."
        sources:
          - { label: "Chelsea tour squad (official)", url: "https://www.chelseafc.com/en/news/article/confirmed-chelsea-travelling-squad-for-2026-pre-season-tour" }

      - profile: damion-downs
        name: Damion Downs
        club: Southampton
        trend: "→"
        direction: steady
        direction_label: Holding
        context: Preseason
        recap: "No first-team appearance was verified during the window after Downs scored in Southampton’s July 24 friendly. The club’s next competitive match is the Carabao Cup tie at Colchester in the week beginning August 7."
        development_read: "No new performance evidence. His productive prior outing keeps the outlook steady while the focus shifts to earning a role when competitive play begins."
        sources:
          - { label: "Southampton schedule update (official)", url: "https://www.southamptonfc.com/en/news/article/saints-to-face-colchester-united-in-carabao-cup-first-round" }
          - { label: "Southampton at Braunschweig (official)", url: "https://www.southamptonfc.com/en/news/article/report-downs-hits-first-half-winner-in-braunschweig" }

      - profile: zavier-gozo
        name: Zavier Gozo
        club: Real Salt Lake
        trend: "↑"
        direction: rising
        direction_label: Rising
        context: All-Star
        recap: "Participated in the MLS All-Star Skills Challenge, then played 27 minutes on the left wing in the MLS All-Stars’ 4-3 win over the Liga MX All-Stars after entering in the 63rd minute. At 19 years, 4 months and 2 days, he became RSL’s youngest All-Star and the club’s 13th all-time. He was not listed in RSL’s August 1 matchday squad at St. Louis. After the reporting window, on August 4, Crystal Palace were reported to be in advanced talks to sign him for a fee put at roughly $15 million, with a medical expected during the week. Aston Villa and Atlético Madrid pursued him earlier in the year, and Premier League money is reported to have priced out clubs including Feyenoord and Anderlecht. Neither club had confirmed the move at the time of writing."
        development_read: "The week strengthened his profile through high-level recognition and a lively 27-minute All-Star shift. The exhibition setting limits the scouting weight, but becoming RSL’s youngest All-Star and Utah’s first native MLS All-Star is a meaningful marker. A Premier League move at the reported fee would be the largest step of his career so far and would answer the pathway question quickly, though nothing is signed yet."
        sources:
          - { label: "RSL All-Star feature (official)", url: "https://www.rsl.com/news/2026-highlights-1" }
          - { label: "MLS All-Star roster (official)", url: "https://www.mlssoccer.com/news/2026-mls-all-star-team-roster" }
          - { label: "MLS All-Star lineup and substitutions (secondary)", url: "https://www.espn.com/soccer/match/_/gameId/401864004/liga-mx-all-stars-mls-all-stars" }
          - { label: "Gozo nears Crystal Palace move (Yahoo Sports)", url: "https://uk.sports.yahoo.com/news/sources-zavier-gozo-nears-15-164945054.html" }
          - { label: "RSL transfer context (Salt Lake Tribune)", url: "https://www.sltrib.com/sports/rsl/2026/08/04/why-real-salt-lake-could-be-losing/" }
          - { label: "RSL at St. Louis match center (official MLS)", url: "https://www.mlssoccer.com/competitions/mls-regular-season/2026/matches/stlvsrsl-08-01-2026/" }

      - profile: julian-hall
        name: Julian Hall
        club: New York Red Bulls
        trend: "↑"
        direction: rising
        direction_label: Rising
        context: All-Star
        recap: "Started and played 35 minutes in the MLS All-Star Game, then played the full 90 minutes at forward in Red Bull New York’s 3-2 win over Orlando. He recorded no goal or assist in the league match but produced five shots, three on target."
        development_read: "A senior All-Star start followed by an active full league match strengthens his outlook. The next step is turning consistently dangerous shot volume into another run of goals."
        sources:
          - { label: "Hall’s All-Star selection (official club)", url: "https://www.newyorkredbulls.com/news/red-bull-new-york-forward-julian-hall-named-to-the-2026-mls-all-star-game-presented-by-chime-roster" }
          - { label: "MLS All-Star lineup and substitutions (secondary)", url: "https://www.espn.com/soccer/match/_/gameId/401864004/liga-mx-all-stars-mls-all-stars" }
          - { label: "RBNY vs. Orlando match center (official MLS)", url: "https://www.mlssoccer.com/competitions/mls-regular-season/2026/matches/rbnyvsorl-08-01-2026/" }
          - { label: "RBNY vs. Orlando lineup and stats (secondary)", url: "https://www.espn.com/soccer/match/_/gameId/761696/orlando-city-sc-new-york-red-bulls" }

      - profile: justin-ellis
        name: Justin Ellis
        club: Orlando City
        trend: "↑"
        direction: rising
        direction_label: Rising
        recap: "Started at forward alongside Antoine Griezmann and played 87 minutes in Orlando City’s 3-2 road loss to Red Bull New York. Ellis had no goal or assist, but remained on the field through the Lions’ second-half push from a two-goal deficit to 3-2."
        development_read: "The result was disappointing, but another near-full MLS start is positive evidence of trust in a demanding road match. His current role beside Griezmann gives the creative forward a valuable senior reference point; turning that role into another decisive action is the next test."
        sources:
          - { label: "RBNY vs. Orlando match center (official MLS)", url: "https://www.mlssoccer.com/competitions/mls-regular-season/2026/matches/rbnyvsorl-08-01-2026/" }
          - { label: "RBNY vs. Orlando lineup and events (secondary)", url: "https://www.fotmob.com/matches/red-bull-new-york-vs-orlando-city/haa4lj8" }

