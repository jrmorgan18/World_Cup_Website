      - profile: neil-pierre
        name: Neil Pierre
        club: Philadelphia Union
        trend: "↑↑"
        direction: rising
        direction_label: Rising fast
        recap: "Started at right center back and played the full match in Philadelphia’s 3-2 win over Atlanta. He hit the crossbar with a 43rd-minute header from a corner, and the Union have made him a designed target on every set piece. His 90+6-minute header from open play tied the match 2-2—his second MLS goal of 2026—before the Union completed the comeback. Atlanta had played with 10 men since Enea Mihaj’s 27th-minute red card but still led 2-0 through the 66th minute."
        development_read: "He keeps turning opportunity into end product. A start at center back, a decisive header and back-to-back contributions in the biggest moments all point the same way: this is a genuine riser."
        sources:
          - { label: "Philadelphia vs. Atlanta match center (official MLS)", url: "https://www.mlssoccer.com/competitions/mls-regular-season/2026/matches/phivsatl-08-01-2026/" }
          - { label: "Philadelphia vs. Atlanta lineup and events (secondary)", url: "https://www.espn.com/soccer/match/_/gameId/761702/atlanta-united-fc-philadelphia-union" }

      - profile: chris-brady
        name: Chris Brady
        club: Chicago Fire
        trend: "↑"
        direction: rising
        direction_label: Rebounding
        recap: "Started and played 90 minutes in Chicago’s 2-1 win over Charlotte, conceding once. The result ended the difficult two-loss return described in last week’s report."
        development_read: "A useful response week. One win does not settle the evaluation, but returning immediately to a positive result steadies his post-World Cup trajectory."
        sources:
          - { label: "Chicago vs. Charlotte match center (official MLS)", url: "https://www.mlssoccer.com/competitions/mls-regular-season/2026/matches/chivsclt-08-01-2026/" }
          - { label: "Chicago vs. Charlotte lineup (secondary)", url: "https://www.espn.com/soccer/match/_/gameId/761704/charlotte-fc-chicago-fire-fc" }

      - profile: rokas-pukstas
        name: Rokas Pukstas
        club: Hajduk Split
        trend: "→"
        direction: steady
        direction_label: Holding
        recap: "Started, was booked in the 96th minute and completed all 120 minutes of Hajduk’s July 30 Europa League qualifier at Pafos, a 4-0 extra-time defeat that overturned a 2-0 first-leg lead. He operated in a double pivot alongside Adrion Pajaziti, got a header on the Pafos goal from a 36th-minute corner that was ruled out for a foul, and picked out Marko Livaja with a header in the 93rd minute for a chance that went just past the post. Hajduk used all five substitutions without removing him; he recorded no goal contribution."
        development_read: "The full 120-minute European assignment reflects continued trust, but being part of a midfield that could not protect a two-goal first-leg advantage weakened the week. His response in the Conference League pathway bears watching."
        sources:
          - { label: "Pafos vs. Hajduk lineup (official UEFA)", url: "https://www.uefa.com/uefaeuropaleague/match/2048754--pafos-vs-hajduk-split/lineups/" }
          - { label: "Hajduk match list (official club)", url: "https://hajduk.hr/eng/matches" }
          - { label: "Pafos vs. Hajduk commentary and substitutions (Sky Sports)", url: "https://www.skysports.com/football/pafos-vs-hajduk-split/558255" }
          - { label: "Pafos vs. Hajduk match report (AS)", url: "https://as.com/futbol/internacional/goldar-sostiene-al-pafos-en-europa-f202607-n/" }

      - profile: cavan-sullivan
        name: Cavan Sullivan
        club: Philadelphia Union
        trend: "↑"
        direction: rising
