        development_read: "The week’s strongest competitive development. He converted an opportunity into both production and additional trust."
        sources:
          - { label: "Union vs. RBNY", url: "https://www.philadelphiaunion.com/news/recap-union-return-in-style-with-3-1-rivalry-victory-over-red-bull-new-york" }
